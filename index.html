<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luis' Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #050505;
            --neon-gold: #FFD700;
            --neon-cyan: #00f0ff;
            --text-color: #ffffff;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; margin: 0; min-height: 200vh; }

        /* --- 1. INTRO ANIMATION --- */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            animation: hideLoader 0.5s ease 2s forwards;
        }
        @keyframes hideLoader { to { opacity: 0; visibility: hidden; } }
        .glitch { font-family: 'Orbitron'; font-size: 3rem; color: var(--neon-gold); animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- 2. HEADER & NAGEL-ANIMATION --- */
        header { padding: 100px 20px; text-align: center; }
        h1 { font-family: 'Orbitron'; font-size: 5rem; position: relative; display: inline-block; }
        
        .apostrophe { 
            position: absolute; top: -20px; right: -40px; color: var(--neon-gold);
            animation: hammerDown 1.5s ease-out forwards;
        }
        @keyframes hammerDown {
            0% { transform: translateY(-200px) rotate(45deg); opacity: 0; }
            50% { transform: translateY(0) rotate(0); opacity: 1; }
            70% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }

        /* --- 3. HAMMER --- */
        .hammer-wrapper { display: inline-block; margin-left: 20px; cursor: pointer; transition: 0.3s; }
        #hammer { color: var(--neon-gold); font-size: 3rem; text-shadow: 0 0 20px var(--neon-gold); }
        .hammer-wrapper:hover #hammer { transform: rotate(180deg) scale(1.2); }

        /* --- 4. GRID --- */
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }
        .tool-card { 
            background: #111; padding: 40px; border: 1px solid #333; border-radius: 20px;
            text-decoration: none; color: white; transition: 0.3s; display: block;
        }
        .tool-card:hover { border-color: var(--neon-gold); box-shadow: 0 0 20px rgba(255,215,0,0.2); }

        /* --- 5. MODAL (Kein Inhalt) --- */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content { background: #222; padding: 50px; border: 2px solid var(--neon-gold); }
    </style>
</head>
<body>

    <div id="loader"><div class="glitch">SYSTEM BOOT...</div></div>

    <header>
        <h1>Luis<span class="apostrophe">'</span>s Tools 
            <div class="hammer-wrapper"><i class="fa-solid fa-hammer" id="hammer"></i></div>
        </h1>
    </header>

    <div class="container">
        <div class="tools-grid" id="grid">
            <!-- JS generiert hier Karten -->
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Hier gibts (noch) nichts zu sehen!</h2>
            <button onclick="document.getElementById('modal').classList.remove('active')">Schließen</button>
        </div>
    </div>

    <script>
        // Mehr Inhalt generieren
        const grid = document.getElementById('grid');
        for(let i=1; i<=9; i++) {
            grid.innerHTML += `<a href="#" class="tool-card" onclick="document.getElementById('modal').classList.add('active')">
                <h3>Tool ${i}</h3><p>Beschreibung des Tools...</p>
            </a>`;
        }

        // Hammer Scroll Drehung
        window.addEventListener('scroll', () => {
            const h = document.getElementById('hammer');
            h.style.transform = `rotate(${window.scrollY / 2}deg)`;
        });
    </script>
</body>
</html>
