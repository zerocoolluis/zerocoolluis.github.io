<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO's Tools // Main Hub</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #03050a;
            --card-bg: rgba(8, 12, 22, 0.85);
            --border-color: rgba(0, 240, 255, 0.25);
            --neon-gold: #FFD700;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Partikel-Hintergrund */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: pageEntrance 1s ease 0.3s forwards;
        }

        @keyframes pageEntrance { 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Header & Hammer */
        header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            display: inline-flex;
            align-items: center;
            gap: 20px;
            color: var(--text-color);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .hammer-wrapper {
            display: inline-block;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .hammer-wrapper:hover { transform: rotate(-50deg) scale(1.35); }

        #hammer {
            color: var(--neon-gold);
            font-size: 3.2rem;
            text-shadow: 0 0 30px var(--neon-gold);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 15px;
            letter-spacing: 1.5px;
        }

        /* Grid & Karten (als Links) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 35px;
            text-decoration: none;
            color: var(--text-color);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: block;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 20px; height: 20px;
            border-bottom: 2px solid var(--neon-cyan);
            border-right: 2px solid var(--neon-cyan);
            transition: all 0.4s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-cyan);
            box-shadow: 0 15px 40px rgba(0, 240, 255, 0.2);
        }

        .card:hover::before { opacity: 1; }
        .card:hover::after {
            width: 100%; height: 100%;
            border-color: rgba(0, 240, 255, 0.35);
        }

        .card-icon-container {
            font-size: 3rem;
            margin-bottom: 25px;
            height: 60px;
            display: flex;
            align-items: center;
        }

        /* Spezifische Hover-Effekte für die Icons */
        .gamepad-icon { color: var(--neon-pink); transition: transform 0.2s ease; }
        .card:hover .gamepad-icon { transform: scale(1.15) rotate(5deg); }

        .book-icon { color: var(--neon-cyan); transition: transform 0.4s ease; }
        .card:hover .book-icon { transform: scale(1.15) rotate(-8deg); }

        .toolbox-icon { color: var(--neon-gold); transition: transform 0.4s ease; }
        .card:hover .toolbox-icon { transform: scale(1.15) translateY(-4px); }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <h1>
                ZERO's Tools 
                <div class="hammer-wrapper">
                    <i class="fa-solid fa-hammer" id="hammer"></i>
                </div>
            </h1>
            <p class="subtitle">Wähle eine Kategorie, um auf deine Tools zuzugreifen</p>
        </header>

        <!-- Hauptseiten Grid mit Links zu den Unterseiten -->
        <div class="grid">
            <!-- Gaming Unterseite (Ändere den Pfad zu 'gaming.html', falls du keine Ordner nutzt) -->
            <a href="gaming/" class="card">
                <div class="card-icon-container">
                    <i class="fa-solid fa-gamepad gamepad-icon"></i>
                </div>
                <div class="card-title">Gaming</div>
                <div class="card-desc">Mods, Server-Helfer, Konfigurations-Tools und Gamer-Utilities.</div>
            </a>

            <!-- School Unterseite -->
            <a href="school/" class="card">
                <div class="card-icon-container">
                    <i class="fa-solid fa-book-open book-icon"></i>
                </div>
                <div class="card-title">School</div>
                <div class="card-desc">Lernskripte, Rechner, Notizen-Tools und Schul-Organisation.</div>
            </a>

            <!-- Utilities Unterseite -->
            <a href="utilities/" class="card">
                <div class="card-icon-container">
                    <i class="fa-solid fa-toolbox toolbox-icon"></i>
                </div>
                <div class="card-title">Utilities</div>
                <div class="card-desc">Hardware-Monitore, Backup-Tools und praktische Alltagshelfer.</div>
            </a>
        </div>
    </div>

    <script>
        // Partikel-Hintergrund
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speedX: (Math.random() - 0.5) * 0.5,
                speedY: (Math.random() - 0.5) * 0.5
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Hammer Scroll-Effekt
        window.addEventListener('scroll', () => {
            const hammer = document.getElementById('hammer');
            hammer.style.transform = `rotate(${window.scrollY * 0.4}deg)`;
        });
    </script>
</body>
</html>
