<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEROS TOOL HUB // by Zerocoolluis</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #03050a;
            --card-bg: rgba(8, 12, 22, 0.85);
            --border-color: rgba(0, 240, 255, 0.25);
            --neon-gold: #FFD700;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-purple: #9d00ff;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Dynamischer Partikel-Hintergrund */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: pageEntrance 0.8s ease forwards;
        }

        @keyframes pageEntrance { 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* --- HEADER & STICKY TRANSITION --- */
        header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: var(--text-color);
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            letter-spacing: 2px;
            margin-bottom: 10px;
            transition: font-size 0.4s ease;
        }

        .creator-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--neon-cyan);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transition: opacity 0.3s ease;
        }

        /* Scroll-Zustand: Header wird zur kompakten Leiste */
        header.scrolled {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(3, 5, 10, 0.9);
            backdrop-filter: blur(15px);
            padding: 15px 20px;
            margin-bottom: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--neon-cyan);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        header.scrolled .main-title {
            font-size: 1.6rem;
            margin-bottom: 0;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        header.scrolled .creator-tag {
            font-size: 0.9rem;
        }

        .content-spacer {
            height: 80px; /* Platzhalter, wenn Header sticky wird */
            display: none;
        }

        /* --- GRID & KARTEN --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 30px;
            text-decoration: none;
            color: var(--text-color);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: block;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 20px; height: 20px;
            border-bottom: 2px solid var(--neon-cyan);
            border-right: 2px solid var(--neon-cyan);
            transition: all 0.4s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--neon-cyan);
            box-shadow: 0 15px 40px rgba(0, 240, 255, 0.2);
        }

        .card:hover::before { opacity: 1; }
        .card:hover::after {
            width: 100%; height: 100%;
            border-color: rgba(0, 240, 255, 0.35);
        }

        .card-icon-container {
            font-size: 3rem;
            margin-bottom: 25px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* --- SPEZIELLE HOVER-ANIMATIONEN --- */

        /* 1. GAMING: Tastatur, die beim Hover aufleuchtet */
        .keyboard-icon {
            color: var(--text-muted);
            transition: all 0.3s ease;
        }
        .card:hover .keyboard-icon {
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            transform: scale(1.1);
        }

        /* 2. SCHOOL: Lampe, die beim Drüberfahren aufleuchtet */
        .lamp-icon {
            color: var(--text-muted);
            transition: all 0.3s ease;
        }
        .card:hover .lamp-icon {
            color: var(--neon-gold);
            text-shadow: 0 0 25px var(--neon-gold), 0 0 50px rgba(255, 215, 0, 0.6);
            transform: scale(1.1) translateY(-3px);
        }

        /* 3. UTILITIES: Drei Zahnräder, die sich drehen */
        .gears-container {
            display: flex;
            gap: 10px;
            font-size: 2.2rem;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }
        .card:hover .gears-container {
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
        }
        .card:hover .gear-1 { animation: rotateGearCW 2s linear infinite; }
        .card:hover .gear-2 { animation: rotateGearCCW 2s linear infinite; }
        .card:hover .gear-3 { animation: rotateGearCW 1.5s linear infinite; }

        @keyframes rotateGearCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotateGearCCW {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @media(max-width: 768px) {
            .main-title { font-size: 2.5rem; }
            header.scrolled .main-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <!-- Hauptkopf mit Titel & Creator Tag -->
        <header id="mainHeader">
            <h1 class="main-title">ZEROS TOOL HUB</h1>
            <div class="creator-tag">by Zerocoolluis</div>
        </header>
        <div class="content-spacer" id="spacer"></div>

        <!-- Kategorien Grid -->
        <div class="grid">
            <!-- Gaming (Tastatur) -->
            <a href="gaming/" class="card">
                <div class="card-icon-container">
                    <i class="fa-solid fa-keyboard keyboard-icon"></i>
                </div>
                <div class="card-title">Gaming</div>
                <div class="card-desc">Mods, Server-Helfer, Konfigurations-Tools und Gamer-Utilities.</div>
            </a>

            <!-- School (Lampe) -->
            <a href="school/" class="card">
                <div class="card-icon-container">
                    <i class="fa-solid fa-lightbulb lamp-icon"></i>
                </div>
                <div class="card-title">School</div>
                <div class="card-desc">Lernskripte, Rechner, Notizen-Tools und Schul-Organisation.</div>
            </a>

            <!-- Utilities (Zahnräder) -->
            <a href="utilities/" class="card">
                <div class="card-icon-container">
                    <div class="gears-container">
                        <i class="fa-solid fa-gear gear-1"></i>
                        <i class="fa-solid fa-gears gear-2" style="font-size: 1.8rem; align-self: flex-end;"></i>
                        <i class="fa-solid fa-gear gear-3" style="font-size: 1.4rem;"></i>
                    </div>
                </div>
                <div class="card-title">Utilities</div>
                <div class="card-desc">Hardware-Monitore, Backup-Tools und praktische Alltagshelfer.</div>
            </a>
        </div>
    </div>

    <script>
        // --- PARTIKEL HINTERGRUND ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speedX: (Math.random() - 0.5) * 0.5,
                speedY: (Math.random() - 0.5) * 0.5
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- STICKY / SHRINKING HEADER BEIM SCROLLEN ---
        window.addEventListener('scroll', () => {
            const header = document.getElementById('mainHeader');
            const spacer = document.getElementById('spacer');
            
            if (window.scrollY > 80) {
                header.classList.add('scrolled');
                spacer.style.display = 'block';
            } else {
                header.classList.remove('scrolled');
                spacer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
