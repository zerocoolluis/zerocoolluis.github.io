<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letra-Mix Multiplayer</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 { margin-bottom: 5px; color: var(--primary); }
        .subtitle { font-size: 0.9rem; color: #64748b; margin-bottom: 20px; }

        #dict-status {
            font-size: 0.85rem;
            padding: 8px;
            border-radius: 6px;
            background: #fef3c7;
            color: #d97706;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Setup Phase für Spieler */
        #setup-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 10px;
        }

        .player-input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }

        #player-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        .player-chip {
            background: #e2e8f0;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-chip span { cursor: pointer; color: #dc2626; }

        /* Spiel-Ansicht */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f5f9;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #timer { color: #dc2626; font-size: 1.2rem; }
        #active-player-display { color: var(--primary); font-size: 1.2rem; }

        .pool-container { margin: 20px 0; }
        .pool-label { font-size: 0.9rem; color: #64748b; margin-bottom: 8px; }

        .dice-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 60px;
            padding: 10px;
            background: #e2e8f0;
            border-radius: 8px;
        }

        .die {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            user-select: none;
            position: relative;
        }

        .die:hover:not(.used) {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .die.used { opacity: 0.3; cursor: not-allowed; background: #94a3b8; }
        .die-value { font-size: 1.1rem; line-height: 1; }
        .die-points { font-size: 0.65rem; color: #64748b; position: absolute; bottom: 3px; right: 5px; }

        .builder-section {
            margin: 20px 0;
            padding: 15px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
        }

        #current-word {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            min-height: 40px;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: #64748b; }
        button.secondary:hover { background-color: #475569; }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        /* Scoreboard & Liste */
        .scoreboard {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
        }

        .box {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            background: #fafafa;
            max-height: 180px;
            overflow-y: auto;
        }

        .box h3 { margin: 0 0 10px 0; font-size: 1rem; color: #64748b; }
        ul { list-style: none; padding: 0; margin: 0; }
        ul li { padding: 4px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 0.9rem; }

        #message { margin-top: 10px; font-weight: bold; min-height: 24px; }
        .success { color: #16a34a; }
        .error { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h1>Letra-Mix Multiplayer</h1>
    <div class="subtitle">Spiele mit Freunden gegen die Zeit und das Online-Wörterbuch!</div>

    <div id="dict-status">Lade Wörterbuch aus dem Netz... Bitte warten.</div>

    <!-- SPIELER HINZUFÜGEN -->
    <div id="setup-section">
        <h3>Mitspieler eintragen:</h3>
        <div class="player-input-group">
            <input type="text" id="player-name-input" placeholder="Name des Freundes...">
            <button onclick="addPlayer()">Hinzufügen</button>
        </div>
        <div id="player-chips"></div>
        <br>
        <button id="start-btn" onclick="startGame()" disabled style="width: 100%;">Spiel starten</button>
    </div>

    <!-- HAUPTSPIEL BEREICH -->
    <div id="game-area" style="display: none;">
        <div class="game-header">
            <div>Am Zug: <span id="active-player-display">-</span></div>
            <div>Zeit: <span id="timer">02:30</span></div>
            <button class="secondary" onclick="nextPlayer()" style="padding: 5px 10px; font-size: 0.85rem;">Spieler wechseln</button>
        </div>

        <div class="pool-container">
            <div class="pool-label">Verfügbare Buchstaben:</div>
            <div id="dice-pool" class="dice-pool"></div>
        </div>

        <div class="builder-section">
            <div id="current-word">Wort zusammenstellen...</div>
            <div class="btn-group">
                <button class="secondary" onclick="clearCurrentWord()">Zurücksetzen</button>
                <button onclick="submitWord()" id="submit-btn">Wort einreichen</button>
            </div>
        </div>

        <div id="message"></div>

        <div class="scoreboard">
            <div class="box">
                <h3>Punktestand</h3>
                <ul id="score-list"></ul>
            </div>
            <div class="box">
                <h3>Gefundene Wörter</h3>
                <ul id="valid-words"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    const letterPoints = {
        'A': 1, 'B': 3, 'C': 4, 'D': 1, 'E': 1, 'F': 4, 'G': 2, 'H': 2, 'I': 1,
        'J': 6, 'K': 4, 'L': 2, 'M': 3, 'N': 1, 'O': 2, 'P': 4, 'Q': 10, 'R': 1,
        'S': 1, 'T': 1, 'U': 1, 'V': 6, 'W': 3, 'X': 8, 'Y': 10, 'Z': 3
    };

    const diceSets = [
        ['A', 'E', 'I', 'O', 'U', 'R'], ['B', 'C', 'D', 'F', 'G', 'H'],
        ['L', 'M', 'N', 'P', 'S', 'T'], ['A', 'E', 'I', 'S', 'T', 'N'],
        ['D', 'G', 'H', 'N', 'R', 'S'], ['E', 'I', 'R', 'S', 'T', 'U'],
        ['B', 'M', 'P', 'W', 'Z', 'K'], ['A', 'O', 'U', 'L', 'F', 'V'],
        ['E', 'I', 'N', 'R', 'S', 'T'], ['C', 'D', 'G', 'L', 'N', 'T'],
        ['A', 'E', 'H', 'R', 'S', 'D'], ['I', 'O', 'M', 'N', 'P', 'T'],
        ['Q', 'X', 'Y', 'Z', 'J', 'B']
    ];

    let globalDictionary = new Set();
    let players = []; // Speichert Objekte: { name, score, words: Set }
    let activePlayerIndex = 0;
    let timeLeft = 150;
    let timerInterval = null;
    let currentPool = [];
    let selectedIndices = [];

    // Stabiles Online-Wörterbuch laden mit Fallback
    async function loadDictionary() {
        const statusEl = document.getElementById('dict-status');
        const startBtn = document.getElementById('start-btn');
        
        // Lokales Fallback, falls Internet/CDN blockiert
        const fallbackWords = ["HAUS", "MAUS", "BAUM", "AUTO", "KATZE", "HUND", "SCHULE", "TISCH", "STUHL", "BUCH", "LAMPE", "APFEL", "BANANE", "WASSER", "MILCH", "BROT", "SONNE", "MOND", "STERN", "BLUME", "VOGEL", "FISCH", "SPIEL", "WORT", "BRIEF", "GELD", "LAND", "WELT", "ZEIT", "JAHR", "TAG", "NACHT", "STADT", "DORF", "STRASSE", "WEG"];

        try {
            // Nutzung einer kompakten, sauberen JSON-Wörterliste von GitHub
            const response = await fetch('https://raw.githubusercontent.com/Jonny-exe/German-Words-Library/master/German-words-5000-words.json');
            if (!response.ok) throw new Error('Netzwerkfehler');
            const data = await response.json();
            
            globalDictionary = new Set(data.map(w => w.toUpperCase()));
            
            statusEl.style.background = '#dcfce7';
            statusEl.style.color = '#16a34a';
            statusEl.innerText = `Wörterbuch bereit (${globalDictionary.size} Wörter geladen)!`;
        } catch (error) {
            console.warn("Online-Laden fehlgeschlagen, nutze internes Fallback.", error);
            globalDictionary = new Set(fallbackWords);
            statusEl.style.background = '#fef3c7';
            statusEl.style.color = '#d97706';
            statusEl.innerText = 'Offline-Modus aktiv (Basis-Wörterbuch geladen).';
        }
        
        startBtn.disabled = false;
    }

    loadDictionary();

    function addPlayer() {
        const input = document.getElementById('player-name-input');
        const name = input.value.trim();
        if(!name) return;

        if(players.some(p => p.name === name)) {
            alert("Dieser Name existiert bereits!");
            return;
        }

        players.push({ name: name, score: 0, words: new Set() });
        input.value = '';
        renderPlayersSetup();
    }

    function removePlayer(index) {
        players.splice(index, 1);
        renderPlayersSetup();
    }

    function renderPlayersSetup() {
        const container = document.getElementById('player-chips');
        container.innerHTML = '';
        players.forEach((p, idx) => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            chip.innerHTML = `${p.name} <span onclick="removePlayer(${idx})">&times;</span>`;
            container.appendChild(chip);
        });
    }

    function startGame() {
        if(players.length === 0) {
            alert("Bitte füge mindestens einen Spieler hinzu!");
            return;
        }

        document.getElementById('setup-section').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        
        // Reset Spielerdaten
        players.forEach(p => { p.score = 0; p.words.clear(); });
        activePlayerIndex = 0;
        
        initNewRound();
    }

    function initNewRound() {
        clearInterval(timerInterval);
        timeLeft = 150;
        selectedIndices = [];
        document.getElementById('message').innerText = '';

        // Würfel neu werfen
        currentPool = diceSets.map(set => {
            const randomLetter = set[Math.floor(Math.random() * set.length)];
            return { letter: randomLetter, used: false };
        });

        document.getElementById('active-player-display').innerText = players[activePlayerIndex].name;
        renderPool();
        updateCurrentWordDisplay();
        updateScoreboard();
        startTimer();
    }

    function startTimer() {
        const timerDisplay = document.getElementById('timer');
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            timerDisplay.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert(`Zeit um für ${players[activePlayerIndex].name}! Nächster Spieler ist dran.`);
                nextPlayer();
            }
        }, 1000);
    }

    function nextPlayer() {
        activePlayerIndex = (activePlayerIndex + 1) % players.length;
        initNewRound();
    }

    function renderPool() {
        const poolEl = document.getElementById('dice-pool');
        poolEl.innerHTML = '';
        currentPool.forEach((die, index) => {
            const dieDiv = document.createElement('div');
            dieDiv.className = `die ${die.used ? 'used' : ''}`;
            dieDiv.innerHTML = `
                <span class="die-value">${die.letter}</span>
                <span class="die-points">${letterPoints[die.letter] || 1}</span>
            `;
            if (!die.used) {
                dieDiv.onclick = () => selectDie(index);
            }
            poolEl.appendChild(dieDiv);
        });
    }

    function selectDie(poolIndex) {
        currentPool[poolIndex].used = true;
        selectedIndices.push(poolIndex);
        renderPool();
        updateCurrentWordDisplay();
    }

    function clearCurrentWord() {
        selectedIndices.forEach(poolIndex => { currentPool[poolIndex].used = false; });
        selectedIndices = [];
        renderPool();
        updateCurrentWordDisplay();
        document.getElementById('message').innerText = '';
    }

    function updateCurrentWordDisplay() {
        const wordText = selectedIndices.map(i => currentPool[i].letter).join('');
        document.getElementById('current-word').innerText = wordText || "Wort zusammenstellen...";
    }

    function submitWord() {
        const word = selectedIndices.map(i => currentPool[i].letter).join('');
        const msgEl = document.getElementById('message');
        const currentPlayer = players[activePlayerIndex];

        if (word.length < 2) {
            msgEl.className = "error";
            msgEl.innerText = "Mindestens 2 Buchstaben erforderlich!";
            return;
        }

        if (currentPlayer.words.has(word)) {
            msgEl.className = "error";
            msgEl.innerText = "Du hast dieses Wort bereits gelegt!";
            return;
        }

        if (globalDictionary.has(word)) {
            currentPlayer.words.add(word);
            let wordScore = word.split('').reduce((sum, l) => sum + (letterPoints[l] || 1), 0);
            currentPlayer.score += wordScore;

            updateScoreboard();

            // Wort zur Ansicht hinzufügen
            const listEl = document.getElementById('valid-words');
            const li = document.createElement('li');
            li.innerHTML = `<span><b>${currentPlayer.name}:</b> ${word}</span> <strong>+${wordScore}</strong>`;
            listEl.prepend(li);

            msgEl.className = "success";
            msgEl.innerText = `Super! +${wordScore} Punkte`;

            selectedIndices = [];
            currentPool.forEach(d => d.used = false);
            renderPool();
            updateCurrentWordDisplay();
        } else {
            msgEl.className = "error";
            msgEl.innerText = `"${word}" ist laut Wörterbuch ungültig!`;
        }
    }

    function updateScoreboard() {
        const scoreList = document.getElementById('score-list');
        scoreList.innerHTML = '';
        // Sortiere Spieler nach Punkten (Höchste zuerst)
        const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
        
        sortedPlayers.forEach(p => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${p.name}</span> <strong>${p.score} Pkt</strong>`;
            scoreList.appendChild(li);
        });
    }
</script>

</body>
</html>
