<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letra-Mix Online mit Profi-Wörterbuch</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 { margin-bottom: 5px; color: var(--primary); }
        .subtitle { font-size: 0.9rem; color: #64748b; margin-bottom: 20px; }

        #dict-status {
            font-size: 0.85rem;
            padding: 6px;
            border-radius: 6px;
            background: #fef3c7;
            color: #d97706;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        #timer { color: #dc2626; }

        .pool-container { margin: 20px 0; }
        .pool-label { font-size: 0.9rem; color: #64748b; margin-bottom: 8px; }

        .dice-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 60px;
            padding: 10px;
            background: #e2e8f0;
            border-radius: 8px;
        }

        .die {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            user-select: none;
            position: relative;
        }

        .die:hover:not(.used) {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 6px 8px -1px rgba(79, 70, 229, 0.2);
        }

        .die.used {
            opacity: 0.3;
            cursor: not-allowed;
            background: #94a3b8;
        }

        .die-value { font-size: 1.1rem; line-height: 1; }
        .die-points { font-size: 0.65rem; color: #64748b; position: absolute; bottom: 3px; right: 5px; }

        .builder-section {
            margin: 20px 0;
            padding: 15px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
        }

        #current-word {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            min-height: 40px;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; }

        button {
            background-color: var(--primary);
            color: white;
            border: Hund;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: #64748b; }
        button.secondary:hover { background-color: #475569; }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; }

        .word-list-container {
            text-align: left;
            margin-top: 20px;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            background: #fafafa;
        }

        .word-list-container h3 { margin: 0 0 10px 0; font-size: 1rem; color: #64748b; }
        #valid-words { list-style: none; padding: 0; margin: 0; }
        #valid-words li {
            padding: 5px 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        #message { margin-top: 10px; font-weight: bold; min-height: 24px; }
        .success { color: #16a34a; }
        .error { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h1>Letra-Mix</h1>
    <div class="subtitle">Das ultimative Buchstabenspiel mit Online-Wörterbuch</div>

    <div id="dict-status">Lade deutsches Online-Wörterbuch... Bitte warten.</div>

    <div class="stats-bar">
        <div>Zeit: <span id="timer">02:30</span></div>
        <div>Punkte: <span id="score">0</span></div>
    </div>

    <button id="start-btn" onclick="startGame()" disabled>Wörterbuch wird geladen...</button>

    <div id="game-area" style="display: none;">
        <div class="pool-container">
            <div class="pool-label">Verfügbare Buchstaben (Klicken zum Auswählen):</div>
            <div id="dice-pool" class="dice-pool"></div>
        </div>

        <div class="builder-section">
            <div id="current-word">Wort zusammenstellen...</div>
            <div class="btn-group">
                <button class="secondary" onclick="clearCurrentWord()">Zurücksetzen</button>
                <button onclick="submitWord()" id="submit-btn">Wort einreichen</button>
            </div>
        </div>

        <div id="message"></div>

        <div class="word-list-container">
            <h3>Gefundene Wörter:</h3>
            <ul id="valid-words"></ul>
        </div>
    </div>
</div>

<script>
    const letterPoints = {
        'A': 1, 'B': 3, 'C': 4, 'D': 1, 'E': 1, 'F': 4, 'G': 2, 'H': 2, 'I': 1,
        'J': 6, 'K': 4, 'L': 2, 'M': 3, 'N': 1, 'O': 2, 'P': 4, 'Q': 10, 'R': 1,
        'S': 1, 'T': 1, 'U': 1, 'V': 6, 'W': 3, 'X': 8, 'Y': 10, 'Z': 3
    };

    const diceSets = [
        ['A', 'E', 'I', 'O', 'U', 'R'],
        ['B', 'C', 'D', 'F', 'G', 'H'],
        ['L', 'M', 'N', 'P', 'S', 'T'],
        ['A', 'E', 'I', 'S', 'T', 'N'],
        ['D', 'G', 'H', 'N', 'R', 'S'],
        ['E', 'I', 'R', 'S', 'T', 'U'],
        ['B', 'M', 'P', 'W', 'Z', 'K'],
        ['A', 'O', 'U', 'L', 'F', 'V'],
        ['E', 'I', 'N', 'R', 'S', 'T'],
        ['C', 'D', 'G', 'L', 'N', 'T'],
        ['A', 'E', 'H', 'R', 'S', 'D'],
        ['I', 'O', 'M', 'N', 'P', 'T'],
        ['Q', 'X', 'Y', 'Z', 'J', 'B']
    ];

    let globalDictionary = new Set();
    let timeLeft = 150;
    let timerInterval = null;
    let score = 0;
    let currentPool = [];
    let selectedIndices = [];
    let foundWords = new Set();

    // Online-Wörterbuch beim Start der Seite im Hintergrund laden (Open-Source German Wordlist)
    async function loadDictionary() {
        const statusEl = document.getElementById('dict-status');
        const startBtn = document.getElementById('start-btn');
        try {
            // Wir laden eine öffentlich verfügbare, riesige Liste deutscher Wörter (Raw Text)
            const response = await fetch('https://raw.githubusercontent.com/matthewreid/German-Word-List/master/german.txt');
            if (!response.ok) throw new Error('Netzwerkfehler');
            const text = await response.text();
            
            // Jede Zeile ein Wort, umwandeln in Großbuchstaben für den direkten Abgleich
            const words = text.split('\n');
            globalDictionary = new Set(words.map(w => w.trim().toUpperCase()).filter(w => w.length > 0));
            
            statusEl.style.background = '#dcfce7';
            statusEl.style.color = '#16a34a';
            statusEl.innerText = `Wörterbuch erfolgreich geladen (${globalDictionary.size} Wörter online verfügbar)!`;
            
            startBtn.disabled = false;
            startBtn.innerText = 'Spiel starten';
        } catch (error) {
            console.error(error);
            statusEl.style.background = '#fee2e2';
            statusEl.style.color = '#dc2626';
            statusEl.innerText = 'Fehler beim Laden des Online-Wörterbuchs. Bitte Seite neu laden.';
        }
    }

    loadDictionary();

    function startGame() {
        clearInterval(timerInterval);
        timeLeft = 150;
        score = 0;
        foundWords.clear();
        selectedIndices = [];
        document.getElementById('score').innerText = score;
        document.getElementById('valid-words').innerHTML = '';
        document.getElementById('message').innerText = '';
        document.getElementById('game-area').style.display = 'block';
        document.getElementById('start-btn').innerText = 'Neues Spiel';

        currentPool = diceSets.map(set => {
            const randomLetter = set[Math.floor(Math.random() * set.length)];
            return { letter: randomLetter, used: false };
        });

        renderPool();
        updateCurrentWordDisplay();
        startTimer();
    }

    function startTimer() {
        const timerDisplay = document.getElementById('timer');
        timerInterval = setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            timerDisplay.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endGame();
            }
        }, 1000);
    }

    function renderPool() {
        const poolEl = document.getElementById('dice-pool');
        poolEl.innerHTML = '';
        currentPool.forEach((die, index) => {
            const dieDiv = document.createElement('div');
            dieDiv.className = `die ${die.used ? 'used' : ''}`;
            dieDiv.innerHTML = `
                <span class="die-value">${die.letter}</span>
                <span class="die-points">${letterPoints[die.letter] || 1}</span>
            `;
            if (!die.used) {
                dieDiv.onclick = () => selectDie(index);
            }
            poolEl.appendChild(dieDiv);
        });
    }

    function selectDie(poolIndex) {
        currentPool[poolIndex].used = true;
        selectedIndices.push(poolIndex);
        renderPool();
        updateCurrentWordDisplay();
    }

    function clearCurrentWord() {
        selectedIndices.forEach(poolIndex => {
            currentPool[poolIndex].used = false;
        });
        selectedIndices = [];
        renderPool();
        updateCurrentWordDisplay();
        document.getElementById('message').innerText = '';
    }

    function updateCurrentWordDisplay() {
        const wordText = selectedIndices.map(i => currentPool[i].letter).join('');
        document.getElementById('current-word').innerText = wordText || "Wort zusammenstellen...";
    }

    function submitWord() {
        const word = selectedIndices.map(i => currentPool[i].letter).join('');
        const msgEl = document.getElementById('message');

        if (word.length < 2) {
            msgEl.className = "error";
            msgEl.innerText = "Ein Wort muss mindestens 2 Buchstaben haben!";
            return;
        }

        if (foundWords.has(word)) {
            msgEl.className = "error";
            msgEl.innerText = "Du hast dieses Wort bereits gefunden!";
            return;
        }

        // Prüfung gegen die riesige Online-Datenbank
        if (globalDictionary.has(word)) {
            foundWords.add(word);
            let wordScore = word.split('').reduce((sum, l) => sum + (letterPoints[l] || 1), 0);
            score += wordScore;
            document.getElementById('score').innerText = score;

            const listEl = document.getElementById('valid-words');
            const li = document.createElement('li');
            li.innerHTML = `<span>${word}</span> <strong>+${wordScore} Pkt</strong>`;
            listEl.prepend(li);

            msgEl.className = "success";
            msgEl.innerText = `Gültiges Wort! +${wordScore} Punkte`;

            selectedIndices = [];
            currentPool.forEach(d => d.used = false);
            renderPool();
            updateCurrentWordDisplay();
        } else {
            msgEl.className = "error";
            msgEl.innerText = `"${word}" existiert laut Online-Datenbank nicht!`;
        }
    }

    function endGame() {
        document.getElementById('dice-pool').innerHTML = '<strong>Zeit abgelaufen! Spiel beendet.</strong>';
        document.getElementById('submit-btn').disabled = true;
    }
</script>

</body>
</html>
