<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherForge // ZERO'S TOOL HUB</title>
    <meta name="description" content="Wettervorhersage mit Standort, Favoriten und 3-Tage-Übersicht – kostenlos ohne API-Key." />

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* === Basis (Hub-Stil) === */
        :root {
            --bg-color: #0a0e1a;
            --card-bg: rgba(18, 25, 45, 0.8);
            --border-color: rgba(91, 154, 255, 0.25);
            --primary: #5b9aff;
            --primary-glow: rgba(91, 154, 255, 0.4);
            --accent-gold: #f0c27f;
            --accent-pink: #ff6b6b;
            --text-color: #eef2f8;
            --text-muted: #9aa8c7;
            --card-radius: 24px;
            --input-radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 30px 20px 60px;
            position: relative;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 12px 24px;
            border-radius: var(--card-radius);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateX(-4px);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .menu-container { position: relative; }
        .menu-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--primary);
            width: 55px;
            height: 55px;
            border-radius: var(--card-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .menu-toggle:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.05) rotate(90deg);
        }

        .dropdown-menu {
            position: absolute;
            top: 65px;
            right: 0;
            width: 240px;
            background: rgba(10, 14, 26, 0.96);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .dropdown-menu.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .dropdown-item {
            padding: 14px 20px;
            color: var(--text-color);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover {
            background: rgba(91,154,255,0.15);
            color: var(--primary);
            padding-left: 26px;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 20px rgba(91,154,255,0.15));
        }

        .subhead {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* === Suche & Standort === */
        .search-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 2rem 2.2rem;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            align-items: center;
            position: relative;
        }
        .search-section input {
            flex: 3;
            min-width: 220px;
            padding: 16px 22px;
            border-radius: var(--input-radius);
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.06);
            color: var(--text-color);
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }
        .search-section input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
        }
        .search-section input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }
        .search-section .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .search-section button {
            padding: 16px 28px;
            border-radius: var(--input-radius);
            border: none;
            background: var(--primary);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(91,154,255,0.3);
        }
        .search-section button:hover {
            background: #4a8aff;
            transform: scale(1.03);
            box-shadow: 0 8px 30px var(--primary-glow);
        }
        .search-section .btn-secondary {
            background: rgba(255,255,255,0.08);
            box-shadow: none;
        }
        .search-section .btn-secondary:hover {
            background: rgba(255,255,255,0.18);
        }

        /* === Autocomplete-Vorschläge === */
        .autocomplete-list {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--input-radius);
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 100;
            padding: 6px 0;
        }
        .autocomplete-list.visible {
            display: block;
        }
        .autocomplete-item {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.2s;
            font-size: 0.95rem;
        }
        .autocomplete-item:hover {
            background: rgba(91,154,255,0.15);
            color: var(--text-color);
        }

        /* === Favoriten-Übersicht === */
        .favorites-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.5rem 2rem;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }
        .favorites-section .header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .favorites-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .fav-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 8px 18px 8px 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.95rem;
        }
        .fav-item:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
        }
        .fav-item .temp {
            font-weight: 700;
            color: var(--primary);
        }
        .fav-item .remove-fav {
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.1rem;
        }
        .fav-item .remove-fav:hover {
            color: var(--accent-pink);
            transform: scale(1.2);
        }
        .no-favs {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* === Wetterkarten === */
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        @media (max-width: 900px) {
            .weather-grid { grid-template-columns: 1fr; }
        }

        .weather-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 2rem 2.2rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            transition: 0.3s;
        }
        .weather-card:hover {
            border-color: var(--primary);
            box-shadow: 0 25px 60px var(--primary-glow);
        }

        .weather-card .city-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 2px;
        }
        .weather-card .city-date {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 18px;
        }
        .weather-card .main-weather {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 20px;
        }
        .weather-card .main-weather img {
            width: 100px;
            height: 100px;
            filter: drop-shadow(0 0 20px rgba(91,154,255,0.3));
        }
        .weather-card .main-weather .temp {
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1;
        }
        .weather-card .main-weather .desc {
            color: var(--text-muted);
            font-size: 1.2rem;
        }
        .weather-card .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
            margin-top: 14px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }
        .weather-card .details span {
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .weather-card .details .value {
            color: var(--text-color);
            font-weight: 600;
        }
        .weather-card .details .icon-symbol {
            font-size: 1.3rem;
            width: 30px;
            text-align: center;
        }

        /* === Vorhersage === */
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
            margin-top: 18px;
        }
        .forecast-day {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 18px 12px;
            text-align: center;
            transition: 0.3s;
        }
        .forecast-day:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 12px 35px var(--primary-glow);
        }
        .forecast-day .day-name {
            font-weight: 700;
            color: var(--text-color);
            font-size: 1rem;
        }
        .forecast-day .day-date {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .forecast-day img {
            width: 60px;
            height: 60px;
            margin: 6px 0;
        }
        .forecast-day .temp-high {
            font-weight: 700;
            font-size: 1.3rem;
        }
        .forecast-day .temp-low {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .forecast-day .desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .forecast-day .extra {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        /* === Loading === */
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 0;
            font-size: 1.3rem;
        }
        .loading i {
            margin-right: 14px;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* === Footer === */
        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            body { padding: 20px 15px 40px; }
            .container { max-width: 100%; }
            h1 { font-size: 2.2rem; }
            .search-section { padding: 1.5rem; flex-direction: column; align-items: stretch; }
            .search-section .btn-group { justify-content: stretch; }
            .search-section button { justify-content: center; }
            .weather-card { padding: 1.5rem; }
            .weather-card .main-weather .temp { font-size: 2.8rem; }
            .weather-card .main-weather img { width: 70px; height: 70px; }
            .details { grid-template-columns: 1fr 1fr; gap: 6px 12px; }
            .forecast-grid { grid-template-columns: 1fr 1fr; }
            .favorites-grid { flex-direction: column; align-items: stretch; }
        }
        @media (max-width: 480px) {
            .forecast-grid { grid-template-columns: 1fr; }
            .details { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <!-- Top-Bar -->
        <div class="top-bar">
            <a href="../" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Zurück zur Übersicht</a>
            <div class="menu-container">
                <button class="menu-toggle" id="menuToggle" aria-label="Menü öffnen"><i class="fa-solid fa-bars"></i></button>
                <div class="dropdown-menu" id="dropdownMenu" role="menu">
                    <a href="../../entertainment/" class="dropdown-item" role="menuitem"><i class="fa-solid fa-clapperboard" style="color: var(--accent-pink);"></i> Entertainment</a>
                    <a href="../../school/" class="dropdown-item" role="menuitem"><i class="fa-solid fa-lightbulb" style="color: var(--accent-gold);"></i> School</a>
                    <a href="../../utilities/" class="dropdown-item" role="menuitem"><i class="fa-solid fa-gears" style="color: var(--primary);"></i> Utilities</a>
                </div>
            </div>
        </div>

        <header>
            <h1>WeatherForge</h1>
            <div class="subhead">Aktuelles Wetter, 3-Tage-Vorhersage und Favoriten – mit Autocomplete & eigenen Icons.</div>
        </header>

        <!-- Suche & Standort -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Stadt eingeben, z.B. Berlin" autocomplete="off" />
            <div id="autocompleteList" class="autocomplete-list"></div>
            <div class="btn-group">
                <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> Suchen</button>
                <button id="geolocationBtn" class="btn-secondary"><i class="fa-solid fa-location-dot"></i> Mein Standort</button>
            </div>
        </div>

        <!-- Favoriten-Übersicht mit Temperatur -->
        <div class="favorites-section" id="favoritesSection">
            <div class="header"><i class="fa-regular fa-heart" style="color: var(--accent-pink);"></i> Favoriten</div>
            <div class="favorites-grid" id="favoritesGrid">
                <span class="no-favs">Keine Favoriten gespeichert.</span>
            </div>
        </div>

        <!-- Wetter-Anzeige -->
        <div id="weatherDisplay">
            <div class="loading"><i class="fa-solid fa-circle-notch"></i> Wetterdaten werden geladen...</div>
        </div>

        <footer>&copy; <span id="year"></span> Zero's Tool Hub // Entwickelt von Zerocoolluis</footer>
    </div>

    <script>
        // ========== KONFIGURATION ==========
        const WTTR_BASE = 'https://wttr.in';
        const NOMINATIM_BASE = 'https://nominatim.openstreetmap.org/search';

        // ========== FAVORITEN (NUR IM SPEICHER) ==========
        let favorites = []; // Array von Ortsnamen (Strings)

        // ========== DOM-REFERENZEN ==========
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const geolocationBtn = document.getElementById('geolocationBtn');
        const autocompleteList = document.getElementById('autocompleteList');
        const favoritesGrid = document.getElementById('favoritesGrid');
        const weatherDisplay = document.getElementById('weatherDisplay');

        // ========== AUTOCOMPLETE (Nominatim) ==========
        let autocompleteTimeout = null;

        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (query.length < 2) {
                autocompleteList.classList.remove('visible');
                return;
            }
            clearTimeout(autocompleteTimeout);
            autocompleteTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(
                        `${NOMINATIM_BASE}?format=json&q=${encodeURIComponent(query)}&limit=6&addressdetails=1`
                    );
                    const data = await res.json();
                    autocompleteList.innerHTML = '';
                    if (data.length === 0) {
                        autocompleteList.classList.remove('visible');
                        return;
                    }
                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        // Anzeigename: Stadt, Region, Land
                        const name = item.display_name.split(',').slice(0, 3).join(',');
                        div.textContent = name;
                        div.dataset.fullname = item.display_name;
                        div.addEventListener('click', () => {
                            searchInput.value = name;
                            autocompleteList.classList.remove('visible');
                            fetchWeather(name);
                        });
                        autocompleteList.appendChild(div);
                    });
                    autocompleteList.classList.add('visible');
                } catch (e) {
                    console.warn('Autocomplete fehlgeschlagen:', e);
                    autocompleteList.classList.remove('visible');
                }
            }, 300);
        });

        // Schließe Autocomplete bei Klick außerhalb
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-section')) {
                autocompleteList.classList.remove('visible');
            }
        });

        // ========== FAVORITEN-VERWALTUNG ==========

        function addFavorite(city) {
            if (!city) return;
            // Nur hinzufügen, wenn nicht vorhanden
            if (!favorites.includes(city)) {
                favorites.push(city);
                renderFavorites();
            }
        }

        function removeFavorite(city) {
            favorites = favorites.filter(c => c !== city);
            renderFavorites();
        }

        async function renderFavorites() {
            favoritesGrid.innerHTML = '';
            if (favorites.length === 0) {
                favoritesGrid.innerHTML = '<span class="no-favs">Keine Favoriten gespeichert.</span>';
                return;
            }
            // Für jeden Favoriten die aktuelle Temperatur abrufen (parallel)
            const promises = favorites.map(async (city) => {
                try {
                    const res = await fetch(`${WTTR_BASE}/${encodeURIComponent(city)}?format=j1&lang=de`);
                    if (!res.ok) return { city, temp: '?' };
                    const data = await res.json();
                    const temp = data.current_condition[0]?.temp_C || '?';
                    return { city, temp };
                } catch (e) {
                    return { city, temp: '?' };
                }
            });
            const results = await Promise.all(promises);

            results.forEach(({ city, temp }) => {
                const div = document.createElement('div');
                div.className = 'fav-item';
                div.innerHTML = `
                    <span>${city}</span>
                    <span class="temp">${temp}°C</span>
                    <span class="remove-fav" data-city="${city}"><i class="fa-solid fa-xmark"></i></span>
                `;
                // Klick auf das ganze Item lädt das Wetter
                div.addEventListener('click', (e) => {
                    if (e.target.closest('.remove-fav')) return;
                    searchInput.value = city;
                    fetchWeather(city);
                });
                // Entfernen-Button
                const removeBtn = div.querySelector('.remove-fav');
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeFavorite(city);
                });
                favoritesGrid.appendChild(div);
            });
        }

        // ========== WETTERABFRAGE (wttr.in) ==========

        let currentCity = '';

        async function fetchWeather(city) {
            weatherDisplay.innerHTML = `<div class="loading"><i class="fa-solid fa-circle-notch"></i> Lade Wetter für "${city}"...</div>`;

            try {
                const currentRes = await fetch(
                    `${WTTR_BASE}/${encodeURIComponent(city)}?format=j1&lang=de`
                );
                if (!currentRes.ok) {
                    if (currentRes.status === 404) {
                        weatherDisplay.innerHTML = `<div class="loading" style="color: var(--text-muted);">Stadt "${city}" nicht gefunden.</div>`;
                    } else {
                        weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);">Fehler beim Abrufen (Status ${currentRes.status}).</div>`;
                    }
                    return;
                }
                const data = await currentRes.json();

                const current = data.current_condition[0];
                const location = data.nearest_area[0];
                const cityName = location.areaName[0].value;
                const country = location.country[0].value;
                const date = new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

                const temp = Math.round(parseFloat(current.temp_C));
                const feelsLike = Math.round(parseFloat(current.FeelsLikeC));
                const desc = current.weatherDesc[0].value;
                const iconCode = current.weatherCode;
                const iconUrl = getWeatherIcon(iconCode);
                const humidity = current.humidity;
                const windSpeed = (parseFloat(current.windSpeedKmph) || 0).toFixed(1);
                const windGust = (parseFloat(current.windGustKmph) || 0).toFixed(1);
                const pressure = current.pressure;
                const uvIndex = current.uvIndex || '—';
                const visibility = current.visibility || '—';
                const sunrise = current.sunrise || '—';
                const sunset = current.sunset || '—';

                // Vorhersage
                const forecast = data.weather;
                const forecastDays = forecast.slice(0, 3).map(day => {
                    const dateObj = new Date(day.date);
                    const weekday = dateObj.toLocaleDateString('de-DE', { weekday: 'short' });
                    const dayDate = dateObj.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
                    const maxTemp = Math.round(parseFloat(day.maxtempC));
                    const minTemp = Math.round(parseFloat(day.mintempC));
                    const desc = day.hourly[0]?.weatherDesc[0]?.value || '—';
                    const icon = day.hourly[0]?.weatherCode || 113;
                    const iconUrl = getWeatherIcon(icon);
                    const rainChance = day.hourly[0]?.chanceofrain || '0';
                    const wind = day.hourly[0]?.windSpeedKmph || '0';
                    return { weekday, dayDate, maxTemp, minTemp, desc, iconUrl, rainChance, wind };
                });

                // HTML mit eigenen Icons für Wind, Windböen, Sonnenaufgang
                let html = `
                    <div class="weather-grid">
                        <div class="weather-card">
                            <div class="city-name">${cityName}, ${country}</div>
                            <div class="city-date">${date}</div>
                            <div class="main-weather">
                                <img src="${iconUrl}" alt="${desc}" />
                                <div>
                                    <div class="temp">${temp}°C</div>
                                    <div class="desc">${desc}</div>
                                </div>
                            </div>
                            <div class="details">
                                <span><span class="icon-symbol">🌡️</span> Gefühlt: <span class="value">${feelsLike}°C</span></span>
                                <span><span class="icon-symbol">💧</span> Luftfeuchtigkeit: <span class="value">${humidity}%</span></span>
                                <span><span class="icon-symbol">🌬️</span> Wind: <span class="value">${windSpeed} km/h</span></span>
                                <span><span class="icon-symbol">💨</span> Windböen: <span class="value">${windGust} km/h</span></span>
                                <span><span class="icon-symbol">📊</span> Luftdruck: <span class="value">${pressure} hPa</span></span>
                                <span><span class="icon-symbol">☀️</span> UV-Index: <span class="value">${uvIndex}</span></span>
                                <span><span class="icon-symbol">👁️</span> Sichtweite: <span class="value">${visibility} km</span></span>
                                <span><span class="icon-symbol">🌅</span> Sonnenaufgang: <span class="value">${sunrise}</span></span>
                                <span><span class="icon-symbol">🌇</span> Sonnenuntergang: <span class="value">${sunset}</span></span>
                            </div>
                        </div>
                        <div class="weather-card">
                            <div style="font-family:'Orbitron',sans-serif; font-size:1.4rem; margin-bottom:16px;">📅 3-Tage-Vorhersage</div>
                            <div class="forecast-grid" id="forecastGrid"></div>
                        </div>
                    </div>
                `;
                weatherDisplay.innerHTML = html;

                const grid = document.getElementById('forecastGrid');
                forecastDays.forEach(day => {
                    const div = document.createElement('div');
                    div.className = 'forecast-day';
                    div.innerHTML = `
                        <div class="day-name">${day.weekday}</div>
                        <div class="day-date">${day.dayDate}</div>
                        <img src="${day.iconUrl}" alt="${day.desc}" />
                        <div class="temp-high">${day.maxTemp}°</div>
                        <div class="temp-low">${day.minTemp}°</div>
                        <div class="desc">${day.desc}</div>
                        <div class="extra">
                            <span><span class="icon-symbol">💧</span> ${day.rainChance}%</span>
                            <span><span class="icon-symbol">🌬️</span> ${day.wind} km/h</span>
                        </div>
                    `;
                    grid.appendChild(div);
                });

                // Favorit hinzufügen (automatisch)
                addFavorite(cityName);
                currentCity = cityName;

            } catch (e) {
                weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);"><i class="fa-solid fa-triangle-exclamation"></i> Netzwerkfehler: ${e.message}</div>`;
            }
        }

        // ========== ICON-MAPPING ==========
        function getWeatherIcon(code) {
            const map = {
                113: '01d', 116: '02d', 119: '03d', 122: '04d',
                143: '50d', 248: '50d', 260: '50d',
                176: '09d', 263: '09d', 266: '09d', 281: '09d', 284: '09d',
                293: '09d', 296: '09d', 299: '09d', 302: '10d', 305: '10d',
                308: '10d', 311: '10d', 314: '10d', 317: '10d', 320: '10d',
                323: '13d', 326: '13d', 329: '13d', 332: '13d', 335: '13d',
                338: '13d', 350: '13d', 353: '09d', 356: '09d', 359: '09d',
                362: '13d', 365: '13d', 368: '13d', 371: '13d', 374: '13d',
                377: '13d', 386: '11d', 389: '11d', 392: '11d', 395: '11d'
            };
            const icon = map[code] || '01d';
            return `https://openweathermap.org/img/wn/${icon}@4x.png`;
        }

        // ========== STANDORT ==========

        function getLocation() {
            if (!navigator.geolocation) {
                weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);"><i class="fa-solid fa-triangle-exclamation"></i> Geolocation wird von Ihrem Browser nicht unterstützt.</div>`;
                return;
            }
            weatherDisplay.innerHTML = `<div class="loading"><i class="fa-solid fa-circle-notch"></i> Standort wird ermittelt...</div>`;
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const { latitude, longitude } = pos.coords;
                    try {
                        const res = await fetch(
                            `${WTTR_BASE}/${latitude},${longitude}?format=j1&lang=de`
                        );
                        if (!res.ok) throw new Error('Wetterabfrage fehlgeschlagen');
                        const data = await res.json();
                        const city = data.nearest_area[0]?.areaName[0]?.value || 'Unbekannter Ort';
                        searchInput.value = city;
                        fetchWeather(city);
                    } catch (e) {
                        weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);"><i class="fa-solid fa-triangle-exclamation"></i> Standort konnte nicht ermittelt werden: ${e.message}</div>`;
                    }
                },
                (err) => {
                    weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);"><i class="fa-solid fa-triangle-exclamation"></i> Standortzugriff verweigert: ${err.message}</div>`;
                }
            );
        }

        // ========== EVENT-LISTENER ==========

        searchBtn.addEventListener('click', () => {
            const city = searchInput.value.trim();
            if (city) fetchWeather(city);
        });
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });
        geolocationBtn.addEventListener('click', getLocation);

        // Initial: Favoriten (leer) rendern, und Berlin laden
        renderFavorites();
        fetchWeather('Berlin');

        // ========== HINTERGRUND-PARTIKEL ==========
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animFrameId = null;
        let isTabActive = true;
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        for (let i = 0; i < 60; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.5 + 1,
                speedX: (Math.random() - 0.5) * 0.35,
                speedY: (Math.random() - 0.5) * 0.35
            });
        }
        function animateParticles() {
            if (!isTabActive) { animFrameId = requestAnimationFrame(animateParticles); return; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(91, 154, 255, 0.12)';
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            animFrameId = requestAnimationFrame(animateParticles);
        }
        animateParticles();
        document.addEventListener('visibilitychange', () => { isTabActive = !document.hidden; });

        // ========== DROPDOWN ==========
        const menuToggle = document.getElementById('menuToggle');
        const dropdownMenu = document.getElementById('dropdownMenu');
        menuToggle.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('active'); });
        window.addEventListener('click', () => { dropdownMenu.classList.remove('active'); });

        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
