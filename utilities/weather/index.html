<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherForge // ZERO'S TOOL HUB</title>
    <meta name="description" content="Wettervorhersage mit Standort, Favoriten und 5-Tage-Übersicht." />

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* === Basis-Stile (abgeleitet vom Hub) === */
        :root {
            --bg-color: #0a0e1a;
            --card-bg: rgba(18, 25, 45, 0.75);
            --border-color: rgba(91, 154, 255, 0.2);
            --primary: #5b9aff;
            --primary-glow: rgba(91, 154, 255, 0.4);
            --accent-gold: #f0c27f;
            --accent-pink: #ff6b6b;
            --text-color: #eef2f8;
            --text-muted: #9aa8c7;
            --card-radius: 20px;
            --input-radius: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 30px 20px 60px;
            position: relative;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
            flex-wrap: wrap;
            gap: 15px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: var(--card-radius);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .back-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateX(-4px);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .menu-container { position: relative; }
        .menu-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--primary);
            width: 45px;
            height: 45px;
            border-radius: var(--card-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .menu-toggle:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.05) rotate(90deg);
        }

        .dropdown-menu {
            position: absolute;
            top: 55px;
            right: 0;
            width: 220px;
            background: rgba(10, 14, 26, 0.95);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .dropdown-menu.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .dropdown-item {
            padding: 12px 18px;
            color: var(--text-color);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover {
            background: rgba(91, 154, 255, 0.15);
            color: var(--primary);
            padding-left: 22px;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 20px rgba(91, 154, 255, 0.15));
        }

        .subhead {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* === API-Key Hinweis === */
        .api-key-notice {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--accent-pink);
            border-radius: var(--card-radius);
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .api-key-notice i {
            color: var(--accent-pink);
            font-size: 1.2rem;
        }
        .api-key-notice input {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            border-radius: var(--input-radius);
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
            color: var(--text-color);
            font-size: 0.9rem;
            outline: none;
        }
        .api-key-notice input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .api-key-notice button {
            padding: 8px 18px;
            border-radius: var(--input-radius);
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .api-key-notice button:hover {
            background: #4a8aff;
            transform: scale(1.03);
        }

        /* === Suche & Standort === */
        .search-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.8rem;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-section input {
            flex: 2;
            min-width: 200px;
            padding: 14px 20px;
            border-radius: var(--input-radius);
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.05);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .search-section input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .search-section input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }
        .search-section .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-section button {
            padding: 14px 24px;
            border-radius: var(--input-radius);
            border: none;
            background: var(--primary);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(91, 154, 255, 0.3);
        }
        .search-section button:hover {
            background: #4a8aff;
            transform: scale(1.03);
            box-shadow: 0 8px 30px var(--primary-glow);
        }
        .search-section .btn-secondary {
            background: rgba(255,255,255,0.08);
            box-shadow: none;
        }
        .search-section .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        /* === Favoriten-Liste === */
        .favorites-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            align-items: center;
        }
        .favorites-bar .label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-right: 8px;
        }
        .fav-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 16px;
            font-size: 0.9rem;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .fav-chip:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .fav-chip .remove {
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .fav-chip .remove:hover {
            color: var(--accent-pink);
        }

        /* === Wetterkarten === */
        .weather-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .weather-grid {
                grid-template-columns: 1fr;
            }
        }

        .weather-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.8rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .weather-card:hover {
            border-color: var(--primary);
            box-shadow: 0 20px 50px var(--primary-glow);
        }
        .weather-card .city-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 4px;
        }
        .weather-card .city-date {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .weather-card .main-weather {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .weather-card .main-weather img {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 15px rgba(91,154,255,0.3));
        }
        .weather-card .main-weather .temp {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
        }
        .weather-card .main-weather .desc {
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .weather-card .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
        .weather-card .details span {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .weather-card .details i {
            width: 20px;
            color: var(--primary);
        }
        .weather-card .details .value {
            color: var(--text-color);
            font-weight: 600;
        }

        /* === Vorhersage (Tage) === */
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .forecast-day {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 14px;
            text-align: center;
            transition: 0.3s;
            cursor: default;
        }
        .forecast-day:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--primary-glow);
        }
        .forecast-day .day-name {
            font-weight: 600;
            color: var(--text-color);
            font-size: 0.9rem;
        }
        .forecast-day .day-date {
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .forecast-day img {
            width: 50px;
            height: 50px;
            margin: 6px 0;
        }
        .forecast-day .temp-high {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .forecast-day .temp-low {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .forecast-day .desc {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        /* === Loading === */
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 1.2rem;
        }
        .loading i {
            margin-right: 10px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* === Footer === */
        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .top-bar { flex-direction: row; flex-wrap: wrap; }
            .back-btn { font-size: 0.75rem; padding: 8px 14px; }
            h1 { font-size: 2rem; }
            .search-section { flex-direction: column; align-items: stretch; }
            .search-section .btn-group { justify-content: stretch; }
            .weather-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <!-- Top-Bar -->
        <div class="top-bar">
            <a href="../" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Zurück zur Übersicht</a>
            <div class="menu-container">
                <button class="menu-toggle" id="menuToggle" aria-label="Menü öffnen"><i class="fa-solid fa-bars"></i></button>
                <div class="dropdown-menu" id="dropdownMenu" role="menu">
                    <a href="../../entertainment/" class="dropdown-item" role="menuitem"><i class="fa-solid fa-clapperboard" style="color: var(--accent-pink);"></i> Entertainment</a>
                    <a href="../../school/" class="dropdown-item" role="menuitem"><i class="fa-solid fa-lightbulb" style="color: var(--accent-gold);"></i> School</a>
                    <a href="../../utilities/" class="dropdown-item" role="menuitem"><i class="fa-solid fa-gears" style="color: var(--primary);"></i> Utilities</a>
                </div>
            </div>
        </div>

        <header>
            <h1>WeatherForge</h1>
            <div class="subhead">Aktuelles Wetter, 5-Tage-Vorhersage und Favoriten für deine Orte.</div>
        </header>

        <!-- API-Key Eingabe (optional, falls der Standard-Key nicht funktioniert) -->
        <div class="api-key-notice">
            <i class="fa-solid fa-key"></i>
            <span style="color: var(--text-muted); font-size: 0.9rem;">API-Key (OpenWeatherMap):</span>
            <input type="text" id="apiKeyInput" placeholder="z.B. 123abc..." value="bd5e378503939ddaee76f12ad7a97608" />
            <button id="saveApiKeyBtn"><i class="fa-solid fa-floppy-disk"></i> Speichern</button>
            <span style="color: var(--text-muted); font-size: 0.75rem; margin-left: auto;">🔑 Kostenlos registrieren auf openweathermap.org</span>
        </div>

        <!-- Suche & Standort -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Stadt eingeben, z.B. Berlin" />
            <div class="btn-group">
                <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> Suchen</button>
                <button id="geolocationBtn" class="btn-secondary"><i class="fa-solid fa-location-dot"></i> Mein Standort</button>
            </div>
        </div>

        <!-- Favoriten -->
        <div class="favorites-bar" id="favoritesBar">
            <span class="label"><i class="fa-regular fa-heart" style="color: var(--accent-pink);"></i> Favoriten:</span>
            <!-- werden dynamisch befüllt -->
        </div>

        <!-- Wetter-Anzeige -->
        <div id="weatherDisplay">
            <div class="loading"><i class="fa-solid fa-circle-notch"></i> Wetterdaten werden geladen...</div>
        </div>

        <footer>&copy; <span id="year"></span> Zero's Tool Hub // Entwickelt von Zerocoolluis</footer>
    </div>

    <script>
        // ========== KONFIGURATION ==========
        const DEFAULT_API_KEY = 'bd5e378503939ddaee76f12ad7a97608'; // OpenWeatherMap Demo-Key (funktioniert meist nicht mehr – Nutzer sollte eigenen eintragen)
        let API_KEY = localStorage.getItem('weather_api_key') || DEFAULT_API_KEY;
        const UNITS = 'metric';
        const LANG = 'de';

        // ========== DOM-Referenzen ==========
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const geolocationBtn = document.getElementById('geolocationBtn');
        const favoritesBar = document.getElementById('favoritesBar');
        const weatherDisplay = document.getElementById('weatherDisplay');

        // ========== FAVORITEN ==========
        let favorites = JSON.parse(localStorage.getItem('weather_favorites')) || [];

        function saveFavorites() {
            localStorage.setItem('weather_favorites', JSON.stringify(favorites));
            renderFavorites();
        }

        function renderFavorites() {
            favoritesBar.innerHTML = '<span class="label"><i class="fa-regular fa-heart" style="color: var(--accent-pink);"></i> Favoriten:</span>';
            if (favorites.length === 0) {
                favoritesBar.innerHTML += '<span style="color: var(--text-muted); font-size:0.9rem;">Keine Favoriten gespeichert.</span>';
                return;
            }
            favorites.forEach(city => {
                const chip = document.createElement('span');
                chip.className = 'fav-chip';
                chip.innerHTML = `${city} <span class="remove" data-city="${city}"><i class="fa-solid fa-xmark"></i></span>`;
                chip.addEventListener('click', (e) => {
                    if (e.target.closest('.remove')) return;
                    searchInput.value = city;
                    fetchWeather(city);
                });
                const removeBtn = chip.querySelector('.remove');
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const cityName = removeBtn.dataset.city;
                    favorites = favorites.filter(c => c !== cityName);
                    saveFavorites();
                    if (currentCity === cityName) {
                        // Wenn der aktuelle Ort gelöscht wird, nicht neu laden
                    }
                });
                favoritesBar.appendChild(chip);
            });
        }

        // ========== WETTERABFRAGE ==========

        let currentCity = '';

        async function fetchWeather(city) {
            if (!API_KEY || API_KEY === DEFAULT_API_KEY) {
                weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);"><i class="fa-solid fa-triangle-exclamation"></i> Bitte trage einen gültigen OpenWeatherMap-API-Key ein (oben).</div>`;
                return;
            }

            weatherDisplay.innerHTML = `<div class="loading"><i class="fa-solid fa-circle-notch"></i> Lade Wetter für "${city}"...</div>`;

            try {
                // Aktuelles Wetter
                const currentRes = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=${UNITS}&lang=${LANG}`
                );
                if (!currentRes.ok) {
                    if (currentRes.status === 401) {
                        weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);"><i class="fa-solid fa-triangle-exclamation"></i> API-Key ungültig oder nicht aktiviert. Bitte überprüfe deinen Key.</div>`;
                    } else if (currentRes.status === 404) {
                        weatherDisplay.innerHTML = `<div class="loading" style="color: var(--text-muted);">Stadt "${city}" nicht gefunden.</div>`;
                    } else {
                        weatherDisplay.innerHTML = `<div class="loading" style="color: var(--text-muted);">Fehler beim Abrufen der Daten (Status ${currentRes.status}).</div>`;
                    }
                    return;
                }
                const currentData = await currentRes.json();

                // 5-Tage-Vorhersage
                const forecastRes = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=${UNITS}&lang=${LANG}&cnt=40`
                );
                const forecastData = forecastRes.ok ? await forecastRes.json() : null;

                currentCity = city;
                renderWeather(currentData, forecastData);

                // Favorit speichern (automatisch bei Suche/Standort)
                if (!favorites.includes(city)) {
                    favorites.push(city);
                    saveFavorites();
                }

            } catch (e) {
                weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);"><i class="fa-solid fa-triangle-exclamation"></i> Netzwerkfehler: ${e.message}</div>`;
            }
        }

        // ========== WETTER ANZEIGEN ==========

        function renderWeather(current, forecast) {
            const city = current.name;
            const country = current.sys.country;
            const date = new Date(current.dt * 1000).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            const temp = Math.round(current.main.temp);
            const feelsLike = Math.round(current.main.feels_like);
            const desc = current.weather[0].description;
            const icon = current.weather[0].icon;
            const humidity = current.main.humidity;
            const windSpeed = (current.wind.speed * 3.6).toFixed(1); // m/s -> km/h
            const pressure = current.main.pressure;
            const sunrise = new Date(current.sys.sunrise * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            const sunset = new Date(current.sys.sunset * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

            // Aktuelle Karte
            let html = `
                <div class="weather-grid">
                    <div class="weather-card">
                        <div class="city-name">${city}, ${country}</div>
                        <div class="city-date">${date}</div>
                        <div class="main-weather">
                            <img src="https://openweathermap.org/img/wn/${icon}@4x.png" alt="${desc}" />
                            <div>
                                <div class="temp">${temp}°C</div>
                                <div class="desc">${desc}</div>
                            </div>
                        </div>
                        <div class="details">
                            <span><i class="fa-regular fa-temperature-high"></i> Gefühlt: <span class="value">${feelsLike}°C</span></span>
                            <span><i class="fa-regular fa-droplet"></i> Luftfeuchtigkeit: <span class="value">${humidity}%</span></span>
                            <span><i class="fa-regular fa-wind"></i> Wind: <span class="value">${windSpeed} km/h</span></span>
                            <span><i class="fa-regular fa-gauge-high"></i> Luftdruck: <span class="value">${pressure} hPa</span></span>
                            <span><i class="fa-regular fa-sun"></i> Sonnenaufgang: <span class="value">${sunrise}</span></span>
                            <span><i class="fa-regular fa-moon"></i> Sonnenuntergang: <span class="value">${sunset}</span></span>
                        </div>
                    </div>
                    <div class="weather-card">
                        <div style="font-family:'Orbitron',sans-serif; font-size:1.2rem; margin-bottom:12px;">📅 5-Tage-Vorhersage</div>
                        <div class="forecast-grid" id="forecastGrid"></div>
                    </div>
                </div>
            `;
            weatherDisplay.innerHTML = html;

            // Vorhersage befüllen
            if (forecast && forecast.list) {
                const forecastGrid = document.getElementById('forecastGrid');
                // Gruppiere nach Tag (nimm jeweils den ersten Eintrag pro Tag)
                const dailyMap = new Map();
                forecast.list.forEach(item => {
                    const date = new Date(item.dt * 1000);
                    const day = date.toISOString().split('T')[0];
                    if (!dailyMap.has(day)) {
                        dailyMap.set(day, { date, items: [item] });
                    } else {
                        dailyMap.get(day).items.push(item);
                    }
                });
                // Nimm die nächsten 5 Tage (heute + 4)
                const days = Array.from(dailyMap.values()).slice(0, 5);
                days.forEach((dayData, index) => {
                    const items = dayData.items;
                    // Höchste und tiefste Temperatur des Tages
                    const temps = items.map(i => i.main.temp);
                    const tempMax = Math.round(Math.max(...temps));
                    const tempMin = Math.round(Math.min(...temps));
                    // Das Icon des ersten Eintrags
                    const icon = items[0].weather[0].icon;
                    const desc = items[0].weather[0].description;
                    const weekday = index === 0 ? 'Heute' : dayData.date.toLocaleDateString('de-DE', { weekday: 'short' });

                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'forecast-day';
                    dayDiv.innerHTML = `
                        <div class="day-name">${weekday}</div>
                        <div class="day-date">${dayData.date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })}</div>
                        <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="${desc}" />
                        <div class="temp-high">${tempMax}°</div>
                        <div class="temp-low">${tempMin}°</div>
                        <div class="desc">${desc}</div>
                    `;
                    forecastGrid.appendChild(dayDiv);
                });
            } else {
                document.getElementById('forecastGrid').innerHTML = '<p style="color:var(--text-muted);">Keine Vorhersagedaten verfügbar.</p>';
            }
        }

        // ========== STANDORT ==========

        function getLocation() {
            if (!navigator.geolocation) {
                weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);"><i class="fa-solid fa-triangle-exclamation"></i> Geolocation wird von Ihrem Browser nicht unterstützt.</div>`;
                return;
            }
            weatherDisplay.innerHTML = `<div class="loading"><i class="fa-solid fa-circle-notch"></i> Standort wird ermittelt...</div>`;
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const { latitude, longitude } = pos.coords;
                    try {
                        // Stadtname über Reverse-Geocoding (OpenWeatherMap)
                        const res = await fetch(
                            `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=${UNITS}&lang=${LANG}`
                        );
                        if (!res.ok) throw new Error('Wetterabfrage fehlgeschlagen');
                        const data = await res.json();
                        const city = data.name;
                        searchInput.value = city;
                        fetchWeather(city);
                    } catch (e) {
                        weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);"><i class="fa-solid fa-triangle-exclamation"></i> Standort konnte nicht ermittelt werden: ${e.message}</div>`;
                    }
                },
                (err) => {
                    weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-pink);"><i class="fa-solid fa-triangle-exclamation"></i> Standortzugriff verweigert oder Fehler: ${err.message}</div>`;
                }
            );
        }

        // ========== API-Key speichern ==========

        saveApiKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                API_KEY = key;
                localStorage.setItem('weather_api_key', key);
                weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-gold);"><i class="fa-solid fa-check"></i> API-Key gespeichert. Starte eine neue Suche.</div>`;
            } else {
                alert('Bitte gib einen gültigen API-Key ein.');
            }
        });

        // ========== EVENT-LISTENER ==========

        searchBtn.addEventListener('click', () => {
            const city = searchInput.value.trim();
            if (city) fetchWeather(city);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });

        geolocationBtn.addEventListener('click', getLocation);

        // Initial: Favoriten laden und erstes Wetter (falls vorhanden)
        renderFavorites();

        // Beim Start: Wenn Favoriten vorhanden, ersten anzeigen, sonst Standort oder Berlin
        if (favorites.length > 0) {
            fetchWeather(favorites[0]);
        } else {
            // Prüfe, ob ein Standard-Key gespeichert ist
            if (API_KEY && API_KEY !== DEFAULT_API_KEY) {
                // Versuche Berlin
                fetchWeather('Berlin');
            } else {
                // Zeige Hinweis auf API-Key
                weatherDisplay.innerHTML = `<div class="loading" style="color: var(--accent-gold);"><i class="fa-regular fa-cloud-sun"></i> Bitte trage deinen OpenWeatherMap-API-Key oben ein und suche eine Stadt.</div>`;
            }
        }

        // ========== HINTERGRUND-PARTIKEL ==========
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animFrameId = null;
        let isTabActive = true;
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        for (let i = 0; i < 50; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speedX: (Math.random() - 0.5) * 0.3,
                speedY: (Math.random() - 0.5) * 0.3
            });
        }
        function animateParticles() {
            if (!isTabActive) { animFrameId = requestAnimationFrame(animateParticles); return; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(91, 154, 255, 0.1)';
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            animFrameId = requestAnimationFrame(animateParticles);
        }
        animateParticles();
        document.addEventListener('visibilitychange', () => { isTabActive = !document.hidden; });

        // ========== DROPDOWN ==========
        const menuToggle = document.getElementById('menuToggle');
        const dropdownMenu = document.getElementById('dropdownMenu');
        menuToggle.addEventListener('click', (e) => { e.stopPropagation(); dropdownMenu.classList.toggle('active'); });
        window.addEventListener('click', () => { dropdownMenu.classList.remove('active'); });

        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
