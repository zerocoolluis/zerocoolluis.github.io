<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context-Switch-Tresor & Fokus-Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #09090b; color: #f4f4f5; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
        
        .app-container { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }
        
        header { background: #18181b; border: 1px solid #27272a; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.4rem; color: #6366f1; display: flex; align-items: center; gap: 10px; }
        .tagline { font-size: 0.85rem; color: #a1a1aa; }

        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }

        .card { background: #18181b; border: 1px solid #27272a; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 15px; }
        h2 { font-size: 1.1rem; color: #e4e4e7; border-bottom: 1px solid #27272a; padding-bottom: 8px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.8rem; color: #a1a1aa; font-weight: 500; }
        input, textarea, select { background: #09090b; border: 1px solid #3f3f46; color: white; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #6366f1; }
        textarea { resize: vertical; min-height: 80px; }

        button { background: #6366f1; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #4f46e5; }
        button.danger { background: #ef4444; }
        button.danger:hover { background: #dc2626; }
        button.secondary { background: #27272a; color: #e4e4e7; }
        button.secondary:hover { background: #3f3f46; }

        .snapshot-list { display: flex; flex-direction: column; gap: 12px; max-height: 450px; overflow-y: auto; padding-right: 5px; }
        .snapshot-item { background: #09090b; border: 1px solid #27272a; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; position: relative; transition: border-color 0.2s; }
        .snapshot-item:hover { border-color: #6366f1; }
        
        .snapshot-header { display: flex; justify-content: space-between; align-items: center; }
        .snapshot-title { font-weight: 600; font-size: 0.95rem; color: #f4f4f5; }
        .snapshot-time { font-size: 0.75rem; color: #71717a; }
        .snapshot-notes { font-size: 0.85rem; color: #d4d4d8; background: #18181b; padding: 8px; border-radius: 4px; border-left: 3px solid #6366f1; white-space: pre-wrap; }

        .actions { display: flex; gap: 8px; margin-top: 5px; }

        /* Status Anzeige oben */
        .current-state-box { background: #09090b; border: 1px dashed #3f3f46; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .active-task-name { font-weight: bold; color: #10b981; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div>
                <h1>⚡ Context-Switch-Tresor</h1>
                <p class="tagline">Unterbrechungen sicher abfangen und den roten Faden behalten.</p>
            </div>
            <button class="secondary" onclick="clearAllData()">Alle Daten zurücksetzen</button>
        </header>

        <!-- Aktueller Fokus-Status -->
        <div class="card" style="padding: 15px 20px;">
            <div class="current-state-box">
                <div>
                    <label>Aktueller Fokus:</label>
                    <span id="currentFocusDisplay" class="active-task-name">Keine aktive Aufgabe</span>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="quickFocusInput" placeholder="Woran arbeitest du gerade?" style="width: 250px;">
                    <button onclick="setFocusTask()">Fokus setzen</button>
                </div>
            </div>
        </div>

        <div class="grid-layout">
            <!-- Linke Spalte: Neuen Snapshot erstellen -->
            <div class="card">
                <h2>Neuen Kontext-Snapshot speichern</h2>
                <form id="snapshotForm" onsubmit="saveSnapshot(event)">
                    <div class="form-group">
                        <label>Titel / Projekt:</label>
                        <input type="text" id="snapTitle" placeholder="z. B. Mathe-Hausaufgabe / Bugfixing..." required>
                    </div>
                    <div class="form-group">
                        <label>Gedanken / Letzter Schritt (Wo warst du stehen geblieben?):</label>
                        <textarea id="snapNotes" placeholder="Habe bei Aufgabe 4 gemerkt, dass Formel X fehlt. Muss noch im Tafelwerk nachschlagen..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Dringlichkeit / Energie-Level:</label>
                        <select id="snapPriority">
                            <option value="Normal">Normaler Kontext</option>
                            <option value="Hoch" selected>Wichtig / Sofort weiterarbeiten</option>
                            <option value="Idee">Spontane Idee / Ablenkung</option>
                        </select>
                    </div>
                    <button type="submit" style="margin-top: 5px;">Kontext einfrieren & speichern</button>
                </form>
            </div>

            <!-- Rechte Spalte: Gespeicherte Snapshots (Tresor) -->
            <div class="card">
                <h2>Gespeicherte Kontexte (<span id="snapshotCount">0</span>)</h2>
                <div class="snapshot-list" id="snapshotContainer">
                    <!-- Wird dynamisch gefüllt -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let snapshots = JSON.parse(localStorage.getItem('context_snapshots')) || [];
        let currentFocus = localStorage.getItem('current_focus') || 'Keine aktive Aufgabe';

        function init() {
            document.getElementById('currentFocusDisplay').innerText = currentFocus;
            renderSnapshots();
        }

        function setFocusTask() {
            const input = document.getElementById('quickFocusInput').value.trim();
            if (!input) return;
            currentFocus = input;
            localStorage.setItem('current_focus', currentFocus);
            document.getElementById('currentFocusDisplay').innerText = currentFocus;
            document.getElementById('quickFocusInput').value = '';
        }

        function saveSnapshot(e) {
            e.preventDefault();
            const title = document.getElementById('snapTitle').value;
            const notes = document.getElementById('snapNotes').value;
            const priority = document.getElementById('snapPriority').value;
            
            const newSnapshot = {
                id: Date.now(),
                title,
                notes,
                priority,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' })
            };

            snapshots.unshift(newSnapshot); // Oben hinzufügen
            updateLocalStorage();
            document.getElementById('snapshotForm').reset();
        }

        function restoreSnapshot(id) {
            const snap = snapshots.find(s => s.id === id);
            if (!snap) return;

            // Setze diesen Snapshot als aktuellen Fokus
            currentFocus = `[Wiederhergestellt] ${snap.title}`;
            localStorage.setItem('current_focus', currentFocus);
            document.getElementById('currentFocusDisplay').innerText = currentFocus;

            // Optional: Löschen nach Wiederherstellung oder behalten? Behalten ist sicherer, wir zeigen eine Meldung
            alert(`Kontext "${snap.title}" wurde als aktiver Fokus geladen!`);
        }

        function deleteSnapshot(id) {
            snapshots = snapshots.filter(s => s.id !== id);
            updateLocalStorage();
        }

        function updateLocalStorage() {
            localStorage.setItem('context_snapshots', JSON.stringify(snapshots));
            renderSnapshots();
        }

        function renderSnapshots() {
            const container = document.getElementById('snapshotContainer');
            document.getElementById('snapshotCount').innerText = snapshots.length;
            
            if (snapshots.length === 0) {
                container.innerHTML = '<p style="color: #71717a; font-size: 0.85rem; text-align: center; padding: 20px;">Keine Kontexte gespeichert. Alles ruhig!</p>';
                return;
            }

            container.innerHTML = '';
            snapshots.forEach(s => {
                let badgeColor = '#6366f1';
                if (s.priority === 'Hoch') badgeColor = '#ef4444';
                if (s.priority === 'Idee') badgeColor = '#10b981';

                container.innerHTML += `
                    <div class="snapshot-item">
                        <div class="snapshot-header">
                            <span class="snapshot-title">${s.title}</span>
                            <span class="snapshot-time">${s.time}</span>
                        </div>
                        <div style="font-size: 0.75rem; color: ${badgeColor}; font-weight: bold;">Priorität: ${s.priority}</div>
                        <div class="snapshot-notes">${s.notes}</div>
                        <div class="actions">
                            <button onclick="restoreSnapshot(${s.id})" style="padding: 6px 10px; font-size: 0.8rem;">Wiederherstellen</button>
                            <button class="danger" onclick="deleteSnapshot(${s.id})" style="padding: 6px 10px; font-size: 0.8rem;">Löschen</button>
                        </div>
                    </div>
                `;
            });
        }

        function clearAllData() {
            if (confirm('Möchtest du wirklich alle gespeicherten Kontexte löschen?')) {
                snapshots = [];
                currentFocus = 'Keine aktive Aufgabe';
                localStorage.removeItem('context_snapshots');
                localStorage.removeItem('current_focus');
                init();
            }
        }

        // Starten
        init();
    </script>
</body>
</html>
