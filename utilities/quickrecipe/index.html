<!DOCTYPE html>
<html lang="de" class="dark" id="html-root">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Recipe – Dein smarter Kochassistent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }
        .toast-enter { transform: translateY(0); opacity: 1; }
        .toast-leave { transform: translateY(150%); opacity: 0; }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .card-hover:hover {
            transform: translateY(-6px);
            border-color: #38bdf8;
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.15);
        }

        .btn-hover {
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
        }
        .btn-hover:active {
            transform: scale(0.96);
        }

        .result-box {
            background: rgba(56, 189, 248, 0.05);
            border-left: 4px solid #38bdf8;
            padding: 20px 24px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .result-box:hover {
            background: rgba(56, 189, 248, 0.08);
        }

        .loading-spinner {
            border: 3px solid rgba(56, 189, 248, 0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ingredient-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin: 2px 4px 2px 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ingredient-tag:hover {
            background: rgba(56, 189, 248, 0.25);
            transform: scale(1.05);
        }

        .favorite-btn {
            transition: all 0.2s;
        }
        .favorite-btn:hover {
            transform: scale(1.15);
        }
        .favorite-btn.active {
            color: #f59e0b;
        }

        .share-btn {
            transition: all 0.2s;
        }
        .share-btn:hover {
            transform: scale(1.1);
        }

        @media (max-width: 640px) {
            .main-title { font-size: 1.8rem; }
            .ingredient-tag { font-size: 0.7rem; padding: 3px 10px; }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen p-4 md:p-8 transition-colors duration-200 font-sans">

    <main class="max-w-4xl mx-auto space-y-6">

        <!-- ===== HEADER ===== -->
        <header class="flex flex-wrap justify-between items-center gap-4 pb-6 border-b border-slate-300 dark:border-slate-800">
            <div>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight text-slate-900 dark:text-white main-title">🍳 Quick Recipe</h1>
                <p class="text-xs text-slate-600 dark:text-slate-400 mt-1 font-medium">
                    <i class="fa-regular fa-circle-check text-emerald-500"></i> Rezepte aus dem, was du hast
                </p>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <a href="https://zerocoolluis.github.io" title="Hauptseite" class="flex items-center justify-center p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-sm btn-hover">
                    <i class="fa-solid fa-house text-base"></i>
                </a>
                <button onclick="toggleTheme()" id="theme-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-sm font-semibold text-xs btn-hover">
                    <i id="theme-icon" class="fa-solid fa-sun text-amber-500 text-base"></i>
                    <span id="theme-text" class="hidden sm:inline">Heller Modus</span>
                </button>
            </div>
        </header>

        <!-- ===== EINGABE ===== -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800">
            <label class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider block mb-3">
                <i class="fa-regular fa-fridge mr-2"></i> Was hast du im Kühlschrank?
            </label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="ingredient-input"
                       placeholder="z.B. Tomaten, Mozzarella, Basilikum"
                       class="flex-1 px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 focus:border-cyan-500 dark:focus:border-cyan-400 outline-none text-slate-900 dark:text-white text-sm transition" />
                <button onclick="searchRecipes()" class="btn-hover px-6 py-3 rounded-xl bg-cyan-500 text-white font-bold text-sm hover:bg-cyan-600 transition shadow-lg shadow-cyan-500/20 whitespace-nowrap">
                    <i class="fa-solid fa-magnifying-glass mr-2"></i> Rezept suchen
                </button>
            </div>
            <div id="ingredient-tags" class="mt-3 flex flex-wrap gap-1"></div>

            <!-- Personenanzahl -->
            <div class="mt-4 flex items-center gap-4 flex-wrap border-t border-slate-200 dark:border-slate-700 pt-4">
                <label class="text-sm font-medium text-slate-600 dark:text-slate-300">
                    <i class="fa-regular fa-users mr-1"></i> Portionen:
                </label>
                <div class="flex items-center gap-2">
                    <button onclick="changeServings(-1)" class="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold hover:bg-slate-300 dark:hover:bg-slate-600 transition btn-hover">−</button>
                    <span id="servings-display" class="text-lg font-bold text-cyan-500 min-w-[40px] text-center">2</span>
                    <button onclick="changeServings(1)" class="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold hover:bg-slate-300 dark:hover:bg-slate-600 transition btn-hover">+</button>
                </div>
                <span class="text-xs text-slate-400">(Zutaten werden automatisch angepasst)</span>
            </div>
        </div>

        <!-- ===== ERGEBNISSE ===== -->
        <div id="result-container" class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800 min-h-[200px] flex items-center justify-center">
            <div id="result-content" class="w-full text-center text-slate-400 dark:text-slate-500">
                <i class="fa-regular fa-utensils text-4xl mb-3 block"></i>
                <p class="font-medium">Gib deine Zutaten ein und klicke auf <strong>Rezept suchen</strong></p>
                <p class="text-sm">Tipp: Je mehr Zutaten, desto passender das Rezept!</p>
            </div>
        </div>

        <!-- ===== FAVORITEN (nur sichtbar wenn vorhanden) ===== -->
        <div id="favorites-container" class="hidden bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    <i class="fa-regular fa-star text-yellow-500 mr-2"></i> Deine Favoriten
                </h3>
                <button onclick="clearFavorites()" class="text-xs text-rose-400 hover:text-rose-500 transition">Alle löschen</button>
            </div>
            <div id="favorites-list" class="flex flex-wrap gap-3"></div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="text-center text-slate-500 dark:text-slate-400 text-xs pt-6 border-t border-slate-200 dark:border-slate-800">
            &copy; <span id="year"></span> Quick Recipe – Rezepte von TheMealDB
        </footer>
    </main>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 toast-leave transition-all duration-300 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 z-50 font-semibold text-sm">
        <i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-500"></i>
        <span id="toast-text">Geladen!</span>
    </div>

    <script>
        // ============================================================
        // 1. THEME
        // ============================================================
        const htmlRoot = document.documentElement;
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function setTheme(mode) {
            if (mode === 'light') {
                htmlRoot.classList.remove('dark');
                htmlRoot.classList.add('light');
                localStorage.setItem('quickrecipe_theme', 'light');
                themeIcon.className = 'fa-solid fa-moon text-indigo-600 text-base';
                themeText.innerText = 'Dunkler Modus';
            } else {
                htmlRoot.classList.remove('light');
                htmlRoot.classList.add('dark');
                localStorage.setItem('quickrecipe_theme', 'dark');
                themeIcon.className = 'fa-solid fa-sun text-amber-500 text-base';
                themeText.innerText = 'Heller Modus';
            }
        }

        const savedTheme = localStorage.getItem('quickrecipe_theme') || 'dark';
        setTheme(savedTheme);

        function toggleTheme() {
            const isDark = htmlRoot.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        }

        // ============================================================
        // 2. TOAST
        // ============================================================
        let toastTimeout;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toastText.innerText = msg;
            toast.classList.remove('toast-leave');
            toast.classList.add('toast-enter');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-leave');
            }, 2500);
        }

        // ============================================================
        // 3. SERVINGS (Personenanzahl)
        // ============================================================
        let currentServings = 2;
        const servingsDisplay = document.getElementById('servings-display');

        function changeServings(delta) {
            currentServings = Math.max(1, currentServings + delta);
            servingsDisplay.textContent = currentServings;
            // Wenn bereits ein Rezept angezeigt wird, skalieren wir die Zutaten
            const recipeData = document.getElementById('result-content').dataset.recipe;
            if (recipeData) {
                try {
                    const data = JSON.parse(recipeData);
                    displayRecipe(data, currentServings);
                } catch (e) {}
            }
        }

        // ============================================================
        // 4. ZUTATEN-INGABE
        // ============================================================
        const ingredientInput = document.getElementById('ingredient-input');
        const tagContainer = document.getElementById('ingredient-tags');
        let ingredients = [];

        ingredientInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addIngredient();
            }
        });

        function addIngredient() {
            const text = ingredientInput.value.trim();
            if (text && !ingredients.includes(text)) {
                ingredients.push(text);
                renderTags();
                ingredientInput.value = '';
            }
        }

        function removeIngredient(index) {
            ingredients.splice(index, 1);
            renderTags();
        }

        function renderTags() {
            tagContainer.innerHTML = '';
            ingredients.forEach((ing, i) => {
                const tag = document.createElement('span');
                tag.className = 'ingredient-tag';
                tag.innerHTML = `${ing} <i class="fa-regular fa-xmark ml-1 text-xs opacity-60 hover:opacity-100" onclick="removeIngredient(${i})"></i>`;
                tagContainer.appendChild(tag);
            });
        }

        // ============================================================
        // 5. REZEPT-SUCHE (TheMealDB API)
        // ============================================================
        async function searchRecipes() {
            if (ingredients.length === 0) {
                showToast('Bitte gib mindestens eine Zutat ein!');
                return;
            }

            const container = document.getElementById('result-content');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-8">
                    <div class="loading-spinner"></div>
                    <p class="mt-4 text-sm text-slate-500 dark:text-slate-400 font-medium">Suche Rezepte mit ${ingredients.join(', ')}...</p>
                </div>
            `;

            try {
                // Suche nach Rezepten mit den Zutaten
                // TheMealDB hat keine direkte "suche nach Zutaten" API, also nehmen wir einen Umweg:
                // Wir suchen nach dem ersten Zutat und filtern dann manuell

                const mainIngredient = ingredients[0].toLowerCase();
                const response = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?i=${mainIngredient}`);
                if (!response.ok) throw new Error('API nicht erreichbar');

                const data = await response.json();
                if (!data.meals) {
                    container.innerHTML = `
                        <div class="result-box text-center">
                            <i class="fa-regular fa-face-frown text-4xl text-slate-400 mb-3 block"></i>
                            <p class="text-slate-900 dark:text-white font-medium">Keine Rezepte gefunden für "${mainIngredient}"</p>
                            <p class="text-sm text-slate-400">Versuche es mit einer anderen Zutat oder tippe genauer.</p>
                        </div>
                    `;
                    return;
                }

                // Hole die Details für jedes Rezept
                const recipePromises = data.meals.slice(0, 6).map(meal =>
                    fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${meal.idMeal}`).then(r => r.json())
                );

                const recipeResults = await Promise.all(recipePromises);
                const recipes = recipeResults.map(r => r.meals ? r.meals[0] : null).filter(r => r);

                // Sortiere nach Anzahl der übereinstimmenden Zutaten
                const scoredRecipes = recipes.map(recipe => {
                    const recipeIngredients = [];
                    for (let i = 1; i <= 20; i++) {
                        const ing = recipe[`strIngredient${i}`];
                        if (ing && ing.trim()) {
                            recipeIngredients.push(ing.trim().toLowerCase());
                        }
                    }
                    const matchCount = ingredients.filter(ing =>
                        recipeIngredients.some(ri => ri.includes(ing) || ing.includes(ri))
                    ).length;
                    return { recipe, matchCount, totalIngredients: recipeIngredients.length };
                });

                scoredRecipes.sort((a, b) => b.matchCount - a.matchCount);

                if (scoredRecipes.length === 0 || scoredRecipes[0].matchCount === 0) {
                    container.innerHTML = `
                        <div class="result-box text-center">
                            <i class="fa-regular fa-face-frown text-4xl text-slate-400 mb-3 block"></i>
                            <p class="text-slate-900 dark:text-white font-medium">Keine passenden Rezepte gefunden</p>
                            <p class="text-sm text-slate-400">Versuche andere Zutaten oder weniger spezifische Begriffe.</p>
                        </div>
                    `;
                    return;
                }

                // Zeige das beste Rezept
                const best = scoredRecipes[0];
                displayRecipe(best.recipe, currentServings);

                // Zeige weitere Rezepte als Vorschläge (optional)
                if (scoredRecipes.length > 1) {
                    // ... kann später erweitert werden
                }

            } catch (error) {
                container.innerHTML = `
                    <div class="result-box text-center">
                        <i class="fa-regular fa-circle-exclamation text-4xl text-rose-400 mb-3 block"></i>
                        <p class="text-rose-500 font-medium">Fehler beim Laden: ${error.message}</p>
                        <p class="text-sm text-slate-400">Bitte versuche es später noch einmal.</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // 6. REZEPT ANZEIGEN (mit Skalierung)
        // ============================================================
        function displayRecipe(recipe, servings) {
            const container = document.getElementById('result-content');

            // Zutaten extrahieren
            const ingredientsList = [];
            for (let i = 1; i <= 20; i++) {
                const ing = recipe[`strIngredient${i}`];
                const measure = recipe[`strMeasure${i}`];
                if (ing && ing.trim()) {
                    ingredientsList.push({ name: ing.trim(), measure: measure ? measure.trim() : '' });
                }
            }

            // Standard-Portionen (aus API) sind meist 4
            const baseServings = 4;
            const scaleFactor = servings / baseServings;

            // Skalierte Zutaten anzeigen
            const scaledIngredients = ingredientsList.map(item => {
                let scaledMeasure = item.measure;
                // Versuche, die Menge zu skalieren
                const match = item.measure.match(/^([\d.]+)\s*(.*)$/);
                if (match) {
                    const num = parseFloat(match[1]);
                    if (!isNaN(num)) {
                        const scaled = (num * scaleFactor);
                        const unit = match[2] || '';
                        scaledMeasure = (Number.isInteger(scaled) ? scaled : scaled.toFixed(1)) + ' ' + unit;
                    }
                }
                return { name: item.name, measure: scaledMeasure };
            });

            // Favoriten-Status prüfen
            const favorites = JSON.parse(localStorage.getItem('quickrecipe_favorites') || '[]');
            const isFavorite = favorites.some(f => f.idMeal === recipe.idMeal);

            container.innerHTML = `
                <div class="result-box" data-recipe='${JSON.stringify(recipe)}'>
                    <div class="flex flex-wrap justify-between items-start gap-3">
                        <div class="flex-1">
                            <h2 class="text-2xl font-black text-slate-900 dark:text-white">${recipe.strMeal}</h2>
                            ${recipe.strCategory ? `<span class="text-xs bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded-full">${recipe.strCategory}</span>` : ''}
                            ${recipe.strArea ? `<span class="text-xs bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded-full ml-1">${recipe.strArea}</span>` : ''}
                            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full ml-1">${servings} Portionen</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleFavorite('${recipe.idMeal}')" class="favorite-btn ${isFavorite ? 'active' : ''} text-xl text-slate-400 hover:text-yellow-500 transition" title="Favorit">
                                <i class="fa-${isFavorite ? 'solid' : 'regular'} fa-star"></i>
                            </button>
                            <button onclick="shareRecipe('${recipe.idMeal}')" class="share-btn text-xl text-slate-400 hover:text-cyan-500 transition" title="Teilen">
                                <i class="fa-regular fa-share-nodes"></i>
                            </button>
                        </div>
                    </div>

                    ${recipe.strMealThumb ? `<img src="${recipe.strMealThumb}" class="w-full max-w-sm rounded-xl my-3 border border-slate-300 dark:border-slate-700" alt="${recipe.strMeal}">` : ''}

                    <div class="grid md:grid-cols-2 gap-4 mt-3">
                        <div>
                            <p class="text-sm font-bold text-slate-600 dark:text-slate-300">Zutaten (skaliert):</p>
                            <ul class="text-sm text-slate-600 dark:text-slate-300 space-y-1 mt-1">
                                ${scaledIngredients.map(item =>
                                    `<li>• ${item.measure} ${item.name}</li>`
                                ).join('')}
                            </ul>
                        </div>
                        ${recipe.strInstructions ? `
                        <div>
                            <p class="text-sm font-bold text-slate-600 dark:text-slate-300">Zubereitung:</p>
                            <p class="text-sm text-slate-600 dark:text-slate-300 max-h-48 overflow-y-auto custom-scrollbar mt-1">${recipe.strInstructions}</p>
                        </div>` : ''}
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-700 flex flex-wrap gap-2">
                        ${recipe.strYoutube ? `<a href="${recipe.strYoutube}" target="_blank" class="text-xs text-rose-400 hover:text-rose-500 transition"><i class="fa-brands fa-youtube mr-1"></i> Video ansehen</a>` : ''}
                        ${recipe.strSource ? `<a href="${recipe.strSource}" target="_blank" class="text-xs text-cyan-400 hover:text-cyan-500 transition"><i class="fa-regular fa-link mr-1"></i> Original-Rezept</a>` : ''}
                    </div>
                    <p class="text-xs text-slate-400 mt-3">Quelle: TheMealDB</p>
                </div>
            `;

            // Speichere Rezept-Daten für Skalierung
            container.dataset.recipe = JSON.stringify(recipe);

            // Zeige Favoriten-Container
            updateFavoritesUI();
        }

        // ============================================================
        // 7. FAVORITEN
        // ============================================================
        function getFavorites() {
            return JSON.parse(localStorage.getItem('quickrecipe_favorites') || '[]');
        }

        function saveFavorites(favorites) {
            localStorage.setItem('quickrecipe_favorites', JSON.stringify(favorites));
            updateFavoritesUI();
        }

        function toggleFavorite(mealId) {
            let favorites = getFavorites();

            // Erst das Rezept laden, um den Namen zu speichern
            fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealId}`)
                .then(r => r.json())
                .then(data => {
                    const meal = data.meals ? data.meals[0] : null;
                    if (!meal) return;

                    const index = favorites.findIndex(f => f.idMeal === mealId);
                    if (index >= 0) {
                        favorites.splice(index, 1);
                        showToast('Aus Favoriten entfernt');
                    } else {
                        favorites.push({
                            idMeal: meal.idMeal,
                            strMeal: meal.strMeal,
                            strMealThumb: meal.strMealThumb,
                            strCategory: meal.strCategory,
                            strArea: meal.strArea
                        });
                        showToast('Zu Favoriten hinzugefügt!');
                    }
                    saveFavorites(favorites);
                    // Rezept neu anzeigen (für Button-Status)
                    const container = document.getElementById('result-content');
                    const recipeData = container.dataset.recipe;
                    if (recipeData) {
                        try {
                            const data = JSON.parse(recipeData);
                            if (data.idMeal === mealId) {
                                displayRecipe(data, currentServings);
                            }
                        } catch (e) {}
                    }
                });
        }

        function updateFavoritesUI() {
            const favorites = getFavorites();
            const container = document.getElementById('favorites-container');
            const list = document.getElementById('favorites-list');

            if (favorites.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            list.innerHTML = favorites.map(meal => `
                <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-800 p-2 rounded-xl border border-slate-200 dark:border-slate-700">
                    ${meal.strMealThumb ? `<img src="${meal.strMealThumb}" class="w-10 h-10 rounded-lg object-cover" alt="${meal.strMeal}">` : `<div class="w-10 h-10 rounded-lg bg-slate-200 dark:bg-slate-700 flex items-center justify-center"><i class="fa-regular fa-utensils text-slate-400"></i></div>`}
                    <span class="text-sm font-medium text-slate-900 dark:text-white truncate max-w-[150px]">${meal.strMeal}</span>
                    <button onclick="loadFavorite('${meal.idMeal}')" class="text-cyan-500 hover:text-cyan-400 transition text-xs px-2 py-1 rounded-lg bg-cyan-500/10 hover:bg-cyan-500/20">Anzeigen</button>
                    <button onclick="toggleFavorite('${meal.idMeal}')" class="text-rose-400 hover:text-rose-500 transition text-xs">✕</button>
                </div>
            `).join('');
        }

        function loadFavorite(mealId) {
            fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealId}`)
                .then(r => r.json())
                .then(data => {
                    if (data.meals && data.meals[0]) {
                        displayRecipe(data.meals[0], currentServings);
                        showToast('Rezept geladen!');
                    }
                });
        }

        function clearFavorites() {
            if (confirm('Alle Favoriten löschen?')) {
                localStorage.removeItem('quickrecipe_favorites');
                updateFavoritesUI();
                showToast('Favoriten gelöscht');
            }
        }

        // ============================================================
        // 8. SHARING (WhatsApp & andere)
        // ============================================================
        function shareRecipe(mealId) {
            // Rezept laden
            fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealId}`)
                .then(r => r.json())
                .then(data => {
                    const meal = data.meals ? data.meals[0] : null;
                    if (!meal) {
                        showToast('Rezept nicht gefunden');
                        return;
                    }

                    // Rezepttext generieren
                    let ingredients = '';
                    for (let i = 1; i <= 20; i++) {
                        const ing = meal[`strIngredient${i}`];
                        const measure = meal[`strMeasure${i}`];
                        if (ing && ing.trim()) {
                            ingredients += `• ${measure || ''} ${ing}\n`;
                        }
                    }

                    const text = `🍳 *${meal.strMeal}*\n\n*Zutaten:*\n${ingredients}\n*Zubereitung:*\n${meal.strInstructions ? meal.strInstructions.substring(0, 400) + '...' : ''}\n\n${meal.strSource ? '🔗 ' + meal.strSource : ''}`;

                    // Öffne Share-Menü
                    if (navigator.share) {
                        navigator.share({
                            title: meal.strMeal,
                            text: text
                        }).catch(() => {});
                    } else {
                        // Fallback: Copy & WhatsApp
                        const shareOptions = [
                            { name: 'WhatsApp', url: `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}` },
                            { name: 'Telegram', url: `https://t.me/share/url?url=&text=${encodeURIComponent(text)}` },
                            { name: 'Signal', url: `https://signal.me/#/?text=${encodeURIComponent(text)}` },
                            { name: 'Kopieren', action: () => { navigator.clipboard.writeText(text).then(() => showToast('Rezept kopiert!')); } }
                        ];

                        // Zeige Auswahl als einfaches Dropdown
                        let html = `
                            <div class="result-box text-center">
                                <p class="font-medium text-slate-900 dark:text-white mb-3">Rezept teilen:</p>
                                <div class="flex flex-wrap justify-center gap-2">
                        `;
                        shareOptions.forEach(opt => {
                            if (opt.url) {
                                html += `<a href="${opt.url}" target="_blank" class="px-4 py-2 rounded-xl bg-cyan-500/10 text-cyan-500 hover:bg-cyan-500/20 transition font-medium text-sm btn-hover">${opt.name}</a>`;
                            } else {
                                html += `<button onclick="${opt.action.toString()}" class="px-4 py-2 rounded-xl bg-cyan-500/10 text-cyan-500 hover:bg-cyan-500/20 transition font-medium text-sm btn-hover">${opt.name}</button>`;
                            }
                        });
                        html += `</div></div>`;

                        const container = document.getElementById('result-content');
                        // Temporär anzeigen, aber Rezept erhalten
                        const currentHTML = container.innerHTML;
                        container.innerHTML = html;
                        // Nach 5 Sekunden zurück
                        setTimeout(() => {
                            container.innerHTML = currentHTML;
                        }, 10000);
                    }
                });
        }

        // ============================================================
        // 9. COPYRIGHT
        // ============================================================
        document.getElementById('year').textContent = new Date().getFullYear();

        // ============================================================
        // 10. INIT
        // ============================================================
        updateFavoritesUI();

        // Beispiel-Zutaten vorbelegen
        setTimeout(() => {
            ingredientInput.placeholder = 'z.B. chicken, tomato, cheese, pasta...';
        }, 500);
    </script>
</body>
</html>
