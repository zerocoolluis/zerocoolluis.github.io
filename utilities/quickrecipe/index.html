<!DOCTYPE html>
<html lang="de" class="dark" id="html-root">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Recipe – Dein smarter Kochassistent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }
        .toast-enter { transform: translateY(0); opacity: 1; }
        .toast-leave { transform: translateY(150%); opacity: 0; }
        .btn-hover { transition: all 0.25s cubic-bezier(0.25,0.46,0.45,0.94); cursor: pointer; }
        .btn-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56,189,248,0.25); }
        .btn-hover:active { transform: scale(0.96); }
        .result-box { background: rgba(56,189,248,0.05); border-left: 4px solid #38bdf8; padding: 20px 24px; border-radius: 12px; }
        .loading-spinner { border: 3px solid rgba(56,189,248,0.1); border-top: 3px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .ingredient-tag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px 6px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; background: rgba(56,189,248,0.12); color: #38bdf8; border: 1px solid rgba(56,189,248,0.2); }
        .ingredient-tag .remove-btn { cursor: pointer; opacity: 0.6; transition: all 0.2s; font-size: 0.8rem; }
        .ingredient-tag .remove-btn:hover { opacity: 1; color: #ef4444; transform: scale(1.2); }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #e2e8f0; border-radius: 12px; max-height: 200px; overflow-y: auto; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: none; }
        .dark .autocomplete-list { background: #1e293b; border-color: #334155; }
        .autocomplete-item { padding: 10px 16px; cursor: pointer; transition: background 0.15s; font-size: 0.9rem; }
        .autocomplete-item:hover { background: rgba(56,189,248,0.1); }
        .favorite-btn { transition: all 0.2s; }
        .favorite-btn:hover { transform: scale(1.15); }
        .favorite-btn.active { color: #f59e0b; }
        .step-dot { width: 10px; height: 10px; border-radius: 50%; background: #cbd5e1; transition: background 0.3s; display: inline-block; }
        .step-dot.active { background: #38bdf8; box-shadow: 0 0 8px rgba(56,189,248,0.5); }
        .step-dot.done { background: #10b981; }
        @media (max-width: 640px) { .main-title { font-size: 1.8rem; } .ingredient-tag { font-size: 0.75rem; padding: 4px 12px; } }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen p-4 md:p-8 transition-colors duration-200 font-sans">

    <main class="max-w-4xl mx-auto space-y-6">

        <!-- HEADER -->
        <header class="flex flex-wrap justify-between items-center gap-4 pb-6 border-b border-slate-300 dark:border-slate-800">
            <div>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight text-slate-900 dark:text-white main-title">🍳 Quick Recipe</h1>
                <p class="text-xs text-slate-600 dark:text-slate-400 mt-1 font-medium">
                    <i class="fa-regular fa-circle-check text-emerald-500"></i> Rezepte aus dem, was du hast
                </p>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <a href="https://zerocoolluis.github.io" title="Hauptseite" class="flex items-center justify-center p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-sm btn-hover">
                    <i class="fa-solid fa-house text-base"></i>
                </a>
                <button onclick="toggleTheme()" id="theme-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-sm font-semibold text-xs btn-hover">
                    <i id="theme-icon" class="fa-solid fa-sun text-amber-500 text-base"></i>
                    <span id="theme-text" class="hidden sm:inline">Heller Modus</span>
                </button>
            </div>
        </header>

        <!-- EINGABE -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800">
            <label class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider block mb-3">
                <i class="fa-regular fa-fridge mr-2"></i> Was hast du im Kühlschrank?
            </label>
            <div class="relative flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="text" id="ingredient-input"
                           placeholder="Zutat eingeben (z.B. Mozzarella)"
                           class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 focus:border-cyan-500 dark:focus:border-cyan-400 outline-none text-slate-900 dark:text-white text-sm transition" />
                    <div id="autocomplete-list" class="autocomplete-list"></div>
                </div>
                <button onclick="addIngredient()" class="btn-hover px-6 py-3 rounded-xl bg-cyan-500 text-white font-bold text-sm hover:bg-cyan-600 transition shadow-lg shadow-cyan-500/20 whitespace-nowrap">
                    <i class="fa-solid fa-plus mr-1"></i> Hinzufügen
                </button>
            </div>
            <div id="ingredient-tags" class="mt-3 flex flex-wrap gap-2"></div>
            <div class="mt-4 flex items-center gap-4 flex-wrap border-t border-slate-200 dark:border-slate-700 pt-4">
                <label class="text-sm font-medium text-slate-600 dark:text-slate-300">
                    <i class="fa-regular fa-users mr-1"></i> Portionen:
                </label>
                <div class="flex items-center gap-2">
                    <button onclick="changeServings(-1)" class="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold hover:bg-slate-300 dark:hover:bg-slate-600 transition btn-hover">−</button>
                    <span id="servings-display" class="text-lg font-bold text-cyan-500 min-w-[40px] text-center">2</span>
                    <button onclick="changeServings(1)" class="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold hover:bg-slate-300 dark:hover:bg-slate-600 transition btn-hover">+</button>
                </div>
                <span class="text-xs text-slate-400">(Zutaten werden automatisch angepasst)</span>
                <button onclick="searchRecipes()" class="btn-hover ml-auto px-6 py-2 rounded-xl bg-emerald-500 text-white font-bold text-sm hover:bg-emerald-600 transition shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-magnifying-glass mr-1"></i> Rezept suchen
                </button>
            </div>
        </div>

        <!-- ERGEBNISSE -->
        <div id="result-container" class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800 min-h-[200px] flex items-center justify-center">
            <div id="result-content" class="w-full text-center text-slate-400 dark:text-slate-500">
                <i class="fa-regular fa-utensils text-4xl mb-3 block"></i>
                <p class="font-medium">Füge Zutaten hinzu und klicke auf <strong>Rezept suchen</strong></p>
                <p class="text-sm">Tipp: Je mehr Zutaten, desto passender das Rezept!</p>
            </div>
        </div>

        <!-- FAVORITEN -->
        <div id="favorites-container" class="hidden bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    <i class="fa-regular fa-star text-yellow-500 mr-2"></i> Deine Favoriten
                </h3>
                <button onclick="clearFavorites()" class="text-xs text-rose-400 hover:text-rose-500 transition">Alle löschen</button>
            </div>
            <div id="favorites-list" class="flex flex-wrap gap-3"></div>
        </div>

        <footer class="text-center text-slate-500 dark:text-slate-400 text-xs pt-6 border-t border-slate-200 dark:border-slate-800">
            &copy; <span id="year"></span> Quick Recipe – 3 API-Ebenen (Spoonacular, TheMealDB, lokale DB)
        </footer>
    </main>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 toast-leave transition-all duration-300 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 z-50 font-semibold text-sm">
        <i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-500"></i>
        <span id="toast-text">Geladen!</span>
    </div>

    <script>
        // ============================================================
        // 1. API-KEYS
        // ============================================================
        const SPOONACULAR_API_KEY = '03fe36cd334448a5b8f296daa182f82b';

        // ============================================================
        // 2. THEME
        // ============================================================
        const htmlRoot = document.documentElement;
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function setTheme(mode) {
            if (mode === 'light') {
                htmlRoot.classList.remove('dark');
                htmlRoot.classList.add('light');
                localStorage.setItem('quickrecipe_theme', 'light');
                themeIcon.className = 'fa-solid fa-moon text-indigo-600 text-base';
                themeText.innerText = 'Dunkler Modus';
            } else {
                htmlRoot.classList.remove('light');
                htmlRoot.classList.add('dark');
                localStorage.setItem('quickrecipe_theme', 'dark');
                themeIcon.className = 'fa-solid fa-sun text-amber-500 text-base';
                themeText.innerText = 'Heller Modus';
            }
        }

        const savedTheme = localStorage.getItem('quickrecipe_theme') || 'dark';
        setTheme(savedTheme);

        function toggleTheme() {
            const isDark = htmlRoot.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        }

        // ============================================================
        // 3. TOAST
        // ============================================================
        let toastTimeout;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toastText.innerText = msg;
            toast.classList.remove('toast-leave');
            toast.classList.add('toast-enter');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-leave');
            }, 2500);
        }

        // ============================================================
        // 4. SERVINGS
        // ============================================================
        let currentServings = 2;
        const servingsDisplay = document.getElementById('servings-display');

        function changeServings(delta) {
            currentServings = Math.max(1, currentServings + delta);
            servingsDisplay.textContent = currentServings;
            const container = document.getElementById('result-content');
            if (container.dataset.recipe) {
                try {
                    const recipe = JSON.parse(container.dataset.recipe);
                    displayRecipe(recipe, currentServings);
                } catch (e) {}
            }
        }

        // ============================================================
        // 5. ZUTATEN-ÜBERSETZUNGSTABELLE (deutsch → englisch)
        // ============================================================
        const INGREDIENT_TRANSLATIONS = {
            'hähnchen': 'chicken',
            'hühnchen': 'chicken',
            'huhn': 'chicken',
            'rindfleisch': 'beef',
            'rind': 'beef',
            'schweinefleisch': 'pork',
            'schwein': 'pork',
            'pute': 'turkey',
            'truthahn': 'turkey',
            'ente': 'duck',
            'lamm': 'lamb',
            'lachs': 'salmon',
            'thunfisch': 'tuna',
            'garnelen': 'shrimp',
            'krevetten': 'shrimp',
            'mozzarella': 'mozzarella',
            'tomate': 'tomato',
            'zwiebel': 'onion',
            'knoblauch': 'garlic',
            'paprika': 'bell pepper',
            'gurke': 'cucumber',
            'karotte': 'carrot',
            'möhre': 'carrot',
            'kartoffel': 'potato',
            'brokkoli': 'broccoli',
            'blumenkohl': 'cauliflower',
            'spinat': 'spinach',
            'champignons': 'mushrooms',
            'pilze': 'mushrooms',
            'aubergine': 'eggplant',
            'zucchini': 'zucchini',
            'kürbis': 'pumpkin',
            'milch': 'milk',
            'sahne': 'cream',
            'butter': 'butter',
            'käse': 'cheese',
            'parmesan': 'parmesan',
            'feta': 'feta',
            'joghurt': 'yogurt',
            'eier': 'eggs',
            'ei': 'egg',
            'pasta': 'pasta',
            'nudeln': 'pasta',
            'spaghetti': 'spaghetti',
            'reis': 'rice',
            'brot': 'bread',
            'mehl': 'flour',
            'salz': 'salt',
            'pfeffer': 'pepper',
            'olivenöl': 'olive oil',
            'essig': 'vinegar',
            'sojasauce': 'soy sauce',
            'honig': 'honey',
            'senf': 'mustard',
            'zitrone': 'lemon',
            'orange': 'orange',
            'apfel': 'apple',
            'banane': 'banana',
            'erdbeere': 'strawberry',
            'avocado': 'avocado',
            'chili': 'chili',
            'ingwer': 'ginger',
            'basilikum': 'basil',
            'petersilie': 'parsley',
            'thymian': 'thyme',
            'rosmarin': 'rosemary',
            'oregano': 'oregano',
            'koriander': 'cilantro',
            'kurkuma': 'turmeric',
            'kreuzkümmel': 'cumin'
        };

        function translateIngredient(german) {
            const lower = german.toLowerCase().trim();
            return INGREDIENT_TRANSLATIONS[lower] || german;
        }

        // ============================================================
        // 6. ZUTATEN-INGABE (Autocomplete mit großer Liste)
        // ============================================================
        const FOOD_SUGGESTIONS = [
            'Hähnchen', 'Rindfleisch', 'Schweinefleisch', 'Pute', 'Ente', 'Lamm', 'Lachs', 'Thunfisch', 'Garnelen',
            'Mozzarella', 'Tomate', 'Zwiebel', 'Knoblauch', 'Paprika', 'Gurke', 'Karotte', 'Kartoffel',
            'Brokkoli', 'Blumenkohl', 'Spinat', 'Champignons', 'Aubergine', 'Zucchini', 'Kürbis',
            'Milch', 'Sahne', 'Butter', 'Käse', 'Parmesan', 'Feta', 'Joghurt', 'Eier', 'Pasta', 'Reis',
            'Brot', 'Mehl', 'Salz', 'Pfeffer', 'Olivenöl', 'Essig', 'Sojasauce', 'Honig', 'Senf',
            'Zitrone', 'Orange', 'Apfel', 'Banane', 'Erdbeere', 'Avocado', 'Chili', 'Ingwer',
            'Basilikum', 'Petersilie', 'Thymian', 'Rosmarin', 'Oregano', 'Koriander', 'Kurkuma', 'Kreuzkümmel'
        ];

        const ingredientInput = document.getElementById('ingredient-input');
        const tagContainer = document.getElementById('ingredient-tags');
        const autocompleteContainer = document.getElementById('autocomplete-list');
        let ingredients = [];

        function filterSuggestions(query) {
            if (!query) return [];
            const q = query.toLowerCase().trim();
            return FOOD_SUGGESTIONS.filter(f => f.toLowerCase().includes(q)).slice(0, 10);
        }

        ingredientInput.addEventListener('input', function() {
            const query = this.value.trim();
            const suggestions = filterSuggestions(query);
            if (suggestions.length > 0 && query.length > 1) {
                autocompleteContainer.innerHTML = suggestions.map(s =>
                    `<div class="autocomplete-item" onclick="selectSuggestion('${s.replace(/'/g, "\\'")}')">${s}</div>`
                ).join('');
                autocompleteContainer.style.display = 'block';
            } else {
                autocompleteContainer.style.display = 'none';
            }
        });

        ingredientInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const first = autocompleteContainer.querySelector('.autocomplete-item');
                if (first) {
                    selectSuggestion(first.textContent);
                } else {
                    addIngredient();
                }
            }
            if (e.key === 'Escape') {
                autocompleteContainer.style.display = 'none';
            }
        });

        document.addEventListener('click', function(e) {
            if (!ingredientInput.contains(e.target) && !autocompleteContainer.contains(e.target)) {
                autocompleteContainer.style.display = 'none';
            }
        });

        function selectSuggestion(name) {
            ingredientInput.value = name;
            autocompleteContainer.style.display = 'none';
            addIngredient();
        }

        function addIngredient() {
            const raw = ingredientInput.value.trim();
            if (!raw) { showToast('Bitte gib eine Zutat ein.'); return; }
            const normalized = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
            if (!ingredients.includes(normalized)) {
                ingredients.push(normalized);
                renderTags();
                ingredientInput.value = '';
                autocompleteContainer.style.display = 'none';
                showToast(`${normalized} hinzugefügt`);
            } else {
                showToast(`${normalized} ist bereits in der Liste.`);
            }
        }

        function removeIngredient(index) {
            const removed = ingredients[index];
            ingredients.splice(index, 1);
            renderTags();
            showToast(`${removed} entfernt`);
        }

        function renderTags() {
            tagContainer.innerHTML = '';
            ingredients.forEach((ing, i) => {
                const tag = document.createElement('span');
                tag.className = 'ingredient-tag';
                tag.innerHTML = `${ing} <span class="remove-btn" onclick="removeIngredient(${i})"><i class="fa-regular fa-xmark"></i></span>`;
                tagContainer.appendChild(tag);
            });
        }

        // ============================================================
        // 7. ÜBERSETZUNG (für Rezepte)
        // ============================================================
        async function translateText(text, targetLang = 'de') {
            if (!text) return '';
            try {
                const response = await fetch('https://libretranslate.de/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: text, source: 'en', target: targetLang, format: 'text' })
                });
                if (!response.ok) throw new Error('Übersetzung nicht verfügbar');
                const data = await response.json();
                return data.translatedText || text;
            } catch (error) {
                try {
                    const fbUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                    const fbResponse = await fetch(fbUrl);
                    const fbData = await fbResponse.json();
                    if (fbData && fbData[0]) {
                        return fbData[0].map(item => item[0]).join('');
                    }
                } catch (e2) {}
                return text;
            }
        }

        // ============================================================
        // 8. LOKALE REZEPT-DATENBANK (Fallback)
        // ============================================================
        const LOCAL_RECIPES = [
            {
                idMeal: 'local1',
                strMeal: 'Gebratene Pute mit Kartoffeln',
                strCategory: 'Hauptgericht',
                strArea: 'Deutsch',
                strMealThumb: '',
                strInstructions: '1. Pute in Stücke schneiden und mit Salz und Pfeffer würzen. 2. In einer Pfanne Öl erhitzen und die Pute goldbraun anbraten. 3. Kartoffeln schälen, würfeln und mitbraten. 4. Mit etwas Wasser oder Brühe ablöschen und zugedeckt 20 Minuten köcheln lassen. 5. Mit Kräutern garnieren und servieren.',
                extendedIngredients: [
                    { name: 'Pute', measure: '500 g' },
                    { name: 'Kartoffeln', measure: '4 große' },
                    { name: 'Salz', measure: 'nach Geschmack' },
                    { name: 'Pfeffer', measure: 'nach Geschmack' },
                    { name: 'Petersilie', measure: 'etwas' }
                ],
                servings: 4,
                source: 'Lokal'
            },
            {
                idMeal: 'local2',
                strMeal: 'Putenbrust mit Tomatensauce',
                strCategory: 'Hauptgericht',
                strArea: 'Italienisch',
                strMealThumb: '',
                strInstructions: '1. Putenbrust in Scheiben schneiden und leicht klopfen. 2. In Mehl wenden und in Öl braten. 3. Tomatensauce mit Knoblauch und Kräutern zubereiten. 4. Putenbrust in die Sauce geben und 10 Minuten ziehen lassen. 5. Mit Pasta servieren.',
                extendedIngredients: [
                    { name: 'Putenbrust', measure: '400 g' },
                    { name: 'Tomaten (gestückelt)', measure: '1 Dose' },
                    { name: 'Knoblauch', measure: '2 Zehen' },
                    { name: 'Pasta', measure: '250 g' },
                    { name: 'Salz', measure: 'nach Geschmack' },
                    { name: 'Pfeffer', measure: 'nach Geschmack' }
                ],
                servings: 3,
                source: 'Lokal'
            },
            // Weitere lokale Rezepte für andere Zutaten...
        ];

        // ============================================================
        // 9. REZEPTSUCHE (3 API-Ebenen)
        // ============================================================
        async function searchRecipes() {
            if (ingredients.length === 0) {
                showToast('Bitte füge mindestens eine Zutat hinzu!');
                return;
            }

            const container = document.getElementById('result-content');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-8">
                    <div class="loading-spinner"></div>
                    <p class="mt-4 text-sm text-slate-500 dark:text-slate-400 font-medium">Suche Rezepte mit ${ingredients.join(', ')}...</p>
                </div>
            `;

            let recipe = null;
            let source = '';

            // --- Ebene 1: Spoonacular ---
            try {
                // Übersetze Zutaten ins Englische
                const engIngredients = ingredients.map(i => translateIngredient(i)).join(',');
                const response = await fetch(
                    `https://api.spoonacular.com/recipes/findByIngredients?` +
                    `ingredients=${encodeURIComponent(engIngredients)}&` +
                    `number=3&ranking=1&ignorePantry=true&apiKey=${SPOONACULAR_API_KEY}`
                );

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const bestMatch = data[0];
                        const detailRes = await fetch(
                            `https://api.spoonacular.com/recipes/${bestMatch.id}/information?apiKey=${SPOONACULAR_API_KEY}`
                        );
                        if (detailRes.ok) {
                            const detailData = await detailRes.json();
                            recipe = {
                                idMeal: detailData.id.toString(),
                                strMeal: detailData.title,
                                strCategory: detailData.dishTypes ? detailData.dishTypes.join(', ') : '',
                                strArea: detailData.cuisines ? detailData.cuisines.join(', ') : '',
                                strMealThumb: detailData.image,
                                strInstructions: detailData.instructions || 'Keine Anleitung verfügbar.',
                                strSource: detailData.sourceUrl || '',
                                extendedIngredients: detailData.extendedIngredients || [],
                                servings: detailData.servings || 2
                            };
                            source = 'Spoonacular';
                        }
                    }
                }
            } catch (e) {
                console.warn('Spoonacular fehlgeschlagen:', e);
            }

            // --- Ebene 2: TheMealDB ---
            if (!recipe) {
                try {
                    // Nimm die erste Zutat und übersetze sie
                    const mainIng = translateIngredient(ingredients[0]);
                    const response = await fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?i=${encodeURIComponent(mainIng)}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.meals && data.meals.length > 0) {
                            const mealId = data.meals[0].idMeal;
                            const detailRes = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealId}`);
                            const detailData = await detailRes.json();
                            if (detailData.meals && detailData.meals[0]) {
                                const meal = detailData.meals[0];
                                const ingredientsList = [];
                                for (let i = 1; i <= 20; i++) {
                                    const ing = meal[`strIngredient${i}`];
                                    const measure = meal[`strMeasure${i}`];
                                    if (ing && ing.trim()) {
                                        ingredientsList.push({ name: ing.trim(), measure: measure ? measure.trim() : '' });
                                    }
                                }
                                recipe = {
                                    idMeal: meal.idMeal,
                                    strMeal: meal.strMeal,
                                    strCategory: meal.strCategory || '',
                                    strArea: meal.strArea || '',
                                    strMealThumb: meal.strMealThumb,
                                    strInstructions: meal.strInstructions || 'Keine Anleitung verfügbar.',
                                    strSource: meal.strSource || '',
                                    extendedIngredients: ingredientsList,
                                    servings: 4
                                };
                                source = 'TheMealDB';
                            }
                        }
                    }
                } catch (e) {
                    console.warn('TheMealDB fehlgeschlagen:', e);
                }
            }

            // --- Ebene 3: Lokale Datenbank ---
            if (!recipe) {
                // Suche in LOCAL_RECIPES nach einer passenden Zutat
                const matched = LOCAL_RECIPES.filter(r =>
                    r.extendedIngredients.some(ing =>
                        ingredients.some(userIng =>
                            userIng.toLowerCase().includes(ing.name.toLowerCase()) ||
                            ing.name.toLowerCase().includes(userIng.toLowerCase())
                        )
                    )
                );
                if (matched.length > 0) {
                    recipe = matched[0];
                    source = 'Lokal';
                }
            }

            // --- Kein Rezept gefunden ---
            if (!recipe) {
                container.innerHTML = `
                    <div class="result-box text-center">
                        <i class="fa-regular fa-face-frown text-4xl text-slate-400 mb-3 block"></i>
                        <p class="text-slate-900 dark:text-white font-medium">Kein Rezept gefunden</p>
                        <p class="text-sm text-slate-400">Versuche andere Zutaten oder schreibe sie auf Deutsch.</p>
                        <p class="text-xs text-slate-400 mt-2">Tipp: "Pute" wird als "turkey" erkannt.</p>
                    </div>
                `;
                return;
            }

            // Rezept anzeigen
            await displayRecipe(recipe, currentServings);
            showToast(`Rezept von ${source} gefunden!`);
        }

        // ============================================================
        // 10. REZEPT ANZEIGEN
        // ============================================================
        let currentStepIndex = 0;
        let translatedSteps = [];

        async function displayRecipe(recipe, servings) {
            const container = document.getElementById('result-content');

            let ingredientsList = [];
            if (recipe.extendedIngredients) {
                ingredientsList = recipe.extendedIngredients.map(ing => ({
                    name: ing.name,
                    measure: ing.measure || ''
                }));
            }

            const baseServings = recipe.servings || 2;
            const scaleFactor = servings / baseServings;
            const scaledIngredients = ingredientsList.map(item => {
                let scaledMeasure = item.measure;
                const match = item.measure.match(/^([\d.]+)\s*(.*)$/);
                if (match) {
                    const num = parseFloat(match[1]);
                    if (!isNaN(num)) {
                        const scaled = (num * scaleFactor);
                        const unit = match[2] || '';
                        scaledMeasure = (Number.isInteger(scaled) ? scaled : scaled.toFixed(1)) + ' ' + unit;
                    }
                }
                return { name: item.name, measure: scaledMeasure };
            });

            let instructions = recipe.strInstructions || '';
            let rawSteps = [];
            if (typeof instructions === 'string' && instructions.length > 0) {
                rawSteps = instructions.split(/(?<=[.!?])\s+/).filter(s => s.length > 10);
                if (rawSteps.length === 0) rawSteps = [instructions];
            } else {
                rawSteps = ['Keine Schritt-für-Schritt-Anleitung verfügbar.'];
            }
            currentStepIndex = 0;

            // Übersetzen
            const translatedTitle = await translateText(recipe.strMeal || 'Rezept');
            const translatedInstructions = await translateText(instructions);
            if (translatedInstructions && translatedInstructions.length > 0) {
                translatedSteps = translatedInstructions.split(/(?<=[.!?])\s+/).filter(s => s.length > 10);
                if (translatedSteps.length === 0) translatedSteps = [translatedInstructions];
            } else {
                translatedSteps = rawSteps.map(s => s);
            }

            const translatedIngredients = await Promise.all(scaledIngredients.map(async item => {
                const translatedName = await translateText(item.name);
                return { ...item, name: translatedName };
            }));

            const favorites = JSON.parse(localStorage.getItem('quickrecipe_favorites') || '[]');
            const isFavorite = favorites.some(f => f.idMeal === recipe.idMeal);

            container.innerHTML = `
                <div class="result-box" data-recipe='${JSON.stringify(recipe)}'>
                    <div class="flex flex-wrap justify-between items-start gap-3">
                        <div class="flex-1">
                            <h2 class="text-2xl font-black text-slate-900 dark:text-white">${translatedTitle}</h2>
                            ${recipe.strCategory ? `<span class="text-xs bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded-full">${recipe.strCategory}</span>` : ''}
                            ${recipe.strArea ? `<span class="text-xs bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded-full ml-1">${recipe.strArea}</span>` : ''}
                            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full ml-1">${servings} Portionen</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleFavorite('${recipe.idMeal}')" class="favorite-btn ${isFavorite ? 'active' : ''} text-xl text-slate-400 hover:text-yellow-500 transition" title="Favorit">
                                <i class="fa-${isFavorite ? 'solid' : 'regular'} fa-star"></i>
                            </button>
                            <button onclick="nextRecipe()" class="share-btn text-xl text-slate-400 hover:text-emerald-500 transition" title="Nächstes Rezept">
                                <i class="fa-regular fa-forward"></i>
                            </button>
                        </div>
                    </div>

                    ${recipe.strMealThumb ? `<img src="${recipe.strMealThumb}" class="w-full max-w-sm rounded-xl my-3 border border-slate-300 dark:border-slate-700" alt="${translatedTitle}">` : ''}

                    <div class="grid md:grid-cols-2 gap-4 mt-3">
                        <div>
                            <p class="text-sm font-bold text-slate-600 dark:text-slate-300">Zutaten (skaliert):</p>
                            <ul class="text-sm text-slate-600 dark:text-slate-300 space-y-1 mt-1">
                                ${translatedIngredients.map(item =>
                                    `<li>• ${item.measure} ${item.name}</li>`
                                ).join('')}
                            </ul>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-slate-600 dark:text-slate-300">Zubereitung:</p>
                            <div id="step-container" class="mt-1">
                                <div class="step-indicator mb-2">
                                    ${translatedSteps.map((_, idx) =>
                                        `<span class="step-dot ${idx === currentStepIndex ? 'active' : (idx < currentStepIndex ? 'done' : '')}"></span>`
                                    ).join('')}
                                </div>
                                <p id="step-text" class="text-sm text-slate-600 dark:text-slate-300">${translatedSteps[currentStepIndex] || 'Kein Schritt verfügbar.'}</p>
                                <div class="mt-2 flex gap-2 flex-wrap">
                                    ${currentStepIndex > 0 ? `<button onclick="prevStep()" class="btn-hover text-xs px-3 py-1 rounded-lg bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 transition">← Zurück</button>` : ''}
                                    ${currentStepIndex < translatedSteps.length - 1 ? `<button onclick="nextStep()" class="btn-hover text-xs px-3 py-1 rounded-lg bg-cyan-500 text-white hover:bg-cyan-600 transition">Weiter →</button>` : ''}
                                    ${currentStepIndex === translatedSteps.length - 1 && translatedSteps.length > 1 ? `<span class="text-xs text-emerald-500 font-bold">✅ Fertig!</span>` : ''}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-700 flex flex-wrap gap-2">
                        ${recipe.strSource ? `<a href="${recipe.strSource}" target="_blank" class="text-xs text-cyan-400 hover:text-cyan-500 transition"><i class="fa-regular fa-link mr-1"></i> Original-Rezept</a>` : ''}
                    </div>
                    <p class="text-xs text-slate-400 mt-3">Quelle: ${recipe.strSource ? 'Spoonacular' : (recipe.source || 'TheMealDB/Lokal')}</p>
                </div>
            `;

            container.dataset.recipe = JSON.stringify(recipe);
            updateFavoritesUI();
        }

        // ============================================================
        // 11. SCHRITT-NAVIGATION
        // ============================================================
        function nextStep() {
            if (currentStepIndex < translatedSteps.length - 1) {
                currentStepIndex++;
                updateStepDisplay();
            }
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                updateStepDisplay();
            }
        }

        function updateStepDisplay() {
            const stepText = document.getElementById('step-text');
            const dots = document.querySelectorAll('.step-dot');
            if (stepText && dots.length) {
                stepText.textContent = translatedSteps[currentStepIndex] || 'Kein Schritt verfügbar.';
                dots.forEach((dot, idx) => {
                    dot.className = `step-dot ${idx === currentStepIndex ? 'active' : (idx < currentStepIndex ? 'done' : '')}`;
                });
            }
        }

        // ============================================================
        // 12. NÄCHSTES REZEPT
        // ============================================================
        async function nextRecipe() {
            showToast('Lade neues Rezept...');
            await searchRecipes();
        }

        // ============================================================
        // 13. FAVORITEN
        // ============================================================
        function getFavorites() {
            return JSON.parse(localStorage.getItem('quickrecipe_favorites') || '[]');
        }

        function saveFavorites(favorites) {
            localStorage.setItem('quickrecipe_favorites', JSON.stringify(favorites));
            updateFavoritesUI();
        }

        async function toggleFavorite(mealId) {
            let favorites = getFavorites();
            const index = favorites.findIndex(f => f.idMeal === mealId);
            if (index >= 0) {
                favorites.splice(index, 1);
                showToast('Aus Favoriten entfernt');
                saveFavorites(favorites);
                const container = document.getElementById('result-content');
                const recipeData = container.dataset.recipe;
                if (recipeData) {
                    try {
                        const data = JSON.parse(recipeData);
                        if (data.idMeal === mealId) {
                            await displayRecipe(data, currentServings);
                        }
                    } catch (e) {}
                }
                return;
            }

            try {
                const detailRes = await fetch(
                    `https://api.spoonacular.com/recipes/${mealId}/information?apiKey=${SPOONACULAR_API_KEY}`
                );
                if (!detailRes.ok) throw new Error('Rezept nicht gefunden');
                const detailData = await detailRes.json();
                const meal = {
                    idMeal: detailData.id.toString(),
                    strMeal: detailData.title,
                    strMealThumb: detailData.image,
                    strCategory: detailData.dishTypes ? detailData.dishTypes.join(', ') : '',
                    strArea: detailData.cuisines ? detailData.cuisines.join(', ') : ''
                };
                favorites.push(meal);
                saveFavorites(favorites);
                showToast('Zu Favoriten hinzugefügt!');
            } catch (e) {
                showToast('Fehler beim Speichern des Favoriten');
            }
        }

        function updateFavoritesUI() {
            const favorites = getFavorites();
            const container = document.getElementById('favorites-container');
            const list = document.getElementById('favorites-list');

            if (favorites.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            list.innerHTML = favorites.map(meal => `
                <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-800 p-2 rounded-xl border border-slate-200 dark:border-slate-700">
                    ${meal.strMealThumb ? `<img src="${meal.strMealThumb}" class="w-10 h-10 rounded-lg object-cover" alt="${meal.strMeal}">` : `<div class="w-10 h-10 rounded-lg bg-slate-200 dark:bg-slate-700 flex items-center justify-center"><i class="fa-regular fa-utensils text-slate-400"></i></div>`}
                    <span class="text-sm font-medium text-slate-900 dark:text-white truncate max-w-[150px]">${meal.strMeal}</span>
                    <button onclick="loadFavorite('${meal.idMeal}')" class="text-cyan-500 hover:text-cyan-400 transition text-xs px-2 py-1 rounded-lg bg-cyan-500/10 hover:bg-cyan-500/20">Anzeigen</button>
                    <button onclick="toggleFavorite('${meal.idMeal}')" class="text-rose-400 hover:text-rose-500 transition text-xs">✕</button>
                </div>
            `).join('');
        }

        async function loadFavorite(mealId) {
            try {
                const detailRes = await fetch(
                    `https://api.spoonacular.com/recipes/${mealId}/information?apiKey=${SPOONACULAR_API_KEY}`
                );
                if (!detailRes.ok) throw new Error('Rezept nicht gefunden');
                const detailData = await detailRes.json();
                const recipe = {
                    idMeal: detailData.id.toString(),
                    strMeal: detailData.title,
                    strCategory: detailData.dishTypes ? detailData.dishTypes.join(', ') : '',
                    strArea: detailData.cuisines ? detailData.cuisines.join(', ') : '',
                    strMealThumb: detailData.image,
                    strInstructions: detailData.instructions || 'Keine Anleitung verfügbar.',
                    strSource: detailData.sourceUrl || '',
                    extendedIngredients: detailData.extendedIngredients || [],
                    servings: detailData.servings || 2
                };
                await displayRecipe(recipe, currentServings);
                showToast('Rezept geladen!');
            } catch (e) {
                showToast('Fehler beim Laden des Rezepts');
            }
        }

        function clearFavorites() {
            if (confirm('Alle Favoriten löschen?')) {
                localStorage.removeItem('quickrecipe_favorites');
                updateFavoritesUI();
                showToast('Favoriten gelöscht');
            }
        }

        // ============================================================
        // 14. COPYRIGHT & INIT
        // ============================================================
        document.getElementById('year').textContent = new Date().getFullYear();
        updateFavoritesUI();

        console.log('🍳 Quick Recipe mit 3 API-Ebenen gestartet (Spoonacular, TheMealDB, lokal)');
        console.log('🔍 Zutaten-Übersetzung aktiviert – "Pute" wird zu "turkey"');
    </script>
</body>
</html>
