<!DOCTYPE html>
<html lang="de" class="dark" id="html-root">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Recipe – Dein smarter Kochassistent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }
        .toast-enter { transform: translateY(0); opacity: 1; }
        .toast-leave { transform: translateY(150%); opacity: 0; }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .card-hover:hover {
            transform: translateY(-6px);
            border-color: #38bdf8;
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.15);
        }

        .btn-hover {
            transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
        }
        .btn-hover:active {
            transform: scale(0.96);
        }

        .result-box {
            background: rgba(56, 189, 248, 0.05);
            border-left: 4px solid #38bdf8;
            padding: 20px 24px;
            border-radius: 12px;
            transition: all 0.3s;
        }
        .result-box:hover {
            background: rgba(56, 189, 248, 0.08);
        }

        .loading-spinner {
            border: 3px solid rgba(56, 189, 248, 0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ingredient-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.2);
            transition: all 0.2s;
            cursor: default;
        }
        .ingredient-tag .remove-btn {
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.2s;
            font-size: 0.8rem;
        }
        .ingredient-tag .remove-btn:hover {
            opacity: 1;
            color: #ef4444;
            transform: scale(1.2);
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: none;
        }
        .dark .autocomplete-list {
            background: #1e293b;
            border-color: #334155;
        }
        .autocomplete-item {
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 0.9rem;
        }
        .autocomplete-item:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .favorite-btn { transition: all 0.2s; }
        .favorite-btn:hover { transform: scale(1.15); }
        .favorite-btn.active { color: #f59e0b; }
        .share-btn { transition: all 0.2s; }
        .share-btn:hover { transform: scale(1.1); }

        .translation-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        @media (max-width: 640px) {
            .main-title { font-size: 1.8rem; }
            .ingredient-tag { font-size: 0.75rem; padding: 4px 12px; }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen p-4 md:p-8 transition-colors duration-200 font-sans">

    <main class="max-w-4xl mx-auto space-y-6">

        <!-- ===== HEADER ===== -->
        <header class="flex flex-wrap justify-between items-center gap-4 pb-6 border-b border-slate-300 dark:border-slate-800">
            <div>
                <h1 class="text-2xl md:text-3xl font-black tracking-tight text-slate-900 dark:text-white main-title">🍳 Quick Recipe</h1>
                <p class="text-xs text-slate-600 dark:text-slate-400 mt-1 font-medium" id="api-status">
                    <i class="fa-regular fa-circle-check text-emerald-500"></i> Live-APIs: Zutaten + Rezepte
                </p>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <a href="https://zerocoolluis.github.io" title="Hauptseite" class="flex items-center justify-center p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-sm btn-hover">
                    <i class="fa-solid fa-house text-base"></i>
                </a>
                <button onclick="toggleTheme()" id="theme-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-sm font-semibold text-xs btn-hover">
                    <i id="theme-icon" class="fa-solid fa-sun text-amber-500 text-base"></i>
                    <span id="theme-text" class="hidden sm:inline">Heller Modus</span>
                </button>
            </div>
        </header>

        <!-- ===== EINGABE ===== -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800">
            <label class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider block mb-3">
                <i class="fa-regular fa-fridge mr-2"></i> Was hast du im Kühlschrank?
            </label>

            <div class="relative flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="text" id="ingredient-input"
                           placeholder="Zutat eingeben (z.B. Hühnchen)"
                           class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 focus:border-cyan-500 dark:focus:border-cyan-400 outline-none text-slate-900 dark:text-white text-sm transition" />
                    <div id="autocomplete-list" class="autocomplete-list"></div>
                </div>
                <button onclick="addIngredient()" class="btn-hover px-6 py-3 rounded-xl bg-cyan-500 text-white font-bold text-sm hover:bg-cyan-600 transition shadow-lg shadow-cyan-500/20 whitespace-nowrap">
                    <i class="fa-solid fa-plus mr-1"></i> Hinzufügen
                </button>
            </div>

            <div id="ingredient-tags" class="mt-3 flex flex-wrap gap-2"></div>

            <div class="mt-4 flex items-center gap-4 flex-wrap border-t border-slate-200 dark:border-slate-700 pt-4">
                <label class="text-sm font-medium text-slate-600 dark:text-slate-300">
                    <i class="fa-regular fa-users mr-1"></i> Portionen:
                </label>
                <div class="flex items-center gap-2">
                    <button onclick="changeServings(-1)" class="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold hover:bg-slate-300 dark:hover:bg-slate-600 transition btn-hover">−</button>
                    <span id="servings-display" class="text-lg font-bold text-cyan-500 min-w-[40px] text-center">2</span>
                    <button onclick="changeServings(1)" class="w-8 h-8 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold hover:bg-slate-300 dark:hover:bg-slate-600 transition btn-hover">+</button>
                </div>
                <span class="text-xs text-slate-400">(Zutaten werden automatisch angepasst)</span>
                <button onclick="searchRecipes()" class="btn-hover ml-auto px-6 py-2 rounded-xl bg-emerald-500 text-white font-bold text-sm hover:bg-emerald-600 transition shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-magnifying-glass mr-1"></i> Rezept suchen
                </button>
            </div>
        </div>

        <!-- ===== ERGEBNISSE ===== -->
        <div id="result-container" class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800 min-h-[200px] flex items-center justify-center">
            <div id="result-content" class="w-full text-center text-slate-400 dark:text-slate-500">
                <i class="fa-regular fa-utensils text-4xl mb-3 block"></i>
                <p class="font-medium">Füge Zutaten hinzu und klicke auf <strong>Rezept suchen</strong></p>
                <p class="text-sm">Tipp: Je mehr Zutaten, desto passender das Rezept!</p>
            </div>
        </div>

        <!-- ===== FAVORITEN ===== -->
        <div id="favorites-container" class="hidden bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                    <i class="fa-regular fa-star text-yellow-500 mr-2"></i> Deine Favoriten
                </h3>
                <button onclick="clearFavorites()" class="text-xs text-rose-400 hover:text-rose-500 transition">Alle löschen</button>
            </div>
            <div id="favorites-list" class="flex flex-wrap gap-3"></div>
        </div>

        <!-- ===== FOOTER ===== -->
        <footer class="text-center text-slate-500 dark:text-slate-400 text-xs pt-6 border-t border-slate-200 dark:border-slate-800">
            &copy; <span id="year"></span> Quick Recipe – Daten von Spoonacular & TheMealDB
        </footer>
    </main>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 toast-leave transition-all duration-300 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 z-50 font-semibold text-sm">
        <i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-500"></i>
        <span id="toast-text">Geladen!</span>
    </div>

    <script>
        // ============================================================
        // 1. THEME
        // ============================================================
        const htmlRoot = document.documentElement;
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        function setTheme(mode) {
            if (mode === 'light') {
                htmlRoot.classList.remove('dark');
                htmlRoot.classList.add('light');
                localStorage.setItem('quickrecipe_theme', 'light');
                themeIcon.className = 'fa-solid fa-moon text-indigo-600 text-base';
                themeText.innerText = 'Dunkler Modus';
            } else {
                htmlRoot.classList.remove('light');
                htmlRoot.classList.add('dark');
                localStorage.setItem('quickrecipe_theme', 'dark');
                themeIcon.className = 'fa-solid fa-sun text-amber-500 text-base';
                themeText.innerText = 'Heller Modus';
            }
        }

        const savedTheme = localStorage.getItem('quickrecipe_theme') || 'dark';
        setTheme(savedTheme);

        function toggleTheme() {
            const isDark = htmlRoot.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        }

        // ============================================================
        // 2. TOAST
        // ============================================================
        let toastTimeout;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toastText.innerText = msg;
            toast.classList.remove('toast-leave');
            toast.classList.add('toast-enter');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-leave');
            }, 2500);
        }

        // ============================================================
        // 3. SERVINGS
        // ============================================================
        let currentServings = 2;
        const servingsDisplay = document.getElementById('servings-display');

        function changeServings(delta) {
            currentServings = Math.max(1, currentServings + delta);
            servingsDisplay.textContent = currentServings;
            const container = document.getElementById('result-content');
            if (container.dataset.recipe) {
                try {
                    const recipe = JSON.parse(container.dataset.recipe);
                    displayRecipe(recipe, currentServings);
                } catch (e) {}
            }
        }

        // ============================================================
        // 4. ZUTATEN-API (live von Spoonacular / TheMealDB)
        // ============================================================
        // Spoonacular API-Key (kostenlos von spoonacular.com)
        const SPOONACULAR_API_KEY = 'YOUR_API_KEY'; // <-- BITTE ERSETZEN

        // Liste der zuletzt verwendeten Zutaten für Autocomplete (wird aus API gefüllt)
        let ingredientCache = [];

        // Hole Zutaten-Vorschläge von Spoonacular (oder Fallback)
        async function fetchIngredientSuggestions(query) {
            if (query.length < 2) return [];
            const url = `https://api.spoonacular.com/food/ingredients/autocomplete?query=${encodeURIComponent(query)}&number=10&apiKey=${SPOONACULAR_API_KEY}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Spoonacular API nicht verfügbar');
                const data = await res.json();
                return data.map(item => item.name);
            } catch (e) {
                console.warn('Spoonacular fallback zu TheMealDB');
                // Fallback: einfache lokale Liste
                const fallback = ['Tomate', 'Zwiebel', 'Knoblauch', 'Karotte', 'Kartoffel', 'Hähnchen', 'Rindfleisch', 'Lachs', 'Ei', 'Milch', 'Mehl', 'Zucker', 'Salz', 'Pfeffer', 'Butter', 'Käse', 'Spaghetti', 'Reis'];
                return fallback.filter(f => f.toLowerCase().includes(query.toLowerCase()));
            }
        }

        // ============================================================
        // 5. AUTOCOMPLETE (live von API)
        // ============================================================
        const ingredientInput = document.getElementById('ingredient-input');
        const tagContainer = document.getElementById('ingredient-tags');
        const autocompleteContainer = document.getElementById('autocomplete-list');
        let ingredients = [];
        let autocompleteTimeout = null;

        ingredientInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearTimeout(autocompleteTimeout);
            if (query.length < 2) {
                autocompleteContainer.style.display = 'none';
                return;
            }
            autocompleteTimeout = setTimeout(async () => {
                const suggestions = await fetchIngredientSuggestions(query);
                if (suggestions.length > 0) {
                    autocompleteContainer.innerHTML = suggestions.map(s =>
                        `<div class="autocomplete-item" onclick="selectSuggestion('${s.replace(/'/g, "\\'")}')">${s}</div>`
                    ).join('');
                    autocompleteContainer.style.display = 'block';
                } else {
                    autocompleteContainer.style.display = 'none';
                }
            }, 200);
        });

        ingredientInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const first = autocompleteContainer.querySelector('.autocomplete-item');
                if (first) {
                    selectSuggestion(first.textContent);
                } else {
                    addIngredient();
                }
            }
            if (e.key === 'Escape') {
                autocompleteContainer.style.display = 'none';
            }
        });

        document.addEventListener('click', function(e) {
            if (!ingredientInput.contains(e.target) && !autocompleteContainer.contains(e.target)) {
                autocompleteContainer.style.display = 'none';
            }
        });

        function selectSuggestion(name) {
            ingredientInput.value = name;
            autocompleteContainer.style.display = 'none';
            addIngredient();
        }

        // ============================================================
        // 6. ZUTATEN HINZUFÜGEN
        // ============================================================
        function addIngredient() {
            const raw = ingredientInput.value.trim();
            if (!raw) {
                showToast('Bitte gib eine Zutat ein.');
                return;
            }
            // Normalisieren: erste Buchstabe groß
            const normalized = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
            if (!ingredients.includes(normalized)) {
                ingredients.push(normalized);
                renderTags();
                ingredientInput.value = '';
                autocompleteContainer.style.display = 'none';
                showToast(`${normalized} hinzugefügt`);
            } else {
                showToast(`${normalized} ist bereits in der Liste.`);
            }
        }

        function removeIngredient(index) {
            const removed = ingredients[index];
            ingredients.splice(index, 1);
            renderTags();
            showToast(`${removed} entfernt`);
        }

        function renderTags() {
            tagContainer.innerHTML = '';
            ingredients.forEach((ing, i) => {
                const tag = document.createElement('span');
                tag.className = 'ingredient-tag';
                tag.innerHTML = `${ing} <span class="remove-btn" onclick="removeIngredient(${i})"><i class="fa-regular fa-xmark"></i></span>`;
                tagContainer.appendChild(tag);
            });
        }

        // ============================================================
        // 7. REZEPT-SUCHE (mit Failover & Übersetzung)
        // ============================================================
        // Übersetzungsfunktion (vereinfacht – nutzt MyMemory API)
        async function translateText(text, targetLang = 'de') {
            if (!text) return text;
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`);
                if (!res.ok) throw new Error('Übersetzung fehlgeschlagen');
                const data = await res.json();
                return data.responseData.translatedText || text;
            } catch (e) {
                console.warn('Übersetzung nicht verfügbar');
                return text;
            }
        }

        // Zutaten in Englisch konvertieren (für Spoonacular)
        function toEnglishIngredient(german) {
            const map = {
                'hühnchen': 'chicken',
                'hähnchen': 'chicken',
                'rindfleisch': 'beef',
                'schweinefleisch': 'pork',
                'kartoffel': 'potato',
                'karotte': 'carrot',
                'zwiebel': 'onion',
                'knoblauch': 'garlic',
                'tomate': 'tomato',
                'paprika': 'bell pepper',
                'gurke': 'cucumber',
                'spinat': 'spinach',
                'brokkoli': 'broccoli',
                'blumenkohl': 'cauliflower',
                'pilze': 'mushrooms',
                'lachs': 'salmon',
                'thunfisch': 'tuna',
                'garnelen': 'shrimp',
                'ei': 'egg',
                'eier': 'eggs',
                'milch': 'milk',
                'sahne': 'cream',
                'butter': 'butter',
                'käse': 'cheese',
                'mozzarella': 'mozzarella',
                'pasta': 'pasta',
                'nudeln': 'pasta',
                'reis': 'rice',
                'brot': 'bread',
                'mehl': 'flour',
                'zucker': 'sugar',
                'salz': 'salt',
                'pfeffer': 'pepper',
                'olivenöl': 'olive oil',
                'sojasauce': 'soy sauce',
                'honig': 'honey',
                'senf': 'mustard',
                'zitrone': 'lemon',
                'orange': 'orange',
                'apfel': 'apple',
                'banane': 'banana',
                'erdbeere': 'strawberry',
                'avocado': 'avocado'
            };
            const lower = german.toLowerCase();
            return map[lower] || german;
        }

        // Rezept von Spoonacular holen (mit Fallback zu TheMealDB)
        async function fetchRecipeFromSpoonacular(ingredientsList) {
            if (!SPOONACULAR_API_KEY || SPOONACULAR_API_KEY === 'YOUR_API_KEY') return null;
            const engIngredients = ingredientsList.map(i => toEnglishIngredient(i)).join(',');
            const url = `https://api.spoonacular.com/recipes/findByIngredients?ingredients=${encodeURIComponent(engIngredients)}&number=1&apiKey=${SPOONACULAR_API_KEY}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Spoonacular nicht verfügbar');
                const data = await res.json();
                if (!data || data.length === 0) return null;
                const match = data[0];
                const detailRes = await fetch(`https://api.spoonacular.com/recipes/${match.id}/information?apiKey=${SPOONACULAR_API_KEY}`);
                if (!detailRes.ok) return null;
                const detail = await detailRes.json();
                return {
                    idMeal: match.id.toString(),
                    strMeal: detail.title,
                    strCategory: detail.dishTypes ? detail.dishTypes.join(', ') : '',
                    strArea: detail.cuisines ? detail.cuisines.join(', ') : '',
                    strMealThumb: detail.image,
                    strInstructions: detail.instructions || 'Keine Anleitung verfügbar.',
                    strSource: detail.sourceUrl || '',
                    strYoutube: '',
                    ingredients: detail.extendedIngredients ? detail.extendedIngredients.map(ing => ({
                        name: ing.name,
                        measure: `${ing.amount} ${ing.unit}`
                    })) : [],
                    source: 'Spoonacular'
                };
            } catch (e) {
                console.warn('Spoonacular Fehler:', e.message);
                return null;
            }
        }

        // Rezept von TheMealDB holen (Fallback)
        async function fetchRecipeFromTheMealDB(ingredientsList) {
            const mainIngredient = toEnglishIngredient(ingredientsList[0]);
            const url = `https://www.themealdb.com/api/json/v1/1/filter.php?i=${mainIngredient}`;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('TheMealDB nicht verfügbar');
                const data = await res.json();
                if (!data.meals || data.meals.length === 0) return null;
                const mealId = data.meals[0].idMeal;
                const detailRes = await fetch(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${mealId}`);
                const detailData = await detailRes.json();
                if (!detailData.meals || !detailData.meals[0]) return null;
                const meal = detailData.meals[0];
                const ingredientsList2 = [];
                for (let i = 1; i <= 20; i++) {
                    const ing = meal[`strIngredient${i}`];
                    const measure = meal[`strMeasure${i}`];
                    if (ing && ing.trim()) {
                        ingredientsList2.push({ name: ing.trim(), measure: measure ? measure.trim() : '' });
                    }
                }
                return {
                    idMeal: meal.idMeal,
                    strMeal: meal.strMeal,
                    strCategory: meal.strCategory || '',
                    strArea: meal.strArea || '',
                    strMealThumb: meal.strMealThumb,
                    strInstructions: meal.strInstructions || 'Keine Anleitung verfügbar.',
                    strSource: meal.strSource || '',
                    strYoutube: meal.strYoutube || '',
                    ingredients: ingredientsList2,
                    source: 'TheMealDB'
                };
            } catch (e) {
                console.warn('TheMealDB Fehler:', e.message);
                return null;
            }
        }

        // Hauptsuchfunktion mit Failover
        async function searchRecipes() {
            if (ingredients.length === 0) {
                showToast('Bitte füge mindestens eine Zutat hinzu!');
                return;
            }

            const container = document.getElementById('result-content');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-8">
                    <div class="loading-spinner"></div>
                    <p class="mt-4 text-sm text-slate-500 dark:text-slate-400 font-medium">Suche Rezepte mit ${ingredients.join(', ')}...</p>
                    <p class="text-xs text-slate-400 mt-1">Versuche Spoonacular & TheMealDB</p>
                </div>
            `;

            try {
                // 1. Versuche Spoonacular (mit Übersetzung)
                let recipe = await fetchRecipeFromSpoonacular(ingredients);
                let source = 'Spoonacular';

                // 2. Fallback zu TheMealDB
                if (!recipe) {
                    recipe = await fetchRecipeFromTheMealDB(ingredients);
                    source = 'TheMealDB (Fallback)';
                }

                if (!recipe) {
                    container.innerHTML = `
                        <div class="result-box text-center">
                            <i class="fa-regular fa-face-frown text-4xl text-slate-400 mb-3 block"></i>
                            <p class="text-slate-900 dark:text-white font-medium">Kein passendes Rezept gefunden</p>
                            <p class="text-sm text-slate-400">Versuche andere Zutaten oder weniger spezifische Begriffe.</p>
                        </div>
                    `;
                    return;
                }

                // 3. Übersetze das Rezept auf Deutsch (wenn nötig)
                const translateName = await translateText(recipe.strMeal);
                const translateInstructions = await translateText(recipe.strInstructions);
                const translatedIngredients = await Promise.all(recipe.ingredients.map(async (item) => {
                    const translatedName = await translateText(item.name);
                    return { name: translatedName, measure: item.measure };
                }));

                // Ersetze mit übersetzten Daten
                recipe.strMeal = translateName;
                recipe.strInstructions = translateInstructions;
                recipe.ingredients = translatedIngredients;
                recipe.translated = true;

                // 4. Anzeigen
                displayRecipe(recipe, currentServings);
                showToast(`Rezept von ${source} gefunden und übersetzt!`);

            } catch (error) {
                container.innerHTML = `
                    <div class="result-box text-center">
                        <i class="fa-regular fa-circle-exclamation text-4xl text-rose-400 mb-3 block"></i>
                        <p class="text-rose-500 font-medium">Fehler beim Laden: ${error.message}</p>
                        <p class="text-sm text-slate-400">Bitte versuche es später noch einmal.</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // 8. REZEPT ANZEIGEN (mit Übersetzungs-Badge)
        // ============================================================
        function displayRecipe(recipe, servings) {
            const container = document.getElementById('result-content');

            let ingredientsList = recipe.ingredients || [];

            // Skalierung
            const baseServings = recipe.servings || 4;
            const scaleFactor = servings / baseServings;

            const scaledIngredients = ingredientsList.map(item => {
                let scaledMeasure = item.measure || '';
                const match = item.measure.match(/^([\d.]+)\s*(.*)$/);
                if (match) {
                    const num = parseFloat(match[1]);
                    if (!isNaN(num)) {
                        const scaled = (num * scaleFactor);
                        const unit = match[2] || '';
                        scaledMeasure = (Number.isInteger(scaled) ? scaled : scaled.toFixed(1)) + ' ' + unit;
                    }
                }
                return { name: item.name, measure: scaledMeasure };
            });

            const favorites = JSON.parse(localStorage.getItem('quickrecipe_favorites') || '[]');
            const isFavorite = favorites.some(f => f.idMeal === recipe.idMeal);

            container.innerHTML = `
                <div class="result-box" data-recipe='${JSON.stringify(recipe)}'>
                    <div class="flex flex-wrap justify-between items-start gap-3">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h2 class="text-2xl font-black text-slate-900 dark:text-white">${recipe.strMeal}</h2>
                                ${recipe.translated ? `<span class="translation-badge"><i class="fa-regular fa-language"></i> Übersetzt</span>` : ''}
                            </div>
                            ${recipe.strCategory ? `<span class="text-xs bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded-full">${recipe.strCategory}</span>` : ''}
                            ${recipe.strArea ? `<span class="text-xs bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded-full ml-1">${recipe.strArea}</span>` : ''}
                            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full ml-1">${servings} Portionen</span>
                            <span class="text-xs bg-slate-500/10 text-slate-400 px-2 py-0.5 rounded-full ml-1">${recipe.source || 'API'}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="toggleFavorite('${recipe.idMeal}')" class="favorite-btn ${isFavorite ? 'active' : ''} text-xl text-slate-400 hover:text-yellow-500 transition" title="Favorit">
                                <i class="fa-${isFavorite ? 'solid' : 'regular'} fa-star"></i>
                            </button>
                            <button onclick="shareRecipe('${recipe.idMeal}')" class="share-btn text-xl text-slate-400 hover:text-cyan-500 transition" title="Teilen">
                                <i class="fa-regular fa-share-nodes"></i>
                            </button>
                        </div>
                    </div>

                    ${recipe.strMealThumb ? `<img src="${recipe.strMealThumb}" class="w-full max-w-sm rounded-xl my-3 border border-slate-300 dark:border-slate-700" alt="${recipe.strMeal}">` : ''}

                    <div class="grid md:grid-cols-2 gap-4 mt-3">
                        <div>
                            <p class="text-sm font-bold text-slate-600 dark:text-slate-300">Zutaten (skaliert):</p>
                            <ul class="text-sm text-slate-600 dark:text-slate-300 space-y-1 mt-1">
                                ${scaledIngredients.map(item =>
                                    `<li>• ${item.measure} ${item.name}</li>`
                                ).join('')}
                            </ul>
                        </div>
                        ${recipe.strInstructions ? `
                        <div>
                            <p class="text-sm font-bold text-slate-600 dark:text-slate-300">Zubereitung:</p>
                            <p class="text-sm text-slate-600 dark:text-slate-300 max-h-48 overflow-y-auto custom-scrollbar mt-1">${recipe.strInstructions}</p>
                        </div>` : ''}
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-700 flex flex-wrap gap-2">
                        ${recipe.strYoutube ? `<a href="${recipe.strYoutube}" target="_blank" class="text-xs text-rose-400 hover:text-rose-500 transition"><i class="fa-brands fa-youtube mr-1"></i> Video ansehen</a>` : ''}
                        ${recipe.strSource ? `<a href="${recipe.strSource}" target="_blank" class="text-xs text-cyan-400 hover:text-cyan-500 transition"><i class="fa-regular fa-link mr-1"></i> Original-Rezept</a>` : ''}
                        ${recipe.translated ? `<span class="text-xs text-emerald-400"><i class="fa-regular fa-check-circle"></i> Übersetzung aktiv</span>` : ''}
                    </div>
                    <p class="text-xs text-slate-400 mt-3">Daten von ${recipe.source || 'verschiedenen APIs'}</p>
                </div>
            `;

            container.dataset.recipe = JSON.stringify(recipe);
            updateFavoritesUI();
        }

        // ============================================================
        // 9. FAVORITEN & SHARING (wie gehabt)
        // ============================================================
        function getFavorites() {
            return JSON.parse(localStorage.getItem('quickrecipe_favorites') || '[]');
        }

        function saveFavorites(favorites) {
            localStorage.setItem('quickrecipe_favorites', JSON.stringify(favorites));
            updateFavoritesUI();
        }

        function toggleFavorite(mealId) {
            let favorites = getFavorites();
            const index = favorites.findIndex(f => f.idMeal === mealId);
            if (index >= 0) {
                favorites.splice(index, 1);
                showToast('Aus Favoriten entfernt');
                saveFavorites(favorites);
                const container = document.getElementById('result-content');
                const recipeData = container.dataset.recipe;
                if (recipeData) {
                    try {
                        const data = JSON.parse(recipeData);
                        if (data.idMeal === mealId) {
                            displayRecipe(data, currentServings);
                        }
                    } catch (e) {}
                }
                return;
            }
            // Rezept aus aktueller Anzeige speichern
            const container = document.getElementById('result-content');
            const recipeData = container.dataset.recipe;
            if (recipeData) {
                try {
                    const data = JSON.parse(recipeData);
                    if (data.idMeal === mealId) {
                        const favorite = {
                            idMeal: data.idMeal,
                            strMeal: data.strMeal,
                            strMealThumb: data.strMealThumb,
                            strCategory: data.strCategory,
                            strArea: data.strArea
                        };
                        favorites.push(favorite);
                        saveFavorites(favorites);
                        showToast('Zu Favoriten hinzugefügt!');
                        displayRecipe(data, currentServings);
                    }
                } catch (e) {}
            }
        }

        function updateFavoritesUI() {
            const favorites = getFavorites();
            const container = document.getElementById('favorites-container');
            const list = document.getElementById('favorites-list');

            if (favorites.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            list.innerHTML = favorites.map(meal => `
                <div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-800 p-2 rounded-xl border border-slate-200 dark:border-slate-700">
                    ${meal.strMealThumb ? `<img src="${meal.strMealThumb}" class="w-10 h-10 rounded-lg object-cover" alt="${meal.strMeal}">` : `<div class="w-10 h-10 rounded-lg bg-slate-200 dark:bg-slate-700 flex items-center justify-center"><i class="fa-regular fa-utensils text-slate-400"></i></div>`}
                    <span class="text-sm font-medium text-slate-900 dark:text-white truncate max-w-[150px]">${meal.strMeal}</span>
                    <button onclick="loadFavorite('${meal.idMeal}')" class="text-cyan-500 hover:text-cyan-400 transition text-xs px-2 py-1 rounded-lg bg-cyan-500/10 hover:bg-cyan-500/20">Anzeigen</button>
                    <button onclick="toggleFavorite('${meal.idMeal}')" class="text-rose-400 hover:text-rose-500 transition text-xs">✕</button>
                </div>
            `).join('');
        }

        function loadFavorite(mealId) {
            // Versuche aus Favoriten zu laden, dann API
            const favorites = getFavorites();
            const fav = favorites.find(f => f.idMeal === mealId);
            if (fav) {
                // Rezept neu von API holen (für volle Daten)
                fetchRecipeFromSpoonacular([fav.strMeal.split(' ')[0]]) // Not perfect but works
                    .then(recipe => {
                        if (recipe) {
                            displayRecipe(recipe, currentServings);
                            showToast('Rezept geladen!');
                        }
                    })
                    .catch(() => {
                        // Fallback: Favoritendaten anzeigen
                        displayRecipe({
                            idMeal: fav.idMeal,
                            strMeal: fav.strMeal,
                            strMealThumb: fav.strMealThumb,
                            strCategory: fav.strCategory || '',
                            strArea: fav.strArea || '',
                            strInstructions: 'Rezeptdetails nicht verfügbar.',
                            ingredients: [],
                            source: 'Favorit (Cache)'
                        }, currentServings);
                    });
            }
        }

        function clearFavorites() {
            if (confirm('Alle Favoriten löschen?')) {
                localStorage.removeItem('quickrecipe_favorites');
                updateFavoritesUI();
                showToast('Favoriten gelöscht');
            }
        }

        // ============================================================
        // 10. SHARING
        // ============================================================
        function shareRecipe(mealId) {
            const container = document.getElementById('result-content');
            const recipeData = container.dataset.recipe;
            if (!recipeData) {
                showToast('Kein Rezept zum Teilen');
                return;
            }
            try {
                const meal = JSON.parse(recipeData);
                let ingredients = '';
                (meal.ingredients || []).forEach(item => {
                    ingredients += `• ${item.measure || ''} ${item.name}\n`;
                });
                const text = `🍳 *${meal.strMeal}*\n\n*Zutaten:*\n${ingredients}\n*Zubereitung:*\n${meal.strInstructions ? meal.strInstructions.substring(0, 400) + '...' : ''}\n\n${meal.strSource ? '🔗 ' + meal.strSource : ''}`;

                if (navigator.share) {
                    navigator.share({ title: meal.strMeal, text: text }).catch(() => {});
                } else {
                    // WhatsApp, Telegram, Signal, Kopieren
                    const shareOptions = [
                        { name: 'WhatsApp', url: `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}` },
                        { name: 'Telegram', url: `https://t.me/share/url?url=&text=${encodeURIComponent(text)}` },
                        { name: 'Signal', url: `https://signal.me/#/?text=${encodeURIComponent(text)}` },
                        { name: 'Kopieren', action: () => { navigator.clipboard.writeText(text).then(() => showToast('Rezept kopiert!')); } }
                    ];
                    let html = `
                        <div class="result-box text-center">
                            <p class="font-medium text-slate-900 dark:text-white mb-3">Rezept teilen:</p>
                            <div class="flex flex-wrap justify-center gap-2">
                    `;
                    shareOptions.forEach(opt => {
                        if (opt.url) {
                            html += `<a href="${opt.url}" target="_blank" class="px-4 py-2 rounded-xl bg-cyan-500/10 text-cyan-500 hover:bg-cyan-500/20 transition font-medium text-sm btn-hover">${opt.name}</a>`;
                        } else {
                            html += `<button onclick="(${opt.action.toString()})()" class="px-4 py-2 rounded-xl bg-cyan-500/10 text-cyan-500 hover:bg-cyan-500/20 transition font-medium text-sm btn-hover">${opt.name}</button>`;
                        }
                    });
                    html += `</div></div>`;
                    container.innerHTML = html;
                    setTimeout(() => {
                        if (container.dataset.recipe) {
                            try {
                                const data = JSON.parse(container.dataset.recipe);
                                displayRecipe(data, currentServings);
                            } catch (e) {}
                        }
                    }, 10000);
                }
            } catch (e) {
                showToast('Fehler beim Teilen');
            }
        }

        // ============================================================
        // 11. COPYRIGHT & INIT
        // ============================================================
        document.getElementById('year').textContent = new Date().getFullYear();
        updateFavoritesUI();

        console.log('🍳 Quick Recipe gestartet mit Live-APIs (Spoonacular + TheMealDB)');
    </script>
</body>
</html>
