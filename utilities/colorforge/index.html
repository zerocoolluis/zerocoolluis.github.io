<!DOCTYPE html>
<html lang="de" class="dark" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorForge</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }
        .toast-enter { transform: translateY(0); opacity: 1; }
        .toast-leave { transform: translateY(150%); opacity: 0; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen p-4 md:p-8 transition-colors duration-200 font-sans relative overflow-x-hidden">

    <main class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-300 dark:border-slate-800">
            <div class="flex items-center gap-4">
                <!-- Zurück zu Utilities Button -->
                <a href="utilities.html" class="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-700 transition font-bold text-xs shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Utilities</span>
                </a>

                <div>
                    <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">
                        ColorForge
                    </h1>
                    <p id="db-status" class="text-xs text-slate-600 dark:text-slate-400 mt-1 font-medium">
                        <i class="fa-solid fa-spinner fa-spin text-cyan-500"></i> Lade Farbdatenbanken...
                    </p>
                </div>
            </div>
            
            <!-- Theme Toggle -->
            <button onclick="toggleTheme()" id="theme-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-800 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 transition shadow-sm font-semibold text-xs">
                <i id="theme-icon" class="fa-solid fa-sun text-amber-500 text-base"></i>
                <span id="theme-text">Heller Modus</span>
            </button>
        </header>

        <!-- Live-Suchleiste mit Dropdown -->
        <div class="relative">
            <div class="relative">
                <input type="text" id="color-search" 
                       placeholder="Farbe suchen und Enter drücken (z.B. emerald, neongelb, RAL 1023)..." 
                       autocomplete="off"
                       class="w-full pl-12 pr-4 py-4 rounded-2xl bg-white dark:bg-slate-900 text-slate-900 dark:text-white border-2 border-slate-300 dark:border-slate-800 focus:border-cyan-500 dark:focus:border-cyan-400 outline-none text-base shadow-lg transition placeholder-slate-400 dark:placeholder-slate-500 font-medium">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-5 text-slate-400 dark:text-slate-500 text-lg"></i>
            </div>
            
            <!-- Suchergebnisse Dropdown -->
            <div id="search-results" class="hidden absolute left-0 right-0 top-16 mt-2 max-h-64 overflow-y-auto bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-2xl shadow-2xl z-50 custom-scrollbar divide-y divide-slate-100 dark:divide-slate-800">
            </div>
        </div>

        <!-- Hauptbereich Grid -->
        <div class="grid md:grid-cols-2 gap-6">
            
            <!-- Linke Karte: Farbauswahl, Kamera & Name -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800 flex flex-col justify-between relative group">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider block">Interaktiver Picker & Kamera</label>
                        
                        <!-- Kamera Button -->
                        <button onclick="openCamera()" class="flex items-center gap-1.5 px-3 py-1 rounded-xl bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 hover:bg-cyan-500/20 font-bold text-xs transition">
                            <i class="fa-solid fa-camera"></i> Kamera Scanner
                        </button>
                    </div>

                    <input type="color" id="picker" class="w-full h-32 rounded-2xl cursor-pointer border-0 bg-transparent">
                </div>
                
                <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800">
                    <h2 id="color-name-display" class="text-2xl font-black text-cyan-600 dark:text-cyan-400 tracking-wide truncate">--</h2>
                    <p id="color-cat-display" class="text-xs text-slate-500 dark:text-slate-400 font-semibold mt-0.5">Kategorie / Quelle</p>
                    
                    <!-- HEX Code Copy Area -->
                    <div class="mt-2 inline-flex items-center gap-2 cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 p-1.5 -ml-1.5 rounded-lg transition" onclick="copyText('hex-display', 'HEX Code', this.querySelector('.copy-icon'))">
                        <p id="hex-display" class="font-mono text-slate-900 dark:text-slate-100 font-bold text-base">#000000</p>
                        <i class="copy-icon fa-regular fa-copy text-slate-400 group-hover:text-cyan-500 transition"></i>
                    </div>
                </div>
            </div>

            <!-- Rechte Karte: Online API Metadaten -->
            <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800 flex flex-col justify-between">
                <div>
                    <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3 block">Live Online API Werte (Klick zum Kopieren)</label>
                    <div class="space-y-3 text-xs font-medium">
                        <!-- RGB -->
                        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 p-1 rounded transition group" onclick="copyText('rgb-val', 'RGB Code', this.querySelector('.copy-icon'))">
                            <span class="text-slate-500 dark:text-slate-400 font-bold">RGB:</span>
                            <div class="flex items-center gap-2">
                                <span id="rgb-val" class="font-mono font-bold text-slate-900 dark:text-slate-100">--</span>
                                <i class="copy-icon fa-regular fa-copy text-slate-400 group-hover:text-cyan-500 transition"></i>
                            </div>
                        </div>
                        <!-- CMYK -->
                        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 p-1 rounded transition group" onclick="copyText('cmyk-val', 'CMYK Code', this.querySelector('.copy-icon'))">
                            <span class="text-slate-500 dark:text-slate-400 font-bold">CMYK:</span>
                            <div class="flex items-center gap-2">
                                <span id="cmyk-val" class="font-mono font-bold text-slate-900 dark:text-slate-100">--</span>
                                <i class="copy-icon fa-regular fa-copy text-slate-400 group-hover:text-cyan-500 transition"></i>
                            </div>
                        </div>
                        <!-- HSL -->
                        <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 p-1 rounded transition group" onclick="copyText('hsl-val', 'HSL Code', this.querySelector('.copy-icon'))">
                            <span class="text-slate-500 dark:text-slate-400 font-bold">HSL:</span>
                            <div class="flex items-center gap-2">
                                <span id="hsl-val" class="font-mono font-bold text-slate-900 dark:text-slate-100">--</span>
                                <i class="copy-icon fa-regular fa-copy text-slate-400 group-hover:text-cyan-500 transition"></i>
                            </div>
                        </div>
                        <!-- Web Name -->
                        <div class="flex justify-between items-center p-1">
                            <span class="text-slate-500 dark:text-slate-400 font-bold">Wissenschaftlicher Name:</span>
                            <span id="web-name-val" class="font-bold text-cyan-600 dark:text-cyan-400">--</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Verlauf & Historie -->
        <div class="bg-white dark:bg-slate-900 p-6 rounded-3xl shadow-md border border-slate-200 dark:border-slate-800 space-y-5">
            <!-- Farbverlauf mit Regler -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider block">Farbverlauf & Helligkeits-Regler</label>
                    <span id="slider-val-label" class="text-xs font-mono font-bold text-cyan-600 dark:text-cyan-400">50% (Original)</span>
                </div>
                <div id="active-gradient" class="h-12 rounded-2xl shadow-inner border border-slate-300 dark:border-slate-700 transition-all duration-300 mb-3"></div>
                <input type="range" id="gradient-slider" min="0" max="100" value="50" 
                       class="w-full accent-cyan-500 cursor-pointer h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none">
            </div>

            <!-- Historie (Zuletzt verwendet) -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <label class="text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider block">Zuletzt verwendet</label>
                    <button onclick="clearHistory()" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition font-medium">Zurücksetzen</button>
                </div>
                <div id="history-container" class="flex gap-3 flex-wrap"></div>
            </div>
        </div>

    </main>

    <!-- KAMERA MODAL OVERLAY -->
    <div id="camera-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl flex flex-col items-center space-y-4 relative">
            <button onclick="closeCamera()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-lg font-black text-slate-900 dark:text-white">Kamera Farbscanner</h3>
            <p class="text-xs text-slate-400 text-center">Richte das Fadenkreuz in der Mitte auf den Gegenstand.</p>

            <!-- Live Video Container mit Visier -->
            <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-black border border-slate-700 flex items-center justify-center">
                <video id="webcam-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="cam-canvas" class="hidden"></canvas>
                
                <!-- Fadenkreuz Visier -->
                <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                    <div class="w-10 h-10 border-2 border-white rounded-full flex items-center justify-center shadow-lg">
                        <div class="w-2 h-2 bg-cyan-400 rounded-full"></div>
                    </div>
                </div>
            </div>

            <!-- Live Farb-Vorschau -->
            <div class="flex items-center gap-3 w-full bg-slate-100 dark:bg-slate-800 p-3 rounded-xl">
                <div id="cam-preview-dot" class="w-8 h-8 rounded-lg border border-slate-300 dark:border-slate-600 shadow-sm" style="background-color: #000000;"></div>
                <div class="flex-1">
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Erfasster Wert</p>
                    <p id="cam-preview-hex" class="font-mono font-bold text-sm text-slate-900 dark:text-white">#000000</p>
                </div>
            </div>

            <!-- Steuerungs-Buttons -->
            <div class="flex gap-3 w-full">
                <button onclick="closeCamera()" class="flex-1 py-3 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold text-xs hover:bg-slate-300 transition">
                    Abbrechen
                </button>
                <button onclick="captureCameraColor()" class="flex-1 py-3 rounded-xl bg-cyan-500 text-white font-bold text-xs hover:bg-cyan-600 transition shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-check mr-1"></i> Fertig & Übernehmen
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 toast-leave transition-all duration-300 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 z-50 font-semibold text-sm">
        <i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-500"></i>
        <span id="toast-text">Kopiert!</span>
    </div>

    <!-- JavaScript Logik -->
    <script>
        let globalColorCatalog = [];
        let baseColorHex = '#06B6D4';
        let mediaStream = null;
        let animationFrameId = null;
        let currentCamHex = "#000000";

        const htmlRoot = document.documentElement;
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const searchInput = document.getElementById('color-search');
        const searchResults = document.getElementById('search-results');
        const picker = document.getElementById('picker');
        const hexDisplay = document.getElementById('hex-display');
        const nameDisplay = document.getElementById('color-name-display');
        const catDisplay = document.getElementById('color-cat-display');
        const activeGradient = document.getElementById('active-gradient');
        const gradientSlider = document.getElementById('gradient-slider');
        const sliderLabel = document.getElementById('slider-val-label');
        const histContainer = document.getElementById('history-container');
        const dbStatus = document.getElementById('db-status');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toast-text');

        // Theme Switcher
        function toggleTheme() {
            if (htmlRoot.classList.contains('dark')) {
                htmlRoot.classList.remove('dark');
                localStorage.setItem('colorforge_theme', 'light');
                themeIcon.className = "fa-solid fa-moon text-indigo-600 text-base";
                themeText.innerText = "Dunkler Modus";
            } else {
                htmlRoot.classList.add('dark');
                localStorage.setItem('colorforge_theme', 'dark');
                themeIcon.className = "fa-solid fa-sun text-amber-500 text-base";
                themeText.innerText = "Heller Modus";
            }
        }

        if (localStorage.getItem('colorforge_theme') === 'light') {
            htmlRoot.classList.remove('dark');
            themeIcon.className = "fa-solid fa-moon text-indigo-600 text-base";
            themeText.innerText = "Dunkler Modus";
        }

        // Hilfsfunktionen Farbberechnung
        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            let num = parseInt(hex, 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        function interpolateColor(color1, color2, factor) {
            let c1 = hexToRgb(color1);
            let c2 = hexToRgb(color2);
            let r = Math.round(c1.r + factor * (c2.r - c1.r));
            let g = Math.round(c1.g + factor * (c2.g - c1.g));
            let b = Math.round(c1.b + factor * (c2.b - c1.b));
            return rgbToHex(r, g, b);
        }

        function getGradientColor(val) {
            if (val == 50) return baseColorHex;
            if (val < 50) {
                return interpolateColor("#FFFFFF", baseColorHex, val / 50);
            } else {
                return interpolateColor(baseColorHex, "#000000", (val - 50) / 50);
            }
        }

        // KAMERA SCANNER LOGIK (OPTIMIERT)
        async function openCamera() {
            const modal = document.getElementById('camera-modal');
            const video = document.getElementById('webcam-video');
            modal.classList.remove('hidden');

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = mediaStream;
                video.onloadedmetadata = () => {
                    video.play();
                    scanLoop();
                };
            } catch (err) {
                alert("Kamera-Zugriff nicht möglich oder verweigert.");
                closeCamera();
            }
        }

        function scanLoop() {
            scanCenterPixel();
            animationFrameId = requestAnimationFrame(scanLoop);
        }

        function scanCenterPixel() {
            const video = document.getElementById('webcam-video');
            const canvas = document.getElementById('cam-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            if (video.videoWidth === 0 || video.videoHeight === 0) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const centerX = Math.floor(canvas.width / 2);
            const centerY = Math.floor(canvas.height / 2);
            const pixel = ctx.getImageData(centerX, centerY, 1, 1).data;

            currentCamHex = rgbToHex(pixel[0], pixel[1], pixel[2]);

            document.getElementById('cam-preview-dot').style.backgroundColor = currentCamHex;
            document.getElementById('cam-preview-hex').innerText = currentCamHex;
        }

        function captureCameraColor() {
            const match = globalColorCatalog.find(c => c.hex.toUpperCase() === currentCamHex.toUpperCase());
            const matchedName = match ? match.name : "";
            const matchedCat = match ? match.cat : "Kamera Erfassung";

            updateColor(currentCamHex, matchedName, matchedCat);
            closeCamera();
        }

        function closeCamera() {
            const modal = document.getElementById('camera-modal');
            modal.classList.add('hidden');

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        // Datenbanken Laden & Mergen
        async function loadAllDatabases() {
            const germanDict = [
                { name: "Emerald", search: "emerald", hex: "#50C878", cat: "Deutsch / International" },
                { name: "Neongelb", search: "neongelb", hex: "#EFFF00", cat: "Deutsch / Neon" },
                { name: "Neongrün", search: "neongrün", hex: "#39FF14", cat: "Deutsch / Neon" },
                { name: "Neonrot", search: "neonrot", hex: "#FF3131", cat: "Deutsch / Neon" },
                { name: "Neonpink", search: "neonpink", hex: "#FF10F0", cat: "Deutsch / Neon" },
                { name: "Himmelblau", search: "himmelblau", hex: "#87CEEB", cat: "Deutsch" },
                { name: "Feuerrot", search: "feuerrot", hex: "#AF2B1E", cat: "Deutsch / RAL" },
                { name: "Smaragdgrün", search: "smaragdgrün", hex: "#50C878", cat: "Deutsch" },
                { name: "Weinrot", search: "weinrot", hex: "#722F37", cat: "Deutsch" },
                { name: "Mintgrün", search: "mintgrün", hex: "#98FF98", cat: "Deutsch" }
            ];

            germanDict.forEach(item => globalColorCatalog.push(item));

            try {
                const ralRes = await fetch('https://raw.githubusercontent.com/Korchy/blender-color-matching/master/ral_c.json');
                const ralData = await ralRes.json();
                ralData.forEach(item => {
                    const info = item[1];
                    globalColorCatalog.push({ name: info[0], search: info[0].toLowerCase(), hex: info[3], cat: "RAL Classic" });
                });
            } catch (e) {}

            try {
                const hugeRes = await fetch('https://unpkg.com/color-name-list/dist/colornames.json');
                const hugeData = await hugeRes.json();
                hugeData.forEach(item => {
                    globalColorCatalog.push({ name: item.name, search: item.name.toLowerCase(), hex: item.hex, cat: "Global English" });
                });
            } catch (e) {}

            dbStatus.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i> ${globalColorCatalog.length.toLocaleString()} Farben durchsuchbar`;
        }

        // Sortierung für exakte Treffer
        function getSortedMatches(query) {
            const matches = globalColorCatalog.filter(c => 
                c.search.includes(query) || c.hex.toLowerCase().includes(query)
            );

            return matches.sort((a, b) => {
                const aSearch = a.search;
                const bSearch = b.search;

                if (aSearch === query && bSearch !== query) return -1;
                if (bSearch === query && aSearch !== query) return 1;

                const aStarts = aSearch.startsWith(query);
                const bStarts = bSearch.startsWith(query);
                if (aStarts && !bStarts) return -1;
                if (!aStarts && bStarts) return 1;

                return aSearch.length - bSearch.length;
            });
        }

        // Farbwert Update & API
        async function updateColor(hex, customName = "", customCat = "", save = true, isBaseUpdate = true) {
            hex = hex.toUpperCase();

            if (isBaseUpdate) {
                baseColorHex = hex;
                if (gradientSlider) gradientSlider.value = 50;
                if (sliderLabel) sliderLabel.innerText = "50% (Original)";
            }

            document.querySelectorAll('.copy-icon').forEach(icon => {
                icon.className = "copy-icon fa-regular fa-copy text-slate-400 group-hover:text-cyan-500 transition";
            });

            hexDisplay.innerText = hex;
            picker.value = hex;

            activeGradient.style.background = `linear-gradient(90deg, #FFFFFF 0%, ${baseColorHex} 50%, #000000 100%)`;

            if (customName) {
                nameDisplay.innerText = customName;
                catDisplay.innerText = customCat || "Katalog Treffer";
            }

            try {
                const res = await fetch(`https://www.thecolorapi.com/id?hex=${hex.replace('#', '')}`);
                const data = await res.json();
                
                if (!customName) {
                    nameDisplay.innerText = data.name.value;
                    catDisplay.innerText = "Online API Namenszuweisung";
                }

                document.getElementById('rgb-val').innerText = data.rgb.value;
                document.getElementById('cmyk-val').innerText = data.cmyk.value;
                document.getElementById('hsl-val').innerText = data.hsl.value;
                document.getElementById('web-name-val').innerText = data.name.value;
            } catch (err) {
                if(!customName) nameDisplay.innerText = "Farbe ausgewählt";
            }

            if (save) saveHistory(hex);
        }

        // Regler für Farbverlauf Listener
        gradientSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            if (val < 50) {
                sliderLabel.innerText = `${val * 2}% (Heller)`;
            } else if (val > 50) {
                sliderLabel.innerText = `${(100 - val) * 2}% (Dunkler)`;
            } else {
                sliderLabel.innerText = "50% (Original)";
            }
            const newHex = getGradientColor(val);
            updateColor(newHex, "", "Nuance / Farbverlauf", false, false);
        });

        // Live Suche + Smarte ENTER Funktion
        searchInput.addEventListener('input', handleSearch);
        
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const query = e.target.value.toLowerCase().trim();
                
                if (query.startsWith('#') && (query.length === 4 || query.length === 7)) {
                    updateColor(query);
                    searchResults.classList.add('hidden');
                    return;
                }

                const sortedMatches = getSortedMatches(query);

                if (sortedMatches.length > 0) {
                    const topMatch = sortedMatches[0];
                    updateColor(topMatch.hex, topMatch.name, topMatch.cat);
                    searchResults.classList.add('hidden');
                    searchInput.value = `${topMatch.name} (${topMatch.hex})`;
                    searchInput.blur();
                }
            }
        });

        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            searchResults.innerHTML = '';

            if (query.length < 1) {
                searchResults.classList.add('hidden');
                return;
            }

            const sortedMatches = getSortedMatches(query).slice(0, 20);

            if (sortedMatches.length > 0) {
                searchResults.classList.remove('hidden');
                sortedMatches.forEach(color => {
                    const item = document.createElement('div');
                    item.className = "flex items-center gap-3 p-3 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer transition text-slate-900 dark:text-white";
                    item.innerHTML = `
                        <div class="w-6 h-6 rounded-lg border border-slate-300 dark:border-slate-700 flex-shrink-0" style="background-color: ${color.hex}"></div>
                        <div class="flex-1 text-xs">
                            <span class="font-bold">${color.name}</span>
                            <span class="text-[10px] text-slate-400 ml-2">(${color.cat})</span>
                        </div>
                        <span class="font-mono text-xs text-slate-400 font-bold">${color.hex}</span>
                    `;
                    item.onclick = () => {
                        updateColor(color.hex, color.name, color.cat);
                        searchResults.classList.add('hidden');
                        searchInput.value = `${color.name} (${color.hex})`;
                    };
                    searchResults.appendChild(item);
                });
            } else if (query.startsWith('#') && (query.length === 4 || query.length === 7)) {
                searchResults.classList.add('hidden');
            }
        }

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        picker.addEventListener('input', (e) => updateColor(e.target.value));

        // Copy to Clipboard
        function copyText(elementId, label, iconElement) {
            const textToCopy = document.getElementById(elementId).innerText;
            if(textToCopy === '--') return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast(`${label} kopiert: ${textToCopy}`);
                
                if (iconElement) {
                    iconElement.className = "copy-icon fa-solid fa-check text-emerald-500 font-bold transition scale-110";
                }
            }).catch(err => {
                console.error("Fehler beim Kopieren: ", err);
            });
        }

        let toastTimeout;
        function showToast(message) {
            toastText.innerText = message;
            toast.classList.remove('toast-leave');
            toast.classList.add('toast-enter');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-leave');
            }, 2500);
        }

        // History Management
        function saveHistory(hex) {
            let hist = JSON.parse(localStorage.getItem('colorforge_hist') || '[]');
            if (!hist.includes(hex)) {
                hist.unshift(hex);
                localStorage.setItem('colorforge_hist', JSON.stringify(hist.slice(0, 12)));
                renderHistory();
            }
        }

        function renderHistory() {
            histContainer.innerHTML = '';
            const hist = JSON.parse(localStorage.getItem('colorforge_hist') || '[]');
            hist.forEach(hex => {
                const div = document.createElement('div');
                div.className = "w-10 h-10 rounded-xl cursor-pointer hover:scale-110 transition shadow-sm border border-slate-300 dark:border-slate-700 flex-shrink-0";
                div.style.backgroundColor = hex;
                div.title = hex;
                div.onclick = () => updateColor(hex, "", "", false);
                histContainer.appendChild(div);
            });
        }

        function clearHistory() {
            localStorage.removeItem('colorforge_hist');
            renderHistory();
        }

        // App Start
        loadAllDatabases();
        renderHistory();
        updateColor('#06B6D4', 'Cyan Web', 'Standard');
    </script>
</body>
</html>
