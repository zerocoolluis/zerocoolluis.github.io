<!DOCTYPE html>
<html lang="de" class="dark" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorForge - Online RAL System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen p-4 md:p-8 transition-colors duration-300">

    <main class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center pb-6 border-b border-gray-300 dark:border-gray-800">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight">ColorForge <span class="text-cyan-500">RAL Online</span></h1>
                <p class="text-xs text-gray-500" id="status-label"><i class="fa-solid fa-spinner fa-spin"></i> Lade globales RAL-Farbsystem...</p>
            </div>
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl bg-gray-200 dark:bg-gray-800 flex items-center justify-center text-lg hover:scale-105 transition">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- Dynamic Search Input with Autocomplete -->
        <div class="relative">
            <div class="relative">
                <input type="text" id="color-search" placeholder="Suche RAL-Farbe auf DE/EN (z.B. Zinkgelb, Signal red, RAL 5002, #ff0000)..." 
                       autocomplete="off"
                       class="w-full pl-12 pr-4 py-4 rounded-2xl bg-white dark:bg-gray-900 border-2 border-gray-200 dark:border-gray-800 focus:border-cyan-500 outline-none text-lg shadow-lg">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-5 text-gray-400"></i>
            </div>
            
            <!-- Dynamic Auto-Complete Search Results Container -->
            <div id="search-results" class="hidden absolute left-0 right-0 top-16 mt-2 max-h-60 overflow-y-auto bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl shadow-2xl z-50 custom-scrollbar">
            </div>
        </div>

        <!-- Main Display -->
        <div class="grid md:grid-cols-2 gap-6">
            <!-- Left Box: Picker & Current Color Info -->
            <div class="bg-white dark:bg-gray-900 p-6 rounded-3xl shadow-xl border border-gray-200 dark:border-gray-800 flex flex-col justify-between">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 block">Farbauswahl / Vorschau</label>
                    <input type="color" id="picker" class="w-full h-32 rounded-xl cursor-pointer border-0 bg-transparent">
                </div>
                <div class="mt-4">
                    <h2 id="color-name-display" class="text-2xl font-bold tracking-wide text-cyan-600 dark:text-cyan-400">--</h2>
                    <p id="color-subname-display" class="text-sm text-gray-500 font-medium">RAL / API Match</p>
                    <p id="hex-display" class="font-mono text-gray-400 text-base mt-1">#000000</p>
                </div>
            </div>

            <!-- Right Box: Online API Data -->
            <div class="bg-white dark:bg-gray-900 p-6 rounded-3xl shadow-xl border border-gray-200 dark:border-gray-800 flex flex-col justify-between">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 block">Farbinformationen (Online API)</label>
                    <div id="api-details" class="space-y-2 text-sm">
                        <p class="flex justify-between border-b border-gray-100 dark:border-gray-800 pb-1">
                            <span class="text-gray-400">RGB:</span> <span id="rgb-val" class="font-mono">--</span>
                        </p>
                        <p class="flex justify-between border-b border-gray-100 dark:border-gray-800 pb-1">
                            <span class="text-gray-400">CMYK:</span> <span id="cmyk-val" class="font-mono">--</span>
                        </p>
                        <p class="flex justify-between border-b border-gray-100 dark:border-gray-800 pb-1">
                            <span class="text-gray-400">Exakter Name (Web):</span> <span id="web-name-val" class="font-semibold">--</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- History with GRADIENT ABOVE -->
        <div class="bg-white dark:bg-gray-900 p-6 rounded-3xl shadow-lg border border-gray-200 dark:border-gray-800 space-y-4">
            <!-- Gradient Section (Über den zuletzt verwendeten Farben) -->
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 block">Farbverlauf der aktuellen Farbe</label>
                <div id="active-gradient" class="h-10 rounded-xl shadow-inner border border-gray-200 dark:border-gray-700 transition-all duration-300"></div>
            </div>

            <!-- History Section -->
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-3 block">Zuletzt verwendet</label>
                <div id="history-container" class="flex gap-3 flex-wrap"></div>
            </div>
        </div>
    </main>

    <script>
        // Global Dataset for complete RAL Colors
        let ralDatabase = [];

        const searchInput = document.getElementById('color-search');
        const searchResults = document.getElementById('search-results');
        const picker = document.getElementById('picker');
        const hexDisplay = document.getElementById('hex-display');
        const nameDisplay = document.getElementById('color-name-display');
        const subNameDisplay = document.getElementById('color-subname-display');
        const activeGradient = document.getElementById('active-gradient');
        const histContainer = document.getElementById('history-container');
        const statusLabel = document.getElementById('status-label');

        // 1. Online RAL Database Laden (Vollständiger Datensatz als JSON)
        async function loadRALDatabase() {
            try {
                // Lädt ein vollständiges Online-JSON aller offiziellen RAL-Farben
                const response = await fetch('https://raw.githubusercontent.com/Korchy/blender-color-matching/master/ral_c.json');
                const rawData = await response.json();
                
                // Mappe Daten in ein einfaches Durchsuchbares Format
                // Dataset Struktur enthält: Code, Namen, HEX
                ralDatabase = rawData.map(item => {
                    const info = item[1]; // ["RAL 1000", "0-9-34-20", "0-9-34-20", "#CDBA88"]
                    const rgb = item[0];  // [205, 186, 136]
                    return {
                        code: info[0], // z.B. "RAL 1000"
                        hex: info[3],  // z.B. "#CDBA88"
                        // Standard RAL Übersetzungen basierend auf bekanntem Schema
                        germanName: info[0], 
                        englishName: info[0]
                    };
                });

                // Lade ein zusätzliches Wörterbuch für deutsche/englische Volltext-Namen
                const nameRes = await fetch('https://gist.githubusercontent.com/edwinwebb/4af6edeb743156e1c89fcfb25366f9d9/raw/RalCodes.json');
                const nameData = await nameRes.json();
                
                // Anreichern mit echten deutschen & englischen Namen
                ralDatabase.forEach(item => {
                    const cleanCode = item.code.replace('RAL ', '');
                    if(nameData[cleanCode]) {
                        item.englishName = nameData[cleanCode].name;
                        // Deutsch / Englisch Mapping Suchfelder
                        item.searchQuery = `${item.code} ${nameData[cleanCode].name}`.toLowerCase();
                    }
                });

                statusLabel.innerHTML = `<i class="fa-solid fa-circle-check text-green-500"></i> RAL-System online geladen (${ralDatabase.length} Farben)`;
            } catch (err) {
                statusLabel.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Standard-Modus aktiv`;
            }
        }

        // 2. Dynamische Farb-Aktualisierung & Online API Abfrage
        async function updateColor(hex, labelEN = "", labelDE = "", save = true) {
            hexDisplay.innerText = hex.toUpperCase();
            picker.value = hex;

            // Farbverlauf DIREKT über den zuletzt verwendeten Farben
            activeGradient.style.background = `linear-gradient(90deg, #FFFFFF 0%, ${hex} 50%, #000000 100%)`;

            // Namensanzeige priorisieren (RAL > API)
            if (labelEN || labelDE) {
                nameDisplay.innerText = labelDE || labelEN;
                subNameDisplay.innerText = labelEN ? `${labelDE} / ${labelEN}` : "RAL System";
            }

            // Fetch Detail-Informationen von TheColorAPI
            try {
                const res = await fetch(`https://www.thecolorapi.com/id?hex=${hex.replace('#', '')}`);
                const data = await res.json();
                
                if (!labelEN && !labelDE) {
                    nameDisplay.innerText = data.name.value;
                    subNameDisplay.innerText = "Online API Farbbestimmung";
                }

                document.getElementById('rgb-val').innerText = data.rgb.value;
                document.getElementById('cmyk-val').innerText = data.cmyk.value;
                document.getElementById('web-name-val').innerText = data.name.value;
            } catch {
                if(!labelEN) nameDisplay.innerText = "Benutzerdefinierte Farbe";
            }

            if (save) saveHistory(hex);
        }

        // 3. Live-Suche (Deutsch, Englisch, RAL-Nummer, HEX)
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            searchResults.innerHTML = '';

            if (query.length < 1) {
                searchResults.classList.add('hidden');
                return;
            }

            // Suche in der gesamten RAL-Datenbank
            const matches = ralDatabase.filter(c => 
                c.code.toLowerCase().includes(query) || 
                (c.englishName && c.englishName.toLowerCase().includes(query)) ||
                c.hex.toLowerCase().includes(query)
            ).slice(0, 15); // Maximal 15 Ergebnisse anzeigen

            if (matches.length > 0) {
                searchResults.classList.remove('hidden');
                matches.forEach(color => {
                    const item = document.createElement('div');
                    item.className = "flex items-center gap-3 p-3 hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer transition border-b border-gray-100 dark:border-gray-800 last:border-0";
                    item.innerHTML = `
                        <div class="w-6 h-6 rounded-md border border-gray-300 flex-shrink-0" style="background-color: ${color.hex}"></div>
                        <div class="flex-1 text-sm">
                            <span class="font-bold">${color.code}</span> - <span>${color.englishName || ''}</span>
                        </div>
                        <span class="font-mono text-xs text-gray-400">${color.hex}</span>
                    `;
                    item.onclick = () => {
                        updateColor(color.hex, color.englishName, color.code);
                        searchResults.classList.add('hidden');
                        searchInput.value = `${color.code} (${color.englishName})`;
                    };
                    searchResults.appendChild(item);
                });
            } else {
                // Falls es nicht im RAL System ist, erlaube freie HEX Eingaabe
                if(query.startsWith('#') && (query.length === 4 || query.length === 7)) {
                    updateColor(query);
                    searchResults.classList.add('hidden');
                }
            }
        });

        // Event-Listener Klick außerhalb schließt die Suche
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.add('hidden');
            }
        });

        picker.addEventListener('input', (e) => updateColor(e.target.value));

        // History Management
        function saveHistory(hex) {
            let hist = JSON.parse(localStorage.getItem('forge_ral_hist') || '[]');
            if (!hist.includes(hex)) {
                hist.unshift(hex);
                localStorage.setItem('forge_ral_hist', JSON.stringify(hist.slice(0, 12)));
                renderHistory();
            }
        }

        function renderHistory() {
            histContainer.innerHTML = '';
            const hist = JSON.parse(localStorage.getItem('forge_ral_hist') || '[]');
            hist.forEach(hex => {
                const div = document.createElement('div');
                div.className = "w-10 h-10 rounded-xl cursor-pointer hover:scale-110 transition shadow-md border border-gray-300 dark:border-gray-700";
                div.style.backgroundColor = hex;
                div.title = hex;
                div.onclick = () => updateColor(hex, "", "", false);
                histContainer.appendChild(div);
            });
        }

        function toggleTheme() {
            document.getElementById('html-root').classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            icon.className = document.getElementById('html-root').classList.contains('dark') ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        // Initialize App
        loadRALDatabase();
        renderHistory();
        updateColor('#F7B500', 'Traffic yellow', 'RAL 1023'); // Standard Startfarbe
    </script>
</body>
</html>
