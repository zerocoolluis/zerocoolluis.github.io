<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Web Viewer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-info h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
    }

    .header-info p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .btn-home {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn-home:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Navigation Bar */
    .nav-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 260px;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Viewer Frame */
    .frame-wrapper {
      position: relative;
      width: 100%;
      height: 680px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* CSS Fix für Vollbildmodus */
    .frame-wrapper:fullscreen,
    .frame-wrapper:-webkit-full-screen,
    .frame-wrapper:-moz-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Verlauf Section */
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .history-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }

    .history-item {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }
    .history-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-color: var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header class="header">
    <div class="header-info">
      <h1>Web Viewer</h1>
      <p>Webseiten eingeben, betrachten und im Vollbild nutzen</p>
    </div>
    <a href="https://zerocoolluis.github.io" class="btn-home">🏠 Startseite</a>
  </header>

  <!-- Viewer Controls & Frame -->
  <main class="nav-card">
    <div class="search-bar">
      <input type="text" id="urlInput" placeholder="Webadresse eingeben (z. B. wikipedia.org)..." onkeypress="handleKeyPress(event)">
      <button onclick="loadSite(false)">Öffnen</button>
      <button class="btn-secondary" title="Im Proxy-Modus öffnen (falls blockiert)" onclick="loadSite(true)">🔓 Proxy-Modus</button>
      <button class="btn-secondary" onclick="reloadFrame()">🔄 Neu laden</button>
      <button class="btn-secondary" onclick="toggleFullscreen()">⛶ Vollbild</button>
    </div>

    <div class="frame-wrapper" id="frameContainer">
      <iframe id="webFrame" src="about:blank" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen="true"></iframe>
    </div>
  </main>

  <!-- Verlauf -->
  <section class="history-card">
    <div class="history-header">
      <h2>Zuletzt besucht</h2>
      <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="clearHistory()">Verlauf leeren</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </section>
</div>

<script>
  document.addEventListener('DOMContentLoaded', updateHistoryUI);

  function handleKeyPress(event) {
    if (event.key === 'Enter') {
      loadSite(false);
    }
  }

  function loadSite(useProxy = false) {
    const input = document.getElementById('urlInput');
    let rawUrl = input.value.trim();
    if (!rawUrl) return;

    // Automatisches Vervollständigen von https://
    if (!/^https?:\/\//i.test(rawUrl)) {
      rawUrl = 'https://' + rawUrl;
    }
    input.value = rawUrl;

    let targetUrl = rawUrl;

    // Falls Proxy-Modus gewählt wurde (für blockierte Seiten wie YouTube/Google)
    if (useProxy) {
      targetUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rawUrl);
    }

    const frame = document.getElementById('webFrame');
    frame.src = targetUrl;

    saveToHistory(rawUrl);
  }

  function reloadFrame() {
    const frame = document.getElementById('webFrame');
    if (frame.src && frame.src !== 'about:blank') {
      frame.src = frame.src;
    }
  }

  /* Funktion für echten Vollbildmodus */
  function toggleFullscreen() {
    const container = document.getElementById('frameContainer');

    if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
      if (container.requestFullscreen) {
        container.requestFullscreen();
      } else if (container.webkitRequestFullscreen) { /* Safari */
        container.webkitRequestFullscreen();
      } else if (container.msRequestFullscreen) { /* IE11 */
        container.msRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }
  }

  /* Verlauf-Steuerung */
  function saveToHistory(url) {
    let history = JSON.parse(localStorage.getItem('webViewerHistorySimple')) || [];
    history = history.filter(item => item !== url); // Duplikate entfernen
    history.unshift(url);
    if (history.length > 8) history.pop(); // Max. 8 Einträge

    localStorage.setItem('webViewerHistorySimple', JSON.stringify(history));
    updateHistoryUI();
  }

  function clearHistory() {
    localStorage.removeItem('webViewerHistorySimple');
    updateHistoryUI();
  }

  function updateHistoryUI() {
    const historyList = document.getElementById('historyList');
    const history = JSON.parse(localStorage.getItem('webViewerHistorySimple')) || [];

    if (history.length === 0) {
      historyList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; grid-column: 1 / -1;">Noch keine Seiten aufgerufen.</p>';
      return;
    }

    historyList.innerHTML = '';
    history.forEach(url => {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerText = url.replace(/^https?:\/\//i, '');
      item.title = url;
      item.onclick = () => {
        document.getElementById('urlInput').value = url;
        loadSite(false);
      };
      historyList.appendChild(item);
    });
  }
</script>

</body>
</html>
