<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Web & Media Viewer</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --secondary: #8b5cf6;
      --bg-color: #0b0f19;
      --surface: rgba(20, 29, 47, 0.75);
      --surface-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.25) 0%, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .glass-panel {
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* Header */
    .header {
      position: relative;
      text-align: center;
      padding: 20px;
    }

    .btn-home {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--surface-border);
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-home:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--primary);
      transform: translateY(-50%) scale(1.03);
    }

    h1 {
      font-size: 2.4rem;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .url-input-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      min-width: 280px;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      padding-right: 120px;
      border-radius: 14px;
      border: 1px solid var(--surface-border);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 15px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .status-tag {
      position: absolute;
      right: 12px;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      pointer-events: none;
    }

    .status-tag.yt-mode { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border: 1px solid #ef4444; }
    .status-tag.web-mode { background: rgba(59, 130, 246, 0.25); color: #93c5fd; border: 1px solid #3b82f6; }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 15px 22px;
      border-radius: 14px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      color: white;
    }

    .btn-load { background: linear-gradient(135deg, var(--primary), var(--secondary)); }
    .btn-load:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-glow); }

    .btn-action { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--surface-border); }
    .btn-action:hover { background: rgba(255, 255, 255, 0.15); }

    /* Frame Wrapper */
    .frame-container {
      position: relative;
      width: 100%;
      height: 700px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--surface-border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .frame-container:fullscreen {
      border-radius: 0;
      height: 100vh;
      width: 100vw;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* History Grid */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .history-card {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .history-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.12);
    }

    .card-title {
      font-size: 13px;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    @media (max-width: 768px) {
      .header { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .btn-home { position: static; transform: none; }
      .url-input-container { width: 100%; }
      input { padding-right: 20px; }
      .status-tag { display: none; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="glass-panel header">
    <a href="https://zerocoolluis.github.io" class="btn-home">🏠 Startseite</a>
    <h1>Smart Web & Media Viewer</h1>
    <p style="color: var(--text-muted);">Webseiten & YouTube-Videos direkt aufrufen und im Vollbild nutzen</p>
  </div>

  <!-- Viewer Controls -->
  <div class="glass-panel">
    <div class="nav-bar">
      <div class="url-input-container">
        <input type="text" id="urlInput" placeholder="Adresse oder YouTube-Link eingeben..." onkeypress="handleKey(event)">
        <span id="statusTag" class="status-tag">Bereit</span>
      </div>

      <div class="btn-group">
        <button class="btn-load" onclick="loadSite()">🌐 Öffnen</button>
        <button class="btn-action" title="Neu laden" onclick="reloadFrame()">🔄</button>
        <button class="btn-action" title="In neuem Tab öffnen" onclick="openExternal()">↗️ Ext.</button>
        <button class="btn-action" title="Vollbild" onclick="toggleFullscreen()">⛶ Vollbild</button>
      </div>
    </div>

    <!-- Frame -->
    <div class="frame-container" id="frameContainer">
      <iframe id="webFrame" src="about:blank" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Verlauf -->
  <div class="glass-panel">
    <div class="history-header">
      <h3>🕒 Zuletzt besucht</h3>
      <button class="btn-action" style="padding: 8px 14px; font-size: 13px;" onclick="clearHistory()">🗑️ Verlauf leeren</button>
    </div>
    <div class="history-grid" id="historyGrid"></div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', updateHistoryUI);

  function handleKey(event) {
    if (event.key === 'Enter') loadSite();
  }

  function processUrl(rawUrl) {
    let url = rawUrl.trim();
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    // Erkennung von YouTube Links (Normal, Shorts, Embeds)
    const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|watch\?.+&v=))([\w-]{11})/);

    if (ytMatch && ytMatch[1]) {
      return {
        type: 'youtube',
        targetUrl: `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&rel=0`,
        displayUrl: url
      };
    }

    return {
      type: 'web',
      targetUrl: url,
      displayUrl: url
    };
  }

  function loadSite(urlOverride = null) {
    const input = document.getElementById('urlInput');
    const rawUrl = urlOverride || input.value.trim();
    if (!rawUrl) return;

    const parsed = processUrl(rawUrl);
    input.value = parsed.displayUrl;

    const frame = document.getElementById('webFrame');
    const tag = document.getElementById('statusTag');

    if (parsed.type === 'youtube') {
      tag.innerText = "YouTube Mode";
      tag.className = "status-tag yt-mode";
    } else {
      tag.innerText = "Web Mode";
      tag.className = "status-tag web-mode";
    }

    frame.src = parsed.targetUrl;
    saveToHistory(parsed.displayUrl, parsed.type);
  }

  function reloadFrame() {
    const frame = document.getElementById('webFrame');
    if (frame.src && frame.src !== 'about:blank') {
      frame.src = frame.src;
    }
  }

  function openExternal() {
    const input = document.getElementById('urlInput').value.trim();
    if (input) {
      const parsed = processUrl(input);
      window.open(parsed.displayUrl, '_blank');
    }
  }

  function toggleFullscreen() {
    const container = document.getElementById('frameContainer');
    if (!document.fullscreenElement) {
      if (container.requestFullscreen) container.requestFullscreen();
      else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }

  function saveToHistory(url, type) {
    let history = JSON.parse(localStorage.getItem('smartViewerHistory')) || [];
    history = history.filter(item => item.url !== url);
    
    history.unshift({ url, type });
    if (history.length > 8) history.pop();
    
    localStorage.setItem('smartViewerHistory', JSON.stringify(history));
    updateHistoryUI();
  }

  function clearHistory() {
    localStorage.removeItem('smartViewerHistory');
    updateHistoryUI();
  }

  function updateHistoryUI() {
    const historyGrid = document.getElementById('historyGrid');
    const history = JSON.parse(localStorage.getItem('smartViewerHistory')) || [];
    
    if (history.length === 0) {
      historyGrid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1;">Noch keine Seiten aufgerufen.</p>';
      return;
    }

    historyGrid.innerHTML = '';
    history.forEach(item => {
      const card = document.createElement('div');
      card.className = 'history-card';
      card.onclick = () => loadSite(item.url);
      
      const domain = item.url.replace(/^https?:\/\//i, '').split('/')[0];
      const icon = item.type === 'youtube' ? '▶️' : '🌐';

      card.innerHTML = `
        <span>${icon}</span>
        <span class="card-title" title="${item.url}">${domain}</span>
      `;
      historyGrid.appendChild(card);
    });
  }
</script>

</body>
</html>
