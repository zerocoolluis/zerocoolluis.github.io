<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Web Viewer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-home {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.875rem;
    }

    .nav-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-bar {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .frame-wrapper {
      position: relative;
      width: 100%;
      height: 700px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .frame-wrapper:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .history-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .history-item {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Web Viewer</h1>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Unterstützt Webseiten, YouTube und Twitch</p>
    </div>
    <a href="https://zerocoolluis.github.io" class="btn-home">🏠 Startseite</a>
  </header>

  <main class="nav-card">
    <div class="search-bar">
      <input type="text" id="urlInput" placeholder="URL eingeben (z. B. twitch.tv/streamer oder youtube.com/watch?v=...)" onkeypress="if(event.key==='Enter') loadSite()">
      <button onclick="loadSite()">Öffnen</button>
      <button class="btn-secondary" onclick="toggleFullscreen()">⛶ Vollbild</button>
    </div>

    <div class="frame-wrapper" id="frameContainer">
      <iframe id="webFrame" src="about:blank" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  </main>

  <section class="history-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Zuletzt besucht</h2>
      <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="clearHistory()">Verlauf leeren</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </section>
</div>

<script>
  document.addEventListener('DOMContentLoaded', updateHistoryUI);

  function loadSite() {
    const input = document.getElementById('urlInput');
    let url = input.value.trim();
    if (!url) return;

    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    let finalEmbedUrl = url;

    // YouTube-Erkennung und Auto-Embed
    const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|watch\?.+&v=))([\w-]{11})/);
    if (ytMatch && ytMatch[1]) {
      finalEmbedUrl = `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1`;
    }

    // Twitch-Erkennung und Auto-Embed (Kanal oder Stream)
    const twitchMatch = url.match(/twitch\.tv\/([a-zA-Z0-9_]+)/);
    if (twitchMatch && twitchMatch[1]) {
      const channel = twitchMatch[1];
      const parentDomain = window.location.hostname || 'localhost';
      finalEmbedUrl = `https://player.twitch.tv/?channel=${channel}&parent=${parentDomain}`;
    }

    document.getElementById('webFrame').src = finalEmbedUrl;
    saveToHistory(url);
  }

  function toggleFullscreen() {
    const container = document.getElementById('frameContainer');
    if (!document.fullscreenElement) {
      if (container.requestFullscreen) container.requestFullscreen();
      else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }

  function saveToHistory(url) {
    let history = JSON.parse(localStorage.getItem('webViewerHistory')) || [];
    history = history.filter(item => item !== url);
    history.unshift(url);
    if (history.length > 8) history.pop();
    localStorage.setItem('webViewerHistory', JSON.stringify(history));
    updateHistoryUI();
  }

  function clearHistory() {
    localStorage.removeItem('webViewerHistory');
    updateHistoryUI();
  }

  function updateHistoryUI() {
    const historyList = document.getElementById('historyList');
    const history = JSON.parse(localStorage.getItem('webViewerHistory')) || [];
    if (history.length === 0) {
      historyList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">Noch keine Seiten aufgerufen.</p>';
      return;
    }
    historyList.innerHTML = '';
    history.forEach(url => {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerText = url.replace(/^https?:\/\//i, '');
      item.onclick = () => {
        document.getElementById('urlInput').value = url;
        loadSite();
      };
      historyList.appendChild(item);
    });
  }
</script>

</body>
</html>
