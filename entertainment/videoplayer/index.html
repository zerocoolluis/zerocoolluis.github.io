<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Media Player</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.5);
      --secondary: #ec4899;
      --bg-color: #0f172a;
      --surface: rgba(30, 41, 59, 0.7);
      --surface-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(236, 72, 153, 0.2) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      transition: background-color 0.5s ease;
      background-attachment: fixed;
    }

    /* Kino-Modus */
    body.cinema-mode {
      background: #000;
    }
    body.cinema-mode .header, 
    body.cinema-mode .history-section {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Glass Panels */
    .glass-panel {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }

    /* Header */
    .header { 
      position: relative;
      text-align: center; 
      padding: 24px; 
    }
    
    /* Home Button */
    .btn-home {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--surface-border);
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--primary);
      transform: translateY(-50%) scale(1.03);
    }

    h1 {
      font-size: 2.8rem;
      background: linear-gradient(135deg, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    /* Controls */
    .controls-wrapper {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    input {
      flex: 1;
      min-width: 280px;
      padding: 18px 24px;
      border-radius: 14px;
      border: 1px solid var(--surface-border);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 16px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    button {
      padding: 18px 30px;
      border-radius: 14px;
      border: none;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-play {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      box-shadow: 0 10px 20px rgba(236, 72, 153, 0.2);
    }
    .btn-play:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(236, 72, 153, 0.4);
    }

    .btn-cinema {
      background: rgba(255, 255, 255, 0.05);
      color: white;
      border: 1px solid var(--surface-border);
    }
    .btn-cinema:hover { background: rgba(255, 255, 255, 0.15); }

    /* Player Area */
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .player-wrapper::before {
      content: "🍿 Bereit für den Film";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.2);
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1px;
      z-index: 1;
    }
    video, iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: none; z-index: 2; background: #000;
    }
    .hidden { display: none !important; }

    /* History Rubrik */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .history-header h3 {
      font-size: 1.5rem;
      color: var(--text-main);
    }
    .btn-clear {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
    }
    .btn-clear:hover { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border-color: rgba(239, 68, 68, 0.5); }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--surface-border);
      transition: all 0.3s ease;
      position: relative;
    }
    .video-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 10px 20px var(--primary-glow);
    }
    .thumbnail {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-size: cover;
      background-position: center;
    }
    .thumbnail.mp4-thumb {
      background: linear-gradient(45deg, #1e293b, #334155);
      font-size: 2rem;
    }
    .card-info {
      padding: 12px;
    }
    .card-url {
      font-size: 13px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge.yt { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
    .badge.mp4 { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid #3b82f6; }

    @media (max-width: 640px) {
      .header {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      .btn-home {
        position: static;
        transform: none;
      }
      .btn-home:hover {
        transform: scale(1.03);
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header mit Home Button -->
  <div class="glass-panel header">
    <a href="https://zerocoolluis.github.io" class="btn-home">🏠 Startseite</a>
    <h1>Ultimate Media Player</h1>
    <p style="color: var(--text-muted);">Dein High-End Player mit intelligenter Mediathek</p>
  </div>

  <!-- Player Sektion -->
  <div class="glass-panel">
    <div class="controls-wrapper">
      <input type="text" id="videoUrl" placeholder="Füge hier eine YouTube- oder Video-URL ein..." onkeypress="handleEnter(event)">
      <button class="btn-play" onclick="processAndPlay()">▶ Abspielen</button>
      <button class="btn-cinema" onclick="toggleCinema()" id="cinemaBtn">🎥 Kino-Modus</button>
    </div>

    <div class="player-wrapper" id="playerContainer">
      <video id="htmlPlayer" controls class="hidden"></video>
      <iframe id="ytPlayer" class="hidden" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <!-- Mediathek Sektion -->
  <div class="glass-panel history-section">
    <div class="history-header">
      <h3>📚 Zuletzt angesehen</h3>
      <button class="btn-clear" onclick="clearHistory()">🗑️ Verlauf leeren</button>
    </div>
    <div class="history-grid" id="historyGrid">
      <!-- Wird per JavaScript generiert -->
    </div>
  </div>
</div>

<script>
  let isCinemaMode = false;

  document.addEventListener('DOMContentLoaded', updateHistoryUI);

  function handleEnter(e) {
    if (e.key === 'Enter') processAndPlay();
  }

  function toggleCinema() {
    isCinemaMode = !isCinemaMode;
    document.body.classList.toggle('cinema-mode', isCinemaMode);
    document.getElementById('cinemaBtn').innerHTML = isCinemaMode ? '💡 Licht an' : '🎥 Kino-Modus';
    if (isCinemaMode) {
      document.getElementById('playerContainer').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function processAndPlay(urlOverride = null) {
    const inputField = document.getElementById('videoUrl');
    let url = urlOverride || inputField.value.trim();
    if (!url) return;
    
    if (urlOverride) inputField.value = url;

    const htmlPlayer = document.getElementById('htmlPlayer');
    const ytPlayer = document.getElementById('ytPlayer');

    htmlPlayer.classList.add('hidden');
    ytPlayer.classList.add('hidden');
    htmlPlayer.pause();
    ytPlayer.src = "";

    const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|watch\?.+&v=))([\w-]{11})/);
    let type = 'mp4';
    let ytId = null;

    if (ytMatch && ytMatch[1]) {
      type = 'yt';
      ytId = ytMatch[1];
      ytPlayer.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0`;
      ytPlayer.classList.remove('hidden');
    } else {
      type = 'mp4';
      htmlPlayer.src = url;
      htmlPlayer.classList.remove('hidden');
      htmlPlayer.play();
    }

    saveToHistory(url, type, ytId);
  }

  function saveToHistory(url, type, ytId) {
    let history = JSON.parse(localStorage.getItem('ultimateVideoHistory')) || [];
    history = history.filter(item => item.url !== url);
    
    history.unshift({ url, type, ytId });
    if (history.length > 8) history.pop();
    
    localStorage.setItem('ultimateVideoHistory', JSON.stringify(history));
    updateHistoryUI();
  }

  function clearHistory() {
    localStorage.removeItem('ultimateVideoHistory');
    updateHistoryUI();
  }

  function updateHistoryUI() {
    const historyGrid = document.getElementById('historyGrid');
    const history = JSON.parse(localStorage.getItem('ultimateVideoHistory')) || [];
    
    if (history.length === 0) {
      historyGrid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1 / -1;">Deine Mediathek ist aktuell leer. Spiele ein Video ab, um es hier zu speichern.</p>';
      return;
    }

    historyGrid.innerHTML = '';
    history.forEach(item => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.onclick = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        processAndPlay(item.url);
      };
      
      let thumbHtml = '';
      if (item.type === 'yt' && item.ytId) {
        const thumbUrl = `https://img.youtube.com/vi/${item.ytId}/mqdefault.jpg`;
        thumbHtml = `<div class="thumbnail" style="background-image: url('${thumbUrl}')"></div>`;
      } else {
        thumbHtml = `<div class="thumbnail mp4-thumb">🎬</div>`;
      }

      const badgeText = item.type === 'yt' ? 'YouTube' : 'Direkt-Video';
      const badgeClass = item.type === 'yt' ? 'yt' : 'mp4';

      card.innerHTML = `
        ${thumbHtml}
        <div class="card-info">
          <div class="card-url" title="${item.url}">${item.url}</div>
          <span class="badge ${badgeClass}">${badgeText}</span>
        </div>
      `;
      historyGrid.appendChild(card);
    });
  }
</script>

</body>
</html>
