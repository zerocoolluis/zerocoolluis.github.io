<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Media Player</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --secondary: #ec4899;
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      transition: background-color 0.5s ease;
    }

    body.cinema-mode {
      background-color: #000;
      background-image: none;
    }

    body.cinema-mode .header, 
    body.cinema-mode .history-container {
      opacity: 0.1;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      z-index: 10;
    }

    /* Glassmorphism Panel */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }

    /* Header & Controls */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .controls-wrapper {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 250px;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      font-size: 16px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
    }

    button {
      padding: 16px 28px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-play {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
    }

    .btn-play:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
    }

    .btn-cinema {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid var(--glass-border);
    }

    .btn-cinema:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Player Area */
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .player-wrapper::before {
      content: "Kein Video geladen";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.3);
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 1;
    }

    video, iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 2;
      background: #000;
    }

    .hidden { display: none !important; }

    /* History Section */
    .history-container h3 {
      margin-bottom: 15px;
      font-size: 1.2rem;
      color: #94a3b8;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.2);
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .history-item:hover {
      border-color: var(--primary);
      background: rgba(139, 92, 246, 0.1);
    }

    .history-url {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
      font-size: 14px;
      color: #cbd5e1;
    }

    .badge {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge.yt { background: #ef4444; color: white; }
    .badge.mp4 { background: #3b82f6; color: white; }
  </style>
</head>
<body>

<div class="container">
  <div class="header glass-panel">
    <h1>Pro Media Player</h1>
    <p style="color: #94a3b8;">Dein privates Heimkino für direkte Videos und YouTube</p>
  </div>

  <div class="glass-panel">
    <div class="controls-wrapper">
      <input type="text" id="videoUrl" placeholder="Video-URL hier einfügen..." onkeypress="handleEnter(event)">
      <button class="btn-play" onclick="processAndPlay()">Abspielen</button>
      <button class="btn-cinema" onclick="toggleCinema()" id="cinemaBtn">🎥 Kino-Modus</button>
    </div>

    <div class="player-wrapper" id="playerContainer">
      <video id="htmlPlayer" controls class="hidden"></video>
      <iframe id="ytPlayer" class="hidden" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <div class="glass-panel history-container">
    <h3>Zuletzt angesehen</h3>
    <div class="history-list" id="historyList">
      </div>
  </div>
</div>

<script>
  let isCinemaMode = false;

  // Initial load
  document.addEventListener('DOMContentLoaded', () => {
    updateHistoryUI();
  });

  function handleEnter(e) {
    if (e.key === 'Enter') processAndPlay();
  }

  function toggleCinema() {
    isCinemaMode = !isCinemaMode;
    document.body.classList.toggle('cinema-mode', isCinemaMode);
    document.getElementById('cinemaBtn').innerText = isCinemaMode ? '💡 Licht an' : '🎥 Kino-Modus';
    
    // Smooth scroll zum Player
    if (isCinemaMode) {
      document.getElementById('playerContainer').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function processAndPlay(urlOverride = null) {
    const inputField = document.getElementById('videoUrl');
    let url = urlOverride || inputField.value.trim();
    
    if (!url) return;
    
    // Update input if triggered from history
    if (urlOverride) inputField.value = url;

    const htmlPlayer = document.getElementById('htmlPlayer');
    const ytPlayer = document.getElementById('ytPlayer');

    // Reset Player
    htmlPlayer.classList.add('hidden');
    ytPlayer.classList.add('hidden');
    htmlPlayer.pause();
    ytPlayer.src = "";

    // Regex für YouTube Links (Shorts, Watch, Embed)
    const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|watch\?.+&v=))([\w-]{11})/);
    let type = 'mp4';

    if (ytMatch && ytMatch[1]) {
      type = 'yt';
      ytPlayer.src = `https://www.youtube-nocookie.com/embed/${ytMatch[1]}?autoplay=1&rel=0`;
      ytPlayer.classList.remove('hidden');
    } else {
      type = 'mp4';
      htmlPlayer.src = url;
      htmlPlayer.classList.remove('hidden');
      htmlPlayer.play();
    }

    saveToHistory(url, type);
  }

  function saveToHistory(url, type) {
    let history = JSON.parse(localStorage.getItem('videoHistory')) || [];
    
    // Entferne Duplikate
    history = history.filter(item => item.url !== url);
    
    // Neues Element vorne hinzufügen
    history.unshift({ url, type });
    
    // Maximal 5 Einträge behalten
    if (history.length > 5) history.pop();
    
    localStorage.setItem('videoHistory', JSON.stringify(history));
    updateHistoryUI();
  }

  function updateHistoryUI() {
    const historyList = document.getElementById('historyList');
    const history = JSON.parse(localStorage.getItem('videoHistory')) || [];
    
    if (history.length === 0) {
      historyList.innerHTML = '<p style="color: #64748b; font-size: 14px;">Noch keine Videos abgespielt.</p>';
      return;
    }

    historyList.innerHTML = '';
    history.forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.onclick = () => processAndPlay(item.url);
      
      const badgeText = item.type === 'yt' ? 'YouTube' : 'Video';
      const badgeClass = item.type === 'yt' ? 'yt' : 'mp4';

      div.innerHTML = `
        <span class="history-url">${item.url}</span>
        <span class="badge ${badgeClass}">${badgeText}</span>
      `;
      historyList.appendChild(div);
    });
  }
</script>

</body>
</html>
