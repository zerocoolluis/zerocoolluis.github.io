<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Player</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-home {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.875rem;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls-bar {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
    }

    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .history-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .history-item {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .history-item:hover { border-color: var(--primary); }

    .history-url {
      font-size: 0.85rem;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-time {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Media Player</h1>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Spiel die gängigen Video-Formate ab und merkt sich den Fortschritt</p>
    </div>
    <a href="https://zerocoolluis.github.io" class="btn-home">🏠 Startseite</a>
  </header>

  <main class="player-card">
    <div class="controls-bar">
      <input type="text" id="videoUrlInput" placeholder="Direkten Video-Link eingeben (z. B. .mp4, .webm)..." onkeypress="if(event.key==='Enter') loadVideo()">
      <button onclick="loadVideo()">Abspielen</button>
    </div>

    <div class="video-wrapper">
      <video id="mainVideo" controls></video>
    </div>
  </main>

  <section class="history-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Zuletzt gesehen</h2>
      <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="clearHistory()">Verlauf leeren</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </section>
</div>

<script>
  const video = document.getElementById('mainVideo');
  let currentUrl = '';

  document.addEventListener('DOMContentLoaded', () => {
    updateHistoryUI();
    
    // Regelmäßiges Speichern des Fortschritts
    video.addEventListener('timeupdate', () => {
      if (currentUrl && video.currentTime > 0) {
        saveProgress(currentUrl, video.currentTime);
      }
    });

    // Fehler-Handling abfangen
    video.addEventListener('error', () => {
      if (video.src && video.src !== window.location.href) {
        alert("Das Video konnte nicht geladen werden. Bitte stelle sicher, dass es sich um einen direkten Video-Link (z. B. .mp4) handelt.");
      }
    });
  });

  function loadVideo(targetUrl = null, startTime = 0) {
    const input = document.getElementById('videoUrlInput');
    let url = targetUrl || input.value.trim();
    if (!url) return;

    if (!targetUrl) input.value = url;
    currentUrl = url;

    // Zeitstempel aus Verlauf laden, falls keine Zeit übergeben wurde
    if (startTime === 0) {
      const history = JSON.parse(localStorage.getItem('videoPlayerHistory')) || {};
      if (history[url] && history[url].time) {
        startTime = history[url].time;
      }
    }

    video.src = url;
    
    // Erst nach dem Laden der Daten an die Sekunde springen
    video.onloadeddata = () => {
      if (startTime > 0) {
        video.currentTime = startTime;
      }
      video.play().catch(() => {});
    };

    saveProgress(url, startTime);
  }

  function saveProgress(url, time) {
    let history = JSON.parse(localStorage.getItem('videoPlayerHistory')) || {};
    
    history[url] = {
      url: url,
      time: time,
      timestamp: Date.now()
    };

    localStorage.setItem('videoPlayerHistory', JSON.stringify(history));
    updateHistoryUI();
  }

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  function clearHistory() {
    localStorage.removeItem('videoPlayerHistory');
    updateHistoryUI();
  }

  function updateHistoryUI() {
    const historyList = document.getElementById('historyList');
    const history = JSON.parse(localStorage.getItem('videoPlayerHistory')) || {};
    
    const sortedKeys = Object.keys(history).sort((a, b) => history[b].timestamp - history[a].timestamp);

    if (sortedKeys.length === 0) {
      historyList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">Noch keine Videos abgespielt.</p>';
      return;
    }

    historyList.innerHTML = '';
    sortedKeys.forEach(key => {
      const itemData = history[key];
      const item = document.createElement('div');
      item.className = 'history-item';
      
      const fileName = itemData.url.split('/').pop().split('?')[0] || itemData.url;

      item.innerHTML = `
        <span class="history-url" title="${itemData.url}">${fileName}</span>
        <span class="history-time">Fortschritt: ${formatTime(itemData.time)}</span>
      `;

      item.onclick = () => {
        document.getElementById('videoUrlInput').value = itemData.url;
        loadVideo(itemData.url, itemData.time);
      };

      historyList.appendChild(item);
    });
  }
</script>

</body>
</html>
