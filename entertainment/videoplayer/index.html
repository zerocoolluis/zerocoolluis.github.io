<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Media Player</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1a2332;
      --border: #2a3a4e;
      --primary: #4f8cf7;
      --primary-hover: #6a9ff9;
      --text: #f0f4fa;
      --text-muted: #8ba0b8;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-title h1 { font-size:1.5rem; font-weight:600; }
    .header-title p { font-size:0.85rem; color:var(--text-muted); }
    .btn-home {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.875rem;
      transition: background 0.2s;
    }
    .btn-home:hover { background: rgba(255,255,255,0.12); }

    .player-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .controls-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .controls-bar input[type="text"] {
      flex: 1 1 200px;
      background: #0d1522;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .controls-bar input[type="text"]:focus { border-color: var(--primary); }
    .controls-bar button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .controls-bar button:hover { background: var(--primary-hover); }
    .controls-bar button:active { transform: scale(0.96); }
    .btn-secondary {
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .video-wrapper video,
    .video-wrapper iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      backdrop-filter: blur(2px);
      z-index: 5;
      border-radius: var(--radius);
      flex-direction: column;
      gap: 10px;
    }
    .loading-overlay.active { display: flex; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .history-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .history-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .history-header h2 { font-size:1.2rem; font-weight:500; }
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .history-item {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-item:hover {
      border-color: var(--primary);
      background: rgba(79,140,247,0.08);
    }
    .history-url {
      font-size:0.9rem;
      font-weight:500;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .history-meta {
      display: flex;
      justify-content: space-between;
      font-size:0.75rem;
      color:var(--text-muted);
    }
    .history-progress {
      height:4px;
      background:var(--border);
      border-radius:4px;
      margin-top:6px;
      overflow:hidden;
    }
    .history-progress-bar {
      height:100%;
      background:var(--primary);
      width:0%;
      border-radius:4px;
      transition:width 0.3s;
    }
    .empty-history { color:var(--text-muted); font-size:0.9rem; padding:8px 0; }

    .player-status {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size:0.85rem;
      color:var(--text-muted);
      padding:0 4px;
    }
    .status-error { color:#f87171; }

    @media (max-width:640px) {
      body { padding:12px; }
      .header { flex-direction:column; align-items:stretch; }
      .controls-bar input[type="text"] { flex:1 1 100%; }
      .controls-bar button { flex:1 1 auto; }
    }
  </style>
</head>
<body>

<div class="container">

  <header class="header">
    <div class="header-title">
      <h1>🎬 Universal Player</h1>
      <p>YouTube, Vimeo, Dailymotion oder direkte Video-URLs</p>
    </div>
    <a href="https://zerocoolluis.github.io" class="btn-home">🏠 Startseite</a>
  </header>

  <section class="player-card">
    <div class="controls-bar">
      <input type="text" id="videoUrlInput" placeholder="https://youtube.com/watch?v=... oder .mp4-Link" spellcheck="false" />
      <button id="loadBtn">▶ Abspielen</button>
      <button id="clearBtn" class="btn-secondary" title="Eingabefeld leeren">✕</button>
    </div>

    <div class="video-wrapper" id="videoWrapper">
      <video id="mainVideo" controls preload="metadata" playsinline style="display:none;"></video>
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <span>Lade …</span>
      </div>
    </div>

    <div class="player-status">
      <span id="videoStatus">⏸️ Bereit</span>
      <span id="timeDisplay">–</span>
    </div>
  </section>

  <section class="history-card">
    <div class="history-header">
      <h2>📜 Zuletzt gesehen</h2>
      <button id="clearHistoryBtn" class="btn-secondary" style="padding:6px 14px; font-size:0.8rem;">Verlauf leeren</button>
    </div>
    <div class="history-grid" id="historyGrid"></div>
  </section>

</div>

<script>
  (() => {
    'use strict';

    // ===== DOM =====
    const wrapper = document.getElementById('videoWrapper');
    const videoEl = document.getElementById('mainVideo');
    const input = document.getElementById('videoUrlInput');
    const loadBtn = document.getElementById('loadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const historyGrid = document.getElementById('historyGrid');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const videoStatus = document.getElementById('videoStatus');
    const timeDisplay = document.getElementById('timeDisplay');

    // ===== State =====
    let currentUrl = '';
    let currentPlatform = 'direct'; // 'direct', 'youtube', 'vimeo', 'dailymotion'
    let saveInterval = null;
    let startTimestamp = 0; // für Iframe-Zeitschätzung
    let isIframe = false;

    const STORAGE_KEY = 'videoPlayerHistory';

    // ===== Hilfsfunktionen =====
    function formatTime(seconds) {
      if (!seconds || isNaN(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function getFileName(url) {
      try {
        let file = url.split('/').pop() || url;
        file = file.split('?')[0];
        return decodeURIComponent(file) || url;
      } catch { return url; }
    }

    // ===== Plattform-Erkennung =====
    function detectPlatform(url) {
      if (/youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\//i.test(url)) return 'youtube';
      if (/vimeo\.com\/\d+/i.test(url)) return 'vimeo';
      if (/dailymotion\.com\/video\//i.test(url)) return 'dailymotion';
      if (/\.(mp4|webm|mov|avi|mkv|flv|m4v|mpg|mpeg)(\?.*)?$/i.test(url)) return 'direct';
      return 'direct'; // Fallback: versuchen als direktes Video
    }

    function extractYoutubeId(url) {
      const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?]+)/i);
      return m ? m[1] : null;
    }
    function extractVimeoId(url) {
      const m = url.match(/vimeo\.com\/(\d+)/i);
      return m ? m[1] : null;
    }
    function extractDailymotionId(url) {
      const m = url.match(/dailymotion\.com\/video\/([^_?]+)/i);
      return m ? m[1] : null;
    }

    // ===== History =====
    function getHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
    }
    function saveHistory(history) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function saveProgress(url, time) {
      if (!url || time < 0) return;
      const history = getHistory();
      history[url] = { url, time: Math.max(0, time), timestamp: Date.now() };
      saveHistory(history);
      renderHistory();
    }

    function clearHistory() {
      if (confirm('Verlauf löschen?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderHistory();
      }
    }

    function renderHistory() {
      const history = getHistory();
      const entries = Object.values(history).sort((a, b) => b.timestamp - a.timestamp);
      if (entries.length === 0) {
        historyGrid.innerHTML = `<div class="empty-history">Noch keine Videos abgespielt.</div>`;
        return;
      }
      historyGrid.innerHTML = '';
      for (const entry of entries) {
        const item = document.createElement('div');
        item.className = 'history-item';
        const fileName = getFileName(entry.url);
        const progressPercent = entry.time > 0 ? Math.min(100, (entry.time / 60) * 5) : 0;
        item.innerHTML = `
          <div class="history-url" title="${entry.url}">${fileName}</div>
          <div class="history-meta">
            <span>⏱️ ${formatTime(entry.time)}</span>
            <span>${new Date(entry.timestamp).toLocaleDateString('de-DE')}</span>
          </div>
          <div class="history-progress"><div class="history-progress-bar" style="width:${progressPercent}%;"></div></div>
        `;
        item.addEventListener('click', () => {
          input.value = entry.url;
          loadVideo(entry.url, entry.time);
        });
        historyGrid.appendChild(item);
      }
    }

    // ===== Status & UI =====
    function setStatus(text, isError = false) {
      videoStatus.textContent = text;
      videoStatus.className = isError ? 'status-error' : '';
    }

    function showLoading(show) {
      loadingOverlay.classList.toggle('active', show);
      // Automatisch nach 3 Sekunden ausblenden, falls es noch aktiv ist
      if (show) {
        setTimeout(() => {
          if (loadingOverlay.classList.contains('active')) {
            loadingOverlay.classList.remove('active');
          }
        }, 3000);
      }
    }

    function updateTimeDisplay(current, duration) {
      if (duration && duration > 0) {
        timeDisplay.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
      } else if (current >= 0) {
        timeDisplay.textContent = formatTime(current);
      } else {
        timeDisplay.textContent = '–';
      }
    }

    // ===== Player zurücksetzen =====
    function resetPlayer() {
      // Video ausblenden, stoppen
      videoEl.style.display = 'none';
      videoEl.pause();
      videoEl.src = '';
      videoEl.load();
      videoEl.onloadedmetadata = null;
      videoEl.onerror = null;
      videoEl.ontimeupdate = null;
      videoEl.onplay = null;
      videoEl.onpause = null;
      videoEl.onended = null;

      // Iframes entfernen
      const iframes = wrapper.querySelectorAll('iframe');
      iframes.forEach(ifr => ifr.remove());

      clearInterval(saveInterval);
      saveInterval = null;
      isIframe = false;
      currentPlatform = 'direct';
      showLoading(false);
      setStatus('⏸️ Bereit');
      timeDisplay.textContent = '–';
    }

    // ===== Direktes Video (HTML5) =====
    function loadDirectVideo(url, startTime = 0) {
      resetPlayer();
      currentPlatform = 'direct';
      currentUrl = url;
      videoEl.style.display = 'block';
      videoEl.src = url;
      videoEl.load();
      showLoading(true);
      setStatus('⏳ Lade …');

      videoEl.onloadedmetadata = () => {
        showLoading(false);
        if (startTime > 0 && startTime < videoEl.duration) {
          videoEl.currentTime = startTime;
        }
        videoEl.play().catch(() => {});
        setStatus('▶️ Wiedergabe');
        saveProgress(url, videoEl.currentTime);
        updateTimeDisplay(videoEl.currentTime, videoEl.duration);
      };

      videoEl.onerror = () => {
        showLoading(false);
        setStatus('❌ Fehler beim Laden', true);
        let msg = 'Unbekannter Fehler';
        if (videoEl.error) {
          switch (videoEl.error.code) {
            case 1: msg = 'Abgebrochen'; break;
            case 2: msg = 'Netzwerkfehler'; break;
            case 3: msg = 'Decoder-Fehler'; break;
            case 4: msg = 'Format nicht unterstützt'; break;
            default: msg = videoEl.error.message || msg;
          }
        }
        alert(`Video konnte nicht geladen werden:\n${msg}\n\nBitte prüfe die URL.`);
      };

      videoEl.ontimeupdate = () => {
        if (currentUrl && videoEl.currentTime > 0) {
          saveProgress(currentUrl, videoEl.currentTime);
        }
        updateTimeDisplay(videoEl.currentTime, videoEl.duration);
      };

      videoEl.onplay = () => setStatus('▶️ Wiedergabe');
      videoEl.onpause = () => setStatus('⏸️ Pause');
      videoEl.onended = () => {
        setStatus('⏹️ Ende');
        if (currentUrl) saveProgress(currentUrl, videoEl.duration);
      };
    }

    // ===== Iframe-basierte Player (YouTube, Vimeo, Dailymotion) =====
    function loadIframeVideo(url, startTime = 0, platform) {
      resetPlayer();
      currentPlatform = platform;
      currentUrl = url;
      isIframe = true;

      let embedUrl = '';
      if (platform === 'youtube') {
        const id = extractYoutubeId(url);
        if (!id) { setStatus('❌ Ungültige YouTube-URL', true); alert('YouTube-ID nicht erkannt.'); return; }
        embedUrl = `https://www.youtube.com/embed/${id}?autoplay=1&controls=1&rel=0&start=${Math.floor(startTime)}`;
      } else if (platform === 'vimeo') {
        const id = extractVimeoId(url);
        if (!id) { setStatus('❌ Ungültige Vimeo-URL', true); alert('Vimeo-ID nicht erkannt.'); return; }
        embedUrl = `https://player.vimeo.com/video/${id}?autoplay=1&loop=0&portrait=0&title=0&byline=0`;
      } else if (platform === 'dailymotion') {
        const id = extractDailymotionId(url);
        if (!id) { setStatus('❌ Ungültige Dailymotion-URL', true); alert('Dailymotion-ID nicht erkannt.'); return; }
        embedUrl = `https://www.dailymotion.com/embed/video/${id}?autoplay=1`;
      } else {
        setStatus('❌ Unbekannte Plattform', true);
        return;
      }

      showLoading(true);
      setStatus(`⏳ ${platform} lädt …`);

      const iframe = document.createElement('iframe');
      iframe.src = embedUrl;
      iframe.allow = 'autoplay; fullscreen; encrypted-media';
      iframe.allowFullscreen = true;
      iframe.style.display = 'block';
      wrapper.prepend(iframe);

      // Fortschritt speichern (geschätzt)
      let elapsed = startTime || 0;
      startTimestamp = Date.now() - (elapsed * 1000);

      iframe.onload = () => {
        showLoading(false);
        setStatus(`▶️ ${platform} läuft`);
        // Intervall starten
        if (saveInterval) clearInterval(saveInterval);
        saveInterval = setInterval(() => {
          const now = Date.now();
          const seconds = (now - startTimestamp) / 1000;
          if (seconds > 0) {
            saveProgress(currentUrl, seconds);
            updateTimeDisplay(seconds, null);
          }
        }, 2000);
        saveProgress(currentUrl, startTime || 0);
      };

      iframe.onerror = () => {
        showLoading(false);
        setStatus(`❌ ${platform} fehlgeschlagen`, true);
        alert(`Fehler beim Laden von ${platform}. Bitte prüfe die URL.`);
      };
    }

    // ===== Haupt-Ladefunktion =====
    function loadVideo(url, startTime = 0) {
      if (!url) return;
      const platform = detectPlatform(url);
      currentUrl = url;

      // Reset, dann entsprechend laden
      resetPlayer();

      switch (platform) {
        case 'youtube':
          loadIframeVideo(url, startTime, 'youtube');
          break;
        case 'vimeo':
          loadIframeVideo(url, startTime, 'vimeo');
          break;
        case 'dailymotion':
          loadIframeVideo(url, startTime, 'dailymotion');
          break;
        default:
          loadDirectVideo(url, startTime);
      }
    }

    // ===== Event-Listener =====
    loadBtn.addEventListener('click', () => {
      const url = input.value.trim();
      if (url) loadVideo(url);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        loadBtn.click();
      }
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      input.focus();
    });

    clearHistoryBtn.addEventListener('click', clearHistory);

    // ===== Tastaturkürzel (nur für direktes Video) =====
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (currentPlatform === 'direct') {
        switch (e.key) {
          case ' ':
            e.preventDefault();
            if (videoEl.paused) videoEl.play().catch(() => {});
            else videoEl.pause();
            break;
          case 'ArrowRight':
            e.preventDefault();
            videoEl.currentTime = Math.min(videoEl.currentTime + 5, videoEl.duration || 0);
            break;
          case 'ArrowLeft':
            e.preventDefault();
            videoEl.currentTime = Math.max(videoEl.currentTime - 5, 0);
            break;
          case 'f':
          case 'F':
            e.preventDefault();
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
            else videoEl.requestFullscreen().catch(() => {});
            break;
        }
      }
      // Bei Iframes können wir keine Tastaturkürzel unterstützen (außer Fullscreen)
      if (isIframe && (e.key === 'f' || e.key === 'F')) {
        e.preventDefault();
        const iframe = wrapper.querySelector('iframe');
        if (iframe) {
          if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
          else iframe.requestFullscreen().catch(() => {});
        }
      }
    });

    // ===== Initialisierung =====
    renderHistory();

    // Beispiel-URL setzen, falls kein Verlauf
    const history = getHistory();
    if (Object.keys(history).length === 0) {
      input.value = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
    } else {
      const first = Object.values(history).sort((a, b) => b.timestamp - a.timestamp)[0];
      if (first) input.value = first.url;
    }

    console.log('✅ Stabiler Universal Player gestartet.');
  })();
</script>
</body>
</html>
